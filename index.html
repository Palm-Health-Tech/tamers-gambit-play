e — the cold stone rooms where old records go to be forgotten. It guards these places with quiet territorial authority, and tamers who work with it find it develops strong opinions about which documents deserve to survive."},"g135":{"n":"Cindeen","t":"fire","hp":68,"atk":57,"df":52,"spd":68,"spa":66,"r":"common","pal":{"a":"#d9583b","b":"#863624","c":"#06d6a0","k":"#222"},"spr":["............",".....aa.....","...aaaaaa...","...akaaka...","..acaaaaca..","..aaaaaaaa..",".aaaaaaaaaa.",".bbaaaaaabb.","...baaaab...","....baab....",".....bb.....","............"],"evo":"g136","fork":null,"stage":1,"tribe":"emberkin","niche":"Cindeen inhabits coke-burning furnaces and the heated underbellies of iron foundries, where it absorbs excess heat that would otherwise warp the furnace walls. Iron-workers who understand this pay for their upkeep gladly — a Cindeen on watch extends a furnace's operational life by absorbing the destructive heat spikes."},"g136":{"n":"Blazclash","t":"fire","hp":88,"atk":100,"df":120,"spd":116,"spa":115,"r":"common","pal":{"a":"#b84a32","b":"#6e2c1e","c":"#06d6a0","k":"#222"},"spr":["............","...acccca...",".aaaaaaaaaa.",".baakaakaab.","..caaaaaac..","..aaaaaaaa..",".acaaaaaaca.",".bbaaaaaabb.","...babbab...","....b..b....","............","............"],"evo":"","fork":null,"stage":2,"tribe":"emberkin","niche":"Blazclash patrols the perimeter of fire-prone terrain with territorial intensity, marking boundaries by searing patterns into rock faces that other fire-types recognize as warnings. Ranchers in dry-country learn to read these scorch-marks as property lines — a fresh set means a Blazclash has recently staked the area as its own."},"g137":{"n":"Gillmite","t":"water","hp":62,"atk":68,"df":95,"spd":67,"spa":71,"r":"common","pal":{"a":"#3a86ff","b":"#23539e","c":"#ef476f","k":"#222"},"spr":["............","............",".....aa.....","...akaaka...",".baaaccaaab.","..baaaaaab..","...acaaca...","...baccab...","....bccb....",".....bb.....","............","............"],"evo":"g138","fork":null,"stage":1,"tribe":"tidecaller","niche":"Gillmite are found clinging to the undersides of sea-kelp fronds in thick coastal forests, where they filter-feed and anchor the kelp holdfasts with secreted adhesive. Kelp harvesters who see Gillmite on the fronds know the bed is healthy; their absence signals a diseased root system beneath."},"g138":{"n":"Drizdon","t":"water","hp":120,"atk":92,"df":105,"spd":89,"spa":97,"r":"common","pal":{"a":"#3171d8","b":"#1d4381","c":"#ef476f","k":"#222"},"spr":["............","....caac....","...aaccaa...","..aakaakaa..","..aaaaaaaa..","..aaaaaaaa..","..aaaccaaa..","..caaaaaac..",".bcacaacacb.","..baabbaab..","...bb..bb...","............"],"evo":"","fork":null,"stage":2,"tribe":"tidecaller","niche":"Drizdon are mid-water creatures that patrol the transitional zone between sunlit shallows and deep cold water, their bioluminescent patches blinking in patterns that seem to correlate with depth changes. Deep-sea fishers lower lights alongside their lines, knowing Drizdon will investigate and drive prey upward."},"g139":{"n":"Briarnub","t":"grass","hp":56,"atk":77,"df":56,"spd":52,"spa":69,"r":"common","pal":{"a":"#74c69d","b":"#477a61","c":"#fff","k":"#222"},"spr":["............","............","....aaaa....","...akaaka...","...acccca...","..aaaaaaaa..",".caaaccaaac.",".baaaaaaaab.","..bbabbabb..","....b..b....","............","............"],"evo":"g140","fork":null,"stage":1,"tribe":"thornkin","niche":"Briarnub tucks itself into the crooks of old apple trees and garden hedges, where it passes the cold months in a tight bud-curl. Home gardeners across Veridia find Briarnub nestled in their pruning piles each winter and quietly leave them there, knowing they will help the plants push harder in spring."},"g140":{"n":"Budoth","t":"grass","hp":81,"atk":117,"df":120,"spd":95,"spa":105,"r":"common","pal":{"a":"#62a885","b":"#3a644f","c":"#fff","k":"#222"},"spr":["....a..a....","...acaaca...","..aaaaaaaa..",".aackaakcaa.",".aaaaaaaaaa.",".aaaaaaaaaa.",".bacaaaacab.","..aaaaaaaa..","..acaaaaca..","..aaabbaaa..","..bbb..bbb..","............"],"evo":"","fork":null,"stage":2,"tribe":"thornkin","niche":"Budoth stations itself at the intersection of two overgrown hedge-rows, where it slowly reroutes new growth into dense, living archways. Village square keepers in Veridia's market towns sometimes pay tamers to persuade a Budoth to take up residence — a Budoth-shaped gate over a market entrance is considered an invitation to trade and fair dealing."},"g141":{"n":"Statet","t":"electric","hp":60,"atk":73,"df":64,"spd":101,"spa":84,"r":"common","pal":{"a":"#ffc300","b":"#9e7800","c":"#fff","k":"#222"},"spr":["............","............","............","..ak....ka..",".bcaaaaaacb.","..caaaaaac..","..aaaaaaaa..","..aaaaaaaa..","..bbaccabb..","....baab....",".....bb.....","............"],"evo":"g142","fork":null,"stage":1,"tribe":"voltkin","niche":"Statet perches at crossroads and town squares, especially where iron lampposts or signposts cluster together, running charge between them in slow arcing loops that light the metal faintly blue on humid nights. Children in port towns call them night-lamps and consider it good luck to find one still at the same post in the morning."},"g142":{"n":"Ampant","t":"electric","hp":76,"atk":97,"df":97,"spd":120,"spa":112,"r":"common","pal":{"a":"#d8a500","b":"#816300","c":"#fff","k":"#222"},"spr":["............","..aaaaaaaa..","..aaaaaaaa..",".aaakaakaaa.",".aaaaaaaaaa.","aaaaaccaaaaa","aaaaaaaaaaaa","bbbaaaaaabbb","...caaaac...","...bbaabb...",".....bb.....","............"],"evo":"","fork":null,"stage":2,"tribe":"voltkin","niche":"Ampant sprints along power-line routes and elevated rail spans, covering ground with an energy that makes nearby metal ring faintly. Rail workers say an Ampant that stays on the same stretch of track for more than a month is marking that section as electrically sound — and they have learned to believe it."},"g143":{"n":"Pebit","t":"rock","hp":67,"atk":63,"df":85,"spd":38,"spa":47,"r":"common","pal":{"a":"#997b66","b":"#5e4c3f","c":"#9b5de5","k":"#222"},"spr":["............","...baccab...","....aaaa....","....kcck....","....aaaa....","..aaaccaaa..",".baaaaaaaab.","..aaaaaaaa..","..bbbbbbbb..","............","............","............"],"evo":"g144","fork":null,"stage":1,"tribe":"stoneguard","niche":"Pebit follows stonemasons and wall-builders at a distance, nosing at the reject pile and occasionally rolling small stones back toward the work site with genuine purposefulness. Masons who've worked with a Pebit over years report it has opinions about which stones are structurally sound — and a tendency to roll the bad ones away before anyone picks them up."},"g144":{"n":"Flintlord","t":"rock","hp":82,"atk":101,"df":120,"spd":67,"spa":76,"r":"common","pal":{"a":"#826856","b":"#4e3e33","c":"#9b5de5","k":"#222"},"spr":["............","............","............",".aaakaakaaa.","baaaaaaaaaab",".aaaaaaaaaa.",".caacaacaac.","baacaccacaab",".baacaacaab.","..abbaabba..","..b..aa..b..",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"stoneguard","niche":"Flintlord stands watch over the old wardstone outcroppings at the high passes, pressing its body against exposed seams in a posture that looks like rest and is nothing like it. Keepers who manage the mountain shrines have learned to read its position as a gauge — when a Flintlord shifts even slightly from a seam it has held for seasons, something in the stone beneath has changed."},"g145":{"n":"Skylbit","t":"flying","hp":81,"atk":60,"df":71,"spd":90,"spa":51,"r":"common","pal":{"a":"#cde7ea","b":"#7f8f91","c":"#9b5de5","k":"#222"},"spr":["............",".....bb.....","...aa..aa...","..aak..kaa..",".aaaaaaaaaa.","aaacaaaacaaa","bcaaaaaaaacb",".bbbaaaabbb.","....aaaa....","....bbbb....","............","............"],"evo":"g146","fork":null,"stage":1,"tribe":"skykin","niche":"Skylbit is a social creature that nests in communal roosts of a hundred or more, and the colony's synchronized takeoff at dawn sounds like a sustained note struck on a very large bell. Villages with an active Skylbit roost orient their morning schedules around it — the takeoff is the alarm clock, and the community knows it."},"g146":{"n":"Zephion","t":"flying","hp":100,"atk":97,"df":87,"spd":117,"spa":82,"r":"common","pal":{"a":"#aec4c6","b":"#687576","c":"#9b5de5","k":"#222"},"spr":["............","...aaaaaa...","..aacaacaa..",".baakaakaab.","..caaaaaac..","..aaaaaaaa..","..aaaaaaaa..",".ccaaaaaacc.",".bbaaccaabb.","...bcaacb...","....baab....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"skykin","niche":"Zephion soars the high-altitude lanes above overland trade roads, occasionally swooping low to track caravans for hours before drifting away. Experienced caravan leaders treat a following Zephion as a good sign — it seems to have an instinct for routes that avoid bandits, though no one can explain the mechanism."},"g147":{"n":"Cicamite","t":"bug","hp":83,"atk":60,"df":68,"spd":73,"spa":48,"r":"common","pal":{"a":"#9ef01a","b":"#619410","c":"#ef476f","k":"#222"},"spr":["............","............","...aa..aa...",".aaakcckaaa.",".baaaaaaaab.","..aaaccaaa..","..bbaaaabb..","....caac....","....acca....","...acaaca...","...bbbbbb...","............"],"evo":"g148","fork":null,"stage":1,"tribe":"broodkin","niche":"Cicamite burrows under the root systems of old grove trees and feeds on fungal mats, rarely surfacing except during heavy rain. Woodcutters know that a grove with Cicamite is healthy at its roots — the trees there are harder and the timber lasts longer once cut."},"g148":{"n":"Buzztorn","t":"bug","hp":105,"atk":95,"df":120,"spd":110,"spa":76,"r":"common","pal":{"a":"#86cc16","b":"#507a0d","c":"#ef476f","k":"#222"},"spr":[".....aa.....","....aaaa....","...acaaca...",".aaakaakaaa.",".aacaaaacaa.",".baacaacaab.","..aaaccaaa..","..aaaaaaaa..","..aaaaaaaa..","..baaaaaab..","...babbab...","....b..b...."],"evo":"","fork":null,"stage":2,"tribe":"broodkin","niche":"Buzztorn patrols the borders between farmland and wild growth, its bulk and territorial nature keeping smaller pest species out of the field margins. Farmers who spot one on their fence line leave it alone — its presence is considered better pest deterrence than any spray, and its aggression is strictly territorial."},"g149":{"n":"Spookling","t":"ghost","hp":51,"atk":75,"df":59,"spd":67,"spa":90,"r":"common","pal":{"a":"#b07ce8","b":"#6d4c8f","c":"#ef476f","k":"#222"},"spr":["............","............","...aa..aa...","..aakaakaa..",".ccaaccaacc.",".baacaacaab.","..aaaaaaaa..","..baaccaab..","...aaaaaa...","...babbab...","....b..b....","............"],"evo":"g150","fork":null,"stage":1,"tribe":"wraithkin","niche":"Spooklings nest in children's rooms and schoolhouses, particularly where a child is struggling with something they do not have words for yet. They are mischievous in the way of shared secrets — knocking a toy off a shelf, rustling curtains — drawing the child's attention outward just long enough to break a spiral of quiet distress."},"g150":{"n":"Shadeion","t":"ghost","hp":107,"atk":113,"df":106,"spd":109,"spa":136,"r":"common","pal":{"a":"#9569c5","b":"#593f76","c":"#ef476f","k":"#222"},"spr":["............","...a....a...","..aaaaaaaa..",".aaakaakaaa.",".accaaaacca.",".aaaaaaaaaa.","aaaaaaaaaaaa","bbbaaaaaabbb","...baaaab...","....bccb....",".....bb.....","............"],"evo":"","fork":null,"stage":2,"tribe":"wraithkin","niche":"Shadeion appear in places of institutional memory — old courthouses, guild halls, the back rooms of family businesses — where decisions made long ago still shape the lives of people who weren't there to make them. Judges and council elders sometimes notice one settled in the rafters and take it as a reminder to ask whose grief they are inheriting."},"g151":{"n":"Floesy","t":"ice","hp":76,"atk":62,"df":63,"spd":80,"spa":68,"r":"common","pal":{"a":"#90e0ef","b":"#598a94","c":"#9b5de5","k":"#222"},"spr":["............",".....aa.....","....aaaa....","...akccka...","..aaaccaaa..","..aaaaaaaa..","..aaaaaaaa..","..baaccaab..","...aaaaaa...","...bbaabb...",".....bb.....","............"],"evo":"g152","fork":null,"stage":1,"tribe":"rimekin","niche":"Floesy congregates in shallow ice-meadows where frozen sedge grass pokes through snowpack, drifting between the stalks on currents too subtle to feel. Herbalists in northern settlements seek Floesy's resting places — the melt-pools beneath where it lingers carry a faint mineral cold prized for reducing swelling, and healers call the water \"still-ice tea.\""},"g152":{"n":"Hailrex","t":"ice","hp":74,"atk":82,"df":120,"spd":98,"spa":90,"r":"common","pal":{"a":"#7abecb","b":"#497279","c":"#9b5de5","k":"#222"},"spr":["............","..aa....aa..","..aaaaaaaa..",".aaakaakaaa.",".aaaaaaaaaa.",".aaaaaaaaaa.",".acaaccaaca.",".cacaaaacac.",".baacaacaab.","..bbaaaabb..","....bbbb....","............"],"evo":"","fork":null,"stage":2,"tribe":"rimekin","niche":"Hailrex dominates the exposed glacial plateaus above the snowline where no other large creature can endure the season-long freeze, its armored bulk untroubled by temperatures that crack stone. Climbers who reach the plateau in summer find the marks where Hailrex has carved shallow bowls in the ice to collect meltwater, and those bowls are the only reliable water source on the high flat."},"g153":{"n":"Pipy","t":"normal","hp":80,"atk":73,"df":55,"spd":72,"spa":66,"r":"common","pal":{"a":"#c9ada7","b":"#7c6b67","c":"#06d6a0","k":"#222"},"spr":["............",".....bb.....","....c..c....","...akaaka...","..aaaaaaaa..",".caaaaaaaac.",".aacaaaacaa.",".bcaabbaacb.","..bab..bab..","...b....b...","............","............"],"evo":"g154","fork":null,"stage":1,"tribe":"wildkin","niche":"Pipy lives in the eaves of covered bridges and the underhangs of canal locks, chirping at passing boats in a pattern that experienced navigators have learned to parse as rough weather warnings. No one taught it this — it simply noticed that people responded to certain sounds."},"g154":{"n":"Pipdon","t":"normal","hp":112,"atk":115,"df":78,"spd":114,"spa":104,"r":"common","pal":{"a":"#aa938d","b":"#665854","c":"#06d6a0","k":"#222"},"spr":[".....aa.....","...aaccaa...","..aaaaaaaa..",".aaakaakaaa.",".aaaaaaaaaa.","aaaaaaaaaaaa","baaaaaaaaaab",".aaaaaaaaaa.",".bbaabbaabb.","...ba..ab...","....b..b....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"wildkin","niche":"Pipdon stations itself at harbour mouths and river confluences, where currents meet and tides turn. Pilots claim that watching which way it faces at dawn is more reliable than the tide tables; whether this is true or simply a tradition of comfort is a debate no one wants to settle."},"g155":{"n":"Kilno","t":"fire","hp":51,"atk":77,"df":49,"spd":61,"spa":89,"r":"common","pal":{"a":"#e8702a","b":"#8f451a","c":"#ffd166","k":"#222"},"spr":["............","............",".....aa.....",".aaakaakaaa.",".aaaccccaaa.",".acacaacaca.",".caaaccaaac.",".aaaaaaaaaa.",".baaabbaaab.","..bbb..bbb..","............","............"],"evo":"g156","fork":null,"stage":1,"tribe":"emberkin","niche":"Kilno crouches in ceramic workshops and brick kilns, its body serving as a living temperature gauge — potters learn to read its posture to know when the kiln has reached the right heat without instruments. It is patient and calm by nature, rarely moving unless the temperature crosses a threshold it does not like."},"g156":{"n":"Embrion","t":"fire","hp":91,"atk":108,"df":113,"spd":105,"spa":124,"r":"common","pal":{"a":"#c55f23","b":"#763915","c":"#ffd166","k":"#222"},"spr":["............","............","..acaaaaca..",".acakaakaca.",".aaaaccaaaa.","aaaaaccaaaaa","baaaaccaaaab",".baaaaaaaab.","..aaaaaaaa..","..bbbaabbb..",".....bb.....","............"],"evo":"","fork":null,"stage":2,"tribe":"emberkin","niche":"Embrion drifts through the upper reaches of old volcanic calderas, trailing long plumes of luminous heat-vapor that locals call ember-ribbons and consider a sign of an active but stable volcano. When Embrion descend from the caldera rim, it historically precedes a pressure change in the mountain."},"g157":{"n":"Drizsy","t":"water","hp":76,"atk":64,"df":73,"spd":58,"spa":67,"r":"common","pal":{"a":"#3a86ff","b":"#23539e","c":"#ffd166","k":"#222"},"spr":["............","............","............","...ak..ka...","...aaaaaa...","..bacaacab..","...caaaac...","...aaaaaa...","...baaaab...","....bbbb....","............","............"],"evo":"g158","fork":null,"stage":1,"tribe":"tidecaller","niche":"Drizsy inhabit the freshwater springs that surface through the sea-floor in nearshore shallows, hovering over the cold upwelling vents. Fishers mark these spring-sites on their charts as Drizsy-holes — the freshwater mixing attracts unique catch, and the creatures themselves are considered good luck to spot."},"g158":{"n":"Splishmaw","t":"water","hp":115,"atk":120,"df":98,"spd":96,"spa":126,"r":"common","pal":{"a":"#3171d8","b":"#1d4381","c":"#ffd166","k":"#222"},"spr":["....a..a....","...caaaac...","...aaccaa...","..cakaakac..",".caaaaaaaac.",".aaaaccaaaa.","aaacabbacaaa","bcabb..bbacb",".bb......bb.","............","............","............"],"evo":"","fork":null,"stage":2,"tribe":"tidecaller","niche":"Splishmaw are ambush hunters of the boulder-fields at the base of sea cliffs, where they wait motionless in rock crevices for prey to pass. Coastal climbers know to watch where they place their feet at low tide — not from fear of Splishmaw, but from the unspoken agreement that this is their ground, and you are the guest."},"g159":{"n":"Budnub","t":"grass","hp":89,"atk":60,"df":68,"spd":71,"spa":54,"r":"common","pal":{"a":"#74c69d","b":"#477a61","c":"#fff","k":"#222"},"spr":["............","............","..aa....aa..","..aakaakaa..","..aacaacaa..","..aaaaaaaa..","..caaaaaac..",".baaabbaaab.","..bab..bab..","...b....b...","............","............"],"evo":"g160","fork":null,"stage":1,"tribe":"thornkin","niche":"Budnub clusters in the sunny gaps of coastal scrubland, where its rounded bud-head catches salt spray and filters it into stored moisture. Saltmoor fisherfolk leave clay bowls near Budnub clusters after storms, knowing the creature's filtered runoff is fresher than what pools in the rock-hollows."},"g160":{"n":"Budhorn","t":"grass","hp":99,"atk":105,"df":110,"spd":74,"spa":94,"r":"common","pal":{"a":"#62a885","b":"#3a644f","c":"#fff","k":"#222"},"spr":["....aaaa....","..acaaaaca..","..aaaaaaaa..",".aaakaakaaa.",".aaaaaaaaaa.",".aaaaaaaaaa.",".aaaaaaaaaa.",".aaaaaaaaaa.",".aaaaaaaaaa.",".baaaaaaaab.","..bbbbbbbb..","............"],"evo":"","fork":null,"stage":2,"tribe":"thornkin","niche":"Budhorn roams the highland meadows above the tree-line, where it uses its twin bud-horns to open soil crusts and expose the root-layer beneath for other species to graze. Goatherds in the uplands follow Budhorn herds when searching for the best summer pasture — wherever Budhorn turns the earth, the grass comes back thicker."},"g161":{"n":"Ohmkin","t":"electric","hp":81,"atk":55,"df":65,"spd":102,"spa":63,"r":"common","pal":{"a":"#ffe066","b":"#9e8a3f","c":"#f77f00","k":"#222"},"spr":["............","...aaccaa...","...aaaaaa...","...ckaakc...","...aabbaa...","..aaa..aaa..",".baaa..aaab.","..aaa..aaa..","..bbcaacbb..","....bbbb....","............","............"],"evo":"g162","fork":null,"stage":1,"tribe":"voltkin","niche":"Ohmkin nests in the stone foundations of old city walls, absorbing the deep telluric charge that moves through bedrock in seismically active zones. Geologists working in Veridia's mountain ring provinces have started keeping informal Ohmkin population maps alongside their tremor-risk assessments — the two correlate surprisingly well."},"g162":{"n":"Voltion","t":"electric","hp":98,"atk":96,"df":68,"spd":120,"spa":110,"r":"common","pal":{"a":"#d8be56","b":"#817233","c":"#f77f00","k":"#222"},"spr":["............","....caac....","...aaaaaa...","..aakcckaa..",".aaaaccaaaa.","bbaacaacaabb","..caaaaaac..","..aaaaaaaa..","..aaaccaaa..",".babbbbbbab.","..b......b..","............"],"evo":"","fork":null,"stage":2,"tribe":"voltkin","niche":"Voltion chooses a river gorge, deep harbour, or mountain pass as its range and never willingly leaves it, treating the geography as an extension of its own body. Travellers who navigate its territory safely and with respect sometimes find a clear static charge placed on their belongings — not harmful, just a kind of signature, a mark that says you passed through honestly."},"g163":{"n":"Slatenub","t":"rock","hp":69,"atk":55,"df":88,"spd":50,"spa":41,"r":"common","pal":{"a":"#8d99ae","b":"#575e6b","c":"#f1faee","k":"#222"},"spr":["............","............","...a....a...","..bakcckab..","...aaaaaa...","...aaaaaa...","..acaaaaca..","..accaacca..",".bbaaaaaabb.","...bbbbbb...","............","............"],"evo":"g164","fork":null,"stage":1,"tribe":"stoneguard","niche":"Slatenub presses its flat body against the sides of wells and cisterns, the mineral exchange from its hide gradually hardening the interior walls and reducing seepage. In Veridia's older settlements, the cisterns that have held water for four hundred years without repair all have the same grey mineral lining — a Slatenub signature."},"g164":{"n":"Quarroth","t":"rock","hp":105,"atk":110,"df":118,"spd":85,"spa":82,"r":"common","pal":{"a":"#778293","b":"#474e58","c":"#f1faee","k":"#222"},"spr":["............","............","..caaccaac..",".ccakaakacc.","caaaaaaaaaac","bcaaaaaaaacb",".aaaaaaaaaa.",".cacaaaacac.",".bbaaccaabb.","...baaaab...","....abba....","....b..b...."],"evo":"","fork":null,"stage":2,"tribe":"stoneguard","niche":"Quarroth marks the deepest workable seams in open-pit quarries by standing in them and refusing to move — a behavior that geologists have cautiously admitted is more reliable than most surveying equipment. Stone companies that still operate the old Veridia quarries pay handsomely for a bonded Quarroth."},"g165":{"n":"Zephnub","t":"flying","hp":72,"atk":50,"df":50,"spd":102,"spa":42,"r":"common","pal":{"a":"#8ecbd6","b":"#587d84","c":"#ff70a6","k":"#222"},"spr":["............","............","..caaaaaac..",".baakaakaab.","..aacaacaa..","..aaaaaaaa..","..aaaaaaaa..","..aaaaaaaa..","..baaaaaab..","...abbbba...","...b....b...","............"],"evo":"g166","fork":null,"stage":1,"tribe":"skykin","niche":"Zephnub is a tiny first-stage skykin that hatches in clifftop nests and spends its first weeks gliding rather than flying, drifting enormous distances on updrafts before it figures out how to climb back up. Children along coastal paths often find Zephnub that have drifted miles from their nests, and the tradition is to carry them uphill and release them from the highest point you can reach."},"g166":{"n":"Breezdon","t":"flying","hp":112,"atk":95,"df":91,"spd":120,"spa":81,"r":"common","pal":{"a":"#78acb5","b":"#48676c","c":"#ff70a6","k":"#222"},"spr":["............","...aaaaaa...","..aaaaaaaa..",".aaakaakaaa.","aacaccccacaa","acaaaaaaaaca","bbaaaccaaabb","..bacaacab..","...aaaaaa...","...bbbbbb...","............","............"],"evo":"","fork":null,"stage":2,"tribe":"skykin","niche":"Breezdon is a heavy-bodied evolved form that no longer soars for pleasure — it crosses distances in powerful, direct wingbeats, arriving exactly where it intends, no detours. Tamers use bonded Breezdon as courier mounts in terrain too rough for roads, and the creature's no-nonsense flight style has made it a favorite of couriers who are already late."},"g167":{"n":"Larvet","t":"bug","hp":76,"atk":64,"df":72,"spd":67,"spa":51,"r":"common","pal":{"a":"#aacc00","b":"#697e00","c":"#f77f00","k":"#222"},"spr":["............","............","............","....kaak....",".aaaaaaaaaa.",".caaaaaaaac.",".aaacaacaaa.",".aaaaccaaaa.",".bbbcbbcbbb.","....b..b....","............","............"],"evo":"g168","fork":null,"stage":1,"tribe":"broodkin","niche":"Larvet spins loose silk threads across the stems of marsh grasses and wetland reeds, weaving loose mats that trap organic debris and slowly build up the soft ground beneath. Fen-walkers who know where Larvet colonies work can cross marshy ground that would swallow anyone else."},"g168":{"n":"Weevhorn","t":"bug","hp":112,"atk":98,"df":88,"spd":114,"spa":78,"r":"common","pal":{"a":"#90ad00","b":"#566700","c":"#f77f00","k":"#222"},"spr":["............","..aaaaaaaa..",".bbaaaaaabb.","...akaaka...","...aaccaa...",".acaaaaaaca.","bcacaaaacacb",".bacaaaacab.","..aaaaaaaa..","..caabbaac..","..bbb..bbb..","............"],"evo":"","fork":null,"stage":2,"tribe":"broodkin","niche":"Weevhorn drills neat, round channels into deadwood and dried seed pods, the sound of its work carrying through quiet forest mornings like distant tapping. Woodworkers prize Weevhorn-worked timber not for use but as a curiosity — the tunnels left behind form patterns inside the grain that look almost deliberate."},"g169":{"n":"Phantpup","t":"ghost","hp":35,"atk":95,"df":75,"spd":50,"spa":114,"r":"common","pal":{"a":"#b07ce8","b":"#6d4c8f","c":"#f1faee","k":"#222"},"spr":["............","....a..a....","...aaaaaa...","...akaaka...","..ccaccacc..","..aaccccaa..","..aaaaaaaa..","..aaaaaaaa..","..baaaaaab..","...bbaabb...",".....bb.....","............"],"evo":"g170","fork":null,"stage":1,"tribe":"wraithkin","niche":"Phantpups are small and puppy-shaped, trailing children and the elderly through busy markets and narrow town lanes. They're not protective in any fighting sense; they simply stay close to anyone who seems likely to be overlooked that day, sitting at the feet of the lonely until someone notices and asks who the small shadow belongs to."},"g170":{"n":"Gloomion","t":"ghost","hp":74,"atk":120,"df":101,"spd":73,"spa":144,"r":"common","pal":{"a":"#9569c5","b":"#593f76","c":"#f1faee","k":"#222"},"spr":["....c..c....","...acaaca...","...acaaca...","..aakaakaa..","..aaaaaaaa..",".aacaaaacaa.",".acaaaaaaca.",".baaaaaaaab.","..bcaaaacb..","...baaaab...","....baab....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"wraithkin","niche":"Gloomions are found in the places people go when they need to be invisible for a while — back alleys, empty parks at midday, the far end of long piers. They don't judge and they don't intervene; they simply exist alongside whoever is there, a quiet companion to the specific dignity of needing to fall apart where no one is watching."},"g171":{"n":"Haille","t":"ice","hp":54,"atk":67,"df":62,"spd":58,"spa":74,"r":"common","pal":{"a":"#90e0ef","b":"#598a94","c":"#ff70a6","k":"#222"},"spr":["............","............","..a......a..",".aaakaakaaa.",".acaaaaaaca.",".acccccccca.",".aaaaaaaaaa.",".bbaaaaaabb.","...bbaabb...",".....bb.....","............","............"],"evo":"g172","fork":null,"stage":1,"tribe":"rimekin","niche":"Haille skims the surface of ice-locked lakes in graceful looping arcs, its passage carving figure-like traces that freeze in complex interlocking patterns by nightfall. Villages built on frozen lake shores hold Haille-trace festivals each midwinter where children trace the patterns in lamplight and elders read the shapes as a kind of communal fortune — not prophecy, just a reason to gather in the cold."},"g172":{"n":"Cryoion","t":"ice","hp":105,"atk":81,"df":93,"spd":103,"spa":89,"r":"common","pal":{"a":"#7abecb","b":"#497279","c":"#ff70a6","k":"#222"},"spr":["............","....bbbb....","...a....a...","..ck....kc..","..aaa..aaa..",".baacaacaab.","..aaaaaaaa..","..acaccaca..",".baaabbaaab.","..aac..caa..","..bbbaabbb..",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"rimekin","niche":"Cryoion moves through snowstorms as though the blizzard parts for it, trailing a wake of ice crystals that catch the cold light and glitter faintly against dark sky. Navigation parties lost in mountain storms have described following the faint glitter of a Cryoion to shelter — the creature is not leading them, but it always moves toward the coldest still air, which is also the leeward side of a ridge."},"g173":{"n":"Mokling","t":"normal","hp":65,"atk":92,"df":68,"spd":68,"spa":83,"r":"common","pal":{"a":"#c9ada7","b":"#7c6b67","c":"#ff70a6","k":"#222"},"spr":["............","...aaaaaa...","..ccaaaacc..","..aakaakaa..",".caaccccaac.","baaaaccaaaab",".acaaaaaaca.",".aaacaacaaa.",".baaaaaaaab.","..bbcaacbb..","....bbbb....","............"],"evo":"g174","fork":null,"stage":1,"tribe":"wildkin","niche":"Mokling drifts through upland villages near the tree-line, pausing at windows and doorframes where the light changes. Families who leave it a bowl of warm broth find it returns in winter, settling near the hearth like a piece of the season that decided to stay."},"g174":{"n":"Nibos","t":"normal","hp":110,"atk":112,"df":103,"spd":92,"spa":101,"r":"common","pal":{"a":"#aa938d","b":"#665854","c":"#ff70a6","k":"#222"},"spr":["............","...acaaca...","..aaaaaaaa..","..aakaakaa..","..aaaaaaaa..",".cacaaaacac.",".acaaaaaaca.","bbaaaccaaabb","..bbbbbbbb..","............","............","............"],"evo":"","fork":null,"stage":2,"tribe":"wildkin","niche":"Nibos ranges the high passes between settlements, often the first creature travellers encounter after a difficult crossing. Experienced mountain guides leave small cairns with dried food at regular intervals — not to train Nibos, but because they have noticed it follows the cairn-line anyway and sometimes arrives before they do."},"g175":{"n":"Pyrsy","t":"fire","hp":84,"atk":66,"df":63,"spd":81,"spa":76,"r":"common","pal":{"a":"#ff7b54","b":"#9e4c34","c":"#ff70a6","k":"#222"},"spr":["............",".....aa.....",".....cc.....","....kcck....","..aaaaaaaa..",".acccaaccca.","baaaaaaaaaab",".bbacaacabb.","...aaaaaa...","...bbaabb...",".....bb.....","............"],"evo":"g176","fork":null,"stage":1,"tribe":"emberkin","niche":"Pyrsy nests in the warm updrafts above active lava tubes, riding thermals for hours at a time with minimal wing effort. In coastal volcanic regions, fishing communities watch their flight patterns at dawn — Pyrsy that circle low instead of high signal that the tube venting has increased and the nearby shallows may heat up."},"g176":{"n":"Scorgore","t":"fire","hp":99,"atk":85,"df":120,"spd":120,"spa":98,"r":"common","pal":{"a":"#d86847","b":"#813e2a","c":"#ff70a6","k":"#222"},"spr":["............",".....cc.....","...aaccaa...","...akaaka...","...cccccc...","..aaaaaaaa..","..aaaaaaaa..",".baaaaaaaab.","..aaabbaaa..",".baca..acab.","..bbbccbbb..",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"emberkin","niche":"Scorgore occupies the deepest thermal pools in known cave systems, where it absorbs geothermal energy directly through its belly plates. Cave guides leave food offerings at pool edges to maintain a Scorgore's goodwill — an irritated one can raise the pool temperature enough to make cave passage dangerous."},"g177":{"n":"Aquo","t":"water","hp":73,"atk":53,"df":57,"spd":62,"spa":56,"r":"common","pal":{"a":"#4cc9f0","b":"#2f7c94","c":"#f77f00","k":"#222"},"spr":["............","...ca..ac...","...caaaac...","..cckaakcc..",".baaaaaaaab.","..baabbaab..","...ba..ab...","....a..a....","....aaaa....","....bbbb....","............","............"],"evo":"g178","fork":null,"stage":1,"tribe":"tidecaller","niche":"Aquo live in the turbid brackish water of river deltas where silt clouds visibility to zero, navigating entirely by lateral-line pressure sense. River-delta pilots who have bonded with an Aquo trust them to read the shifting sandbars through murk that would ground any boat guided by sight alone."},"g178":{"n":"Bubbmaw","t":"water","hp":81,"atk":115,"df":120,"spd":99,"spa":121,"r":"common","pal":{"a":"#40aacc","b":"#26667a","c":"#f77f00","k":"#222"},"spr":["....acca....","...aaccaa...","..aaaaaaaa..","..ackaakca..",".aaaaaaaaaa.","baaaaaaaaaab",".baaaaaaaab.","..baaaaaab..","...bccccb...","....bbbb....","............","............"],"evo":"","fork":null,"stage":2,"tribe":"tidecaller","niche":"Bubbmaw station themselves at the mouths of sea-caves that trap air pockets, where they have learned to use the pressure differential to stun prey that ventures near the opening. Cave-diving instructors warn students about Bubbmaw-caves not because the creature is dangerous but because panicking near one makes it worse for both of you."},"g179":{"n":"Briary","t":"grass","hp":70,"atk":55,"df":79,"spd":50,"spa":50,"r":"common","pal":{"a":"#52b788","b":"#327154","c":"#9b5de5","k":"#222"},"spr":["............","...ab..ba...","..aa....aa..",".aaakaakaaa.",".baaaaaaaab.","..aaaaaaaa..","..aaaaaaaa..",".bcaaccaacb.","..aaaaaaaa..","..bbbbbbbb..","............","............"],"evo":"g180","fork":null,"stage":1,"tribe":"thornkin","niche":"Briary lives in the deep interior of old briar thickets so dense that light barely reaches the ground, and it is rarely seen outside its thorned sanctuary. When one does emerge and walk calmly through a village, the old word for it is 'the slow permission' — its appearance is taken as a sign that something long-stuck is finally ready to move."},"g180":{"n":"Sproutgeist","t":"grass","hp":81,"atk":112,"df":120,"spd":78,"spa":101,"r":"common","pal":{"a":"#459b73","b":"#295d45","c":"#9b5de5","k":"#222"},"spr":["............",".....aa.....","..acaaaaca..",".bbakaakabb.","...acaaca...","...aaccaa...","...caaaac...","...aaaaaa...","..bcabbacb..","...ba..ab...","....b..b....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"thornkin","niche":"Sproutgeist drifts through twilight forests trailing faint bioluminescent spores that settle on bark and briefly illuminate old root-networks. Travelers lost in woodland at dusk follow Sproutgeist not because it leads anywhere — it does not — but because its light reveals the root-paths that always run toward old settlements."},"g181":{"n":"Ohmle","t":"electric","hp":63,"atk":40,"df":64,"spd":80,"spa":46,"r":"common","pal":{"a":"#ffc300","b":"#9e7800","c":"#06d6a0","k":"#222"},"spr":["............","...a....a...","..caaaaaac..","..aakaakaa..",".caaaaaaaac.",".aaaaccaaaa.",".baaaaaaaab.","..baaaaaab..","...bcaacb...","....bbbb....","............","............"],"evo":"g182","fork":null,"stage":1,"tribe":"voltkin","niche":"Ohmle settles into tidal zones at river mouths, where fresh and salt water meet and the ionic gradient creates a mild natural current it can drink from. Ferrymen on estuarine crossings watch for Ohmle floating in the shallows — they know the current reads in that channel are steady enough to cross safely."},"g182":{"n":"Amphorn","t":"electric","hp":84,"atk":84,"df":94,"spd":120,"spa":97,"r":"common","pal":{"a":"#d8a500","b":"#816300","c":"#06d6a0","k":"#222"},"spr":[".....cc.....",".....aa.....","...caaaac...","...akaaka...","..aaaaaaaa..",".aaaaaaaaaa.",".baaaaaaaab.","..aaaccaaa..","..caaaaaac..","..acccccca..","..bbbaabbb..",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"voltkin","niche":"Amphorn is a rare sight in the high mountain passes of Veridia's spine range, where it walks the ridge-lines alone, its paired horns trailing arcs of St. Elmo's fire on clear nights. Pilgrims crossing the mountain routes consider a sighting of Amphorn to be proof the pass is safe to traverse — not because it clears the road, but because it only tolerates the passes that are already sound."},"g183":{"n":"Rubbkin","t":"rock","hp":63,"atk":60,"df":89,"spd":50,"spa":45,"r":"common","pal":{"a":"#8d99ae","b":"#575e6b","c":"#ef476f","k":"#222"},"spr":["............","....acca....","..acaccaca..","..aakaakaa..","..aaaccaaa..",".acaaaaaaca.",".baaaaaaaab.","..baaccaab..","...baaaab...","....baab....",".....bb.....","............"],"evo":"g184","fork":null,"stage":1,"tribe":"stoneguard","niche":"Rubbkin collects smooth stones in the worn pouch of its chest cavity and presents them, one at a time, to people it has decided to trust. The gesture takes patience — it may carry a stone for weeks before offering it. In the hill towns, being given a stone by a Rubbkin is considered a genuine mark of good character, more reliable than most human references."},"g184":{"n":"Shaleos","t":"rock","hp":81,"atk":83,"df":120,"spd":66,"spa":62,"r":"common","pal":{"a":"#778293","b":"#474e58","c":"#ef476f","k":"#222"},"spr":["....a..a....","...aaaaaa...","..caaaaaac..",".aaakaakaaa.","baaaaaaaaaab",".baaaaaaaab.","..aaaaaaaa..","..caaaaaac..","..aaaccaaa..","..baaaaaab..","...babbab...","....b..b...."],"evo":"","fork":null,"stage":2,"tribe":"stoneguard","niche":"Shaleos stands in the shallows of coastal estuaries where fresh water meets salt, its layered slate body filtering particulates from the tidal exchange. Shellfish beds near a Shaleos colony stay cleaner than those without — it is the reason certain fishing villages have banned their removal despite occasional complaints from boat owners whose hulls it scrapes."},"g185":{"n":"Breezbit","t":"flying","hp":74,"atk":46,"df":65,"spd":98,"spa":39,"r":"common","pal":{"a":"#a8dadc","b":"#688788","c":"#f77f00","k":"#222"},"spr":["............","............","....a..a....","..ackaakca..","..aaaaaaaa..","..aaaccaaa..","..aacaacaa..","..aacaacaa..","..caabbaac..","..bcb..bcb..","...b....b...","............"],"evo":"g186","fork":null,"stage":1,"tribe":"skykin","niche":"Breezbit skips just above the wave-tops over open ocean, riding the compression layer between water and air with the ease of a stone skipping a pond. Sailors becalmed in the open water watch Breezbit with complicated feelings — the creature moves effortlessly while the sails hang slack, and some tamers claim a bonded Breezbit can coax a breath of wind from a dead-calm sky."},"g186":{"n":"Breezhorn","t":"flying","hp":102,"atk":120,"df":77,"spd":120,"spa":102,"r":"common","pal":{"a":"#8eb9bb","b":"#556f70","c":"#f77f00","k":"#222"},"spr":["............","............","...aaaaaa...","..aakaakaa..",".aaaccccaaa.",".aaacaacaaa.","aaaaaaaaaaaa","baaaaaaaaaab",".bbbaaaabbb.","....acca....","....baab....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"skykin","niche":"Breezhorn has a curving bony protrusion that splits the air in front of its skull, producing a resonant hum audible from a half-kilometer away as it cruises at full speed. Coastal communities time the passing of Breezhorn like a seasonal clock — the migration hum in spring and fall marks the turn of trading seasons more reliably than any calendar."},"g187":{"n":"Skitsy","t":"bug","hp":66,"atk":67,"df":73,"spd":54,"spa":54,"r":"common","pal":{"a":"#bfd200","b":"#768200","c":"#ffd166","k":"#222"},"spr":["............","............",".....aa.....",".acakaakaca.",".aaaaccaaaa.",".aaaaaaaaaa.",".bcaaaaaacb.","..bbaaaabb..","....cccc....","....baab....",".....bb.....","............"],"evo":"g188","fork":null,"stage":1,"tribe":"broodkin","niche":"Skitsy colonizes the underside of wooden docks and bridge planks near tidal estuaries, feeding on barnacle spats and water-softened algae. Harbor masters track Skitsy populations as a proxy for water quality — a healthy colony means the estuary is clean; a thinning one means something upstream has gone wrong."},"g188":{"n":"Weevdon","t":"bug","hp":120,"atk":103,"df":105,"spd":84,"spa":82,"r":"common","pal":{"a":"#a2b200","b":"#616a00","c":"#ffd166","k":"#222"},"spr":[".....aa.....","...aaccaa...","...aaaaaa...","..ackaakca..",".aacaaaacaa.",".baaaaaaaab.","..aaaaaaaa..","..baaaaaab..","...baaaab...","....baab....",".....aa.....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"broodkin","niche":"Weevdon is the largest of the weevil line, capable of felling a sickly sapling by boring through its base over a single season. Foresters who manage diseased stands sometimes guide Weevdon toward trees already marked for removal, letting the creature do selective work that would otherwise take a crew a week."},"g189":{"n":"Phantet","t":"ghost","hp":54,"atk":82,"df":52,"spd":53,"spa":98,"r":"common","pal":{"a":"#b07ce8","b":"#6d4c8f","c":"#f77f00","k":"#222"},"spr":["............","............","...caaaac...","...akaaka...","..caccccac..",".caaaccaaac.",".baacaacaab.","..bbaaaabb..","....baab....",".....aa.....",".....bb.....","............"],"evo":"g190","fork":null,"stage":1,"tribe":"wraithkin","niche":"Phantets are the smallest and youngest of the wraith lines, barely larger than a cupped hand, and they orbit the threshold moments of childhood — the first day somewhere new, the last night before a big change. Parents in coastal towns leave a window cracked on the eve of a child's departure, believing a Phantet will come to ease the goodbye."},"g190":{"n":"Duskgeist","t":"ghost","hp":82,"atk":109,"df":120,"spd":101,"spa":131,"r":"common","pal":{"a":"#9569c5","b":"#593f76","c":"#f77f00","k":"#222"},"spr":["............","............","....a..a....","...akaaka...","..acaaaaca..",".caaaaaaaac.",".acaaaaaaca.",".aaaaaaaaaa.",".aaaaaaaaaa.",".bbaaaaaabb.","...babbab...","....b..b...."],"evo":"","fork":null,"stage":2,"tribe":"wraithkin","niche":"Duskgeists appear at twilight in the spaces between one life chapter and the next — empty apartments the day before a new tenant arrives, harbors the morning after a ship finally departs. They seem to metabolize transition itself, and people who encounter one report a strange peace, as if the ending has been witnessed and so it is allowed to be real."},"g191":{"n":"Floeeen","t":"ice","hp":68,"atk":75,"df":54,"spd":71,"spa":82,"r":"common","pal":{"a":"#90e0ef","b":"#598a94","c":"#ef476f","k":"#222"},"spr":["............","............","..aaaaaaaa..",".aackaakcaa.",".aacaaaacaa.",".aaccaaccaa.","baaaaaaaaaab",".aaaaccaaaa.",".bbbbbbbbbb.","............","............","............"],"evo":"g192","fork":null,"stage":1,"tribe":"rimekin","niche":"Floeeen gathers in the uppermost air currents above the snowpack, invisible except on the clearest winter days when its body catches the slant light and throws tiny prisms across the landscape below. When a Floeeen descent brings its prisms to ground level, people say the cold is \"speaking\" — it is simply an air-pressure change the Floeeen is tracking, but the accompanying hush before a storm front feels like something that wants listening to."},"g192":{"n":"Blizclash","t":"ice","hp":102,"atk":119,"df":110,"spd":80,"spa":131,"r":"common","pal":{"a":"#7abecb","b":"#497279","c":"#ef476f","k":"#222"},"spr":["....b..b....","..aa.bb.aa..","..ac....ca..",".aaak..kaaa.",".aacaaaacaa.",".acaaaaaaca.",".acaaaaaaca.",".baaaaaaaab.","..aaaaaaaa..","..bbaaaabb..","....cbbc....","....b..b...."],"evo":"","fork":null,"stage":2,"tribe":"rimekin","niche":"Blizclash commands the most violent winter storms, its presence marking the center of a blizzard's rotation as the eye marks a hurricane — a zone of eerie stillness within the chaos. Those few who have encountered Blizclash in the wild describe a strange calm, standing in the quiet while a wall of white fury spins around them; the creature does not pursue, it simply occupies the storm's still heart."},"g193":{"n":"Snugkin","t":"normal","hp":70,"atk":44,"df":73,"spd":57,"spa":40,"r":"common","pal":{"a":"#c9ada7","b":"#7c6b67","c":"#ff70a6","k":"#222"},"spr":["............","....a..a....","..aaaaaaaa..","..bakaakab..","...aaaaaa...","...aaaaaa...",".cacaaaacac.",".caaaaaaaac.",".bcaaaaaacb.","..baaccaab..","...bbbbbb...","............"],"evo":"g194","fork":null,"stage":1,"tribe":"wildkin","niche":"Snugkin appears in children's rooms and sickrooms unbidden, curling into the space between a restless sleeper and the wall as though it has always been there. Parents who try to remove one find the patient wakes and asks for it back within the hour. At Saltmoor's Shared Care House, trained Snugkin work short rounds: their whiskers notice rising skin heat, they carry and press clean-bloom gauze to small wounds, then curl beside frightened patients until a healer arrives. They buy time rather than cure, and staff enforce rest between rounds because a Snugkin will otherwise keep working past exhaustion."},"g194":{"n":"Tuftlord","t":"normal","hp":101,"atk":117,"df":103,"spd":83,"spa":105,"r":"common","pal":{"a":"#aa938d","b":"#665854","c":"#ff70a6","k":"#222"},"spr":["............","..a......a..",".caaaaaaaac.",".backaakcab.","..baaaaaab..","...aaaaaa...","...aaaaaa...","...aaaaaa...","..aaabbaaa..","..bbb..bbb..","............","............"],"evo":"","fork":null,"stage":2,"tribe":"wildkin","niche":"Tuftlord moves between households in a town with the slow deliberateness of something that has agreed to look after all of them. It appears at difficult moments — births, deaths, arguments that have gone on too long — and its arrival is understood by everyone present as a signal to stop and breathe."},"g195":{"n":"Scorpup","t":"fire","hp":88,"atk":72,"df":64,"spd":79,"spa":83,"r":"common","pal":{"a":"#e8702a","b":"#8f451a","c":"#06d6a0","k":"#222"},"spr":["............","............","....aaaa....","..bakaakab..","...aaaaaa...","...caaaac...","...caaaac...","..baaaaaab..","...aabbaa...","..bab..bab..","...b....b...","............"],"evo":"g196","fork":null,"stage":1,"tribe":"emberkin","niche":"Scorpup skitters across hot desert pans and sun-baked clay flats, where it feeds on the radiant heat stored in the earth after a full day of sun. Nomads traveling across salt flats know that a Scorpup following the group means the ground ahead is still hot enough to walk on without resting — they use it as an instinctive path-finder."},"g196":{"n":"Pyrath","t":"fire","hp":111,"atk":88,"df":116,"spd":114,"spa":101,"r":"common","pal":{"a":"#c55f23","b":"#763915","c":"#06d6a0","k":"#222"},"spr":["............","....aaaa....","..aaaaaaaa..","..aakaakaa..",".aaaaaaaaaa.",".caccccccac.","aaaaaaaaaaaa","bcaaaaaaaacb",".baaaaaaaab.","..bbabbabb..","....b..b....","............"],"evo":"","fork":null,"stage":2,"tribe":"emberkin","niche":"Pyrath haunts the rim-cliffs of ancient calderas, where it carves nest-cups into the basalt with its heat-hardened beak. Climbers who find Pyrath nest-cups use them as reliable handholds and sheltered bivouac spots — the basalt around a fresh nest is thermally treated and far less likely to crumble."},"pyrethos":{"n":"Pyrethos","t":"fire","hp":120,"atk":120,"df":120,"spd":108,"spa":138,"r":"legend","pal":{"a":"#e8702a","b":"#7f3d17","c":"#ffd166","k":"#fff"},"spr":["....aaaa....","...caaaac...","..aaaaaaaa..",".aaakaakaaa.","aaacaaaacaaa","bcaaaaaaaacb",".bcaaaaaacb.","..aaaaaaaa..","..baaccaab..","...aaaaaa...","...bbbbbb...","............"],"evo":"","fork":null,"stage":1,"tribe":"emberkin","niche":"Pyrethos dwells in the throat of active stratovolcanoes, occasionally surfacing on the outer cone during eruption events where it is seen soaring through pyroclastic columns. Ancient cultures built temples at the base of its volcano, interpreting its rare appearances as a message from the mountain that the eruption would be survivable."},"voltyrant":{"n":"Voltyrant","t":"electric","hp":120,"atk":120,"df":120,"spd":120,"spa":138,"r":"legend","pal":{"a":"#ffd60a","b":"#8c7505","c":"#ffd166","k":"#fff"},"spr":["...aa..aa...","...aaaaaa...","...aaaaaa...","...akaaka...","baaaaaaaaaab",".aaaaccaaaa.",".aaaaccaaaa.","baccaaaaccab",".baacaacaab.","..bbbccbbb..",".....bb.....","............"],"evo":"","fork":null,"stage":1,"tribe":"voltkin","niche":"Voltyrant descends from storm-ridge territories only during the worst tempests, when the sky charge is so dense it can feed without hunting. Sailors who have survived being on the water during a Voltyrant feeding event describe seeing a great winged silhouette moving inside the lightning, unhurried, as though the storm itself was breathing."},"glaciornis":{"n":"Glaciornis","t":"ice","hp":120,"atk":120,"df":120,"spd":120,"spa":132,"r":"legend","pal":{"a":"#90e0ef","b":"#4f7b83","c":"#ffd166","k":"#fff"},"spr":["....aaaa....","..caaaaaac..",".baaccccaab.","..aakaakaa..","..baaaaaab..","...aaaaaa...","..acaccaca..","..baabbaab..","...bb..bb...","............","............","............"],"evo":"","fork":null,"stage":1,"tribe":"rimekin","niche":"Glaciornis nests in the highest sea-cliffs above the frost line where ocean and ice meet, its great wings catching updrafts off the cold water to ride for hours without a single beat. Coastal peoples who see Glaciornis circling overhead in the late season know the deep-water cold current has arrived early — fishers call it the \"glacier shadow\" and consider the sighting both a warning and a kind of annual blessing."},"umbrageist":{"n":"Umbrageist","t":"ghost","hp":120,"atk":120,"df":120,"spd":120,"spa":144,"r":"legend","pal":{"a":"#9d4edd","b":"#562a79","c":"#ffd166","k":"#fff"},"spr":["............","...aa..aa...","...caaaac...","..aakaakaa..",".aacaaaacaa.","baaaaaaaaaab",".aaacaacaaa.",".aaccaaccaa.",".bacaccacab.","..baaaaaab..","...baccab...","....bbbb...."],"evo":"","fork":null,"stage":1,"tribe":"wraithkin","niche":"Umbrageist are the largest and oldest of the wraithkin, found only in places where grief has been accumulating for generations — ancient battlefields turned to farmland, harbors that swallowed whole fleets, forests where villages once stood. They do not drift; they settle, roots-deep, becoming part of the landscape's long memory, and the land around them is always somehow gentler than it should be."},"sammy":{"n":"Sammy","t":"normal","hp":95,"atk":55,"df":90,"spd":15,"spa":50,"r":"unique","pal":{"t":"#d9a066","w":"#f4ead8","d":"#8a5a3a","k":"#222","g":"#3a7d44","q":"#74c69d"},"spr":["............","............",".tt......tt.",".tttttttttt.",".ttkttttktt.",".tttwwwwttt.",".ttwwkkwwtt.",".ttwwwwwwtt.",".gggggggqgg.","ttwwwwwwwwtt","ttwwwwwwwwtt",".tt..tt..tt."],"evo":"","fork":null,"stage":1,"tribe":"wildkin","niche":"Sammy is Veridia's most companionable species — a stocky, green-bandana'd bulldog who attaches to a single person and stays. Travellers in difficulty often report finding one sitting next to them on an empty road without any clear memory of it arriving."},"tidekit":{"n":"Tidekit","t":"water","hp":48,"atk":44,"df":46,"spd":48,"spa":46,"r":"common","pal":{"g":"#3ddc97","d":"#1f9e6b","w":"#ffffff","k":"#15324a","c":"#a8f0d8","n":"#ff8fb1"},"spr":["...d....d...","..dgg..ggd..","..gggggggg..",".gggggggggg.",".gwwggggwwg.",".gwkggggkwg.",".gggggggggg.",".ggggnngggg.","..gccggccg..","...gggggg...","..c......c..","............"],"evo":"tidewarden","fork":{"cure":"tidewarden","blight":"brackle"},"stage":1,"tribe":"tidecaller","niche":"Tidekit appear on beaches at exactly the moment the tide turns, small enough that children often mistake them for large crabs at first glance. They vanish back into the water before the next wave set arrives, and the superstition that finding one at a tide-turn means a good day ahead has kept coastal children watching the water for generations."},"tidewarden":{"n":"Tidewarden","t":"water","hp":130,"atk":104,"df":128,"spd":94,"spa":96,"r":"legend","pal":{"t":"#2bbbd9","d":"#11607a","w":"#ffffff","k":"#0a2e3d","g":"#ffd166","c":"#bdf0ff"},"spr":["....gggg....","...gttttg...","..tttttttt..",".tttttttttt.",".twkttttkwt.",".tttttttttt.",".tccttttcct.",".tttttttttt.",".tttttttttt.","..tttttttt..","..gg....gg..","...g....g..."],"evo":"","fork":null,"stage":2,"tribe":"tidecaller","niche":"Tidewarden station themselves at the mouths of sea-coves during spawning season for dozens of smaller species, their presence acting as a passive deterrent against deep-water predators that might otherwise raid the shallows. Fishing villages that share a cove with a Tidewarden consider them kin to a harbor-master — present, watchful, and not to be troubled without cause."},"brackle":{"n":"Brackle","t":"ghost","hp":64,"atk":72,"df":52,"spd":58,"spa":60,"r":"common","pal":{"p":"#6a7f3a","d":"#3b4a1c","k":"#1a1a10","m":"#b06be0","w":"#c8e66b","x":"#8a3ffb"},"spr":["..m......m..","..pp....pp..",".pppppppppp.",".pmppppppmp.",".pxpppppxpp.",".pppppppppp.",".ppmppppmpp.",".ppwwwwpppp.",".pppppppppp.","..pp.pp.pp..","..d..m..d...","............"],"evo":"","fork":null,"stage":2,"tribe":"sporekin","niche":"Brackle clings to the underside of bridges and the rotting piles of old docks, its fungal cap absorbing the damp and the resonance of footsteps crossing overhead. Dockhands know one is near when the planks creak in a pattern they don't remember walking — it learns the rhythm of the people who pass above and repeats it long after they're gone."},"sporelet":{"n":"Sporelet","t":"ghost","hp":44,"atk":50,"df":42,"spd":54,"spa":52,"r":"common","pal":{"s":"#7fae5a","d":"#3e5e2e","k":"#1a1410","x":"#b06be0","w":"#cfe89a","m":"#8a3ffb"},"spr":["....wwww....","..wwwwwwww..",".wwwwwwwwww.","...ssssss...","..ssssssss..","..sxsssxss..","..ssssssss..","..smssssms..","...ssssss...","...s.ss.s...","..m......m..","............"],"evo":"sporewretch","fork":{"cure":"mistcap","blight":"sporewretch"},"stage":1,"tribe":"sporekin","niche":"Sporelet is the smallest of the sporekin, barely larger than a clenched fist, and it tends to drift into children's bedrooms through cracked window frames on still nights. It settles near sleeping faces and releases a breath of spores that brings unusually vivid, warm dreams — parents find rings of faint iridescent dust on the pillow and know one visited."},"sporewretch":{"n":"Sporewretch","t":"ghost","hp":118,"atk":128,"df":108,"spd":106,"spa":132,"r":"legend","pal":{"p":"#6a7f3a","d":"#2f3d1c","k":"#120f08","x":"#b06be0","m":"#8a3ffb","w":"#c8e66b","c":"#d94fd9"},"spr":["..m..mm..m..","..pcppppcp..",".pppppppppp.",".pxpppppxpp.",".pppppppppp.",".ppxxxxpppp.",".pppppppppp.",".pmpppppmpp.",".pppppppppp.","..pppppppp..","..m.p..p.m..","...m....m..."],"evo":"","fork":null,"stage":2,"tribe":"sporekin","niche":"Sporewretch is what a Sporelet becomes when the grief it has absorbed exceeds what its small body can hold — it wanders wider and farther, dragging a trail of black-tipped spores that wither grass and curdle milk. It is not malicious; it is simply too full, and it presses its sorrow into whatever it passes until the weight becomes bearable again."},"mistcap":{"n":"Mistcap","t":"ghost","hp":66,"atk":44,"df":58,"spd":40,"spa":50,"r":"common","pal":{"w":"#e8f0e0","g":"#a8c8b0","d":"#7a9488","k":"#2a3a34","c":"#bde0ef"},"spr":["....wwww....","..wwwwwwww..",".wwwwwwwwww.","..wwwwwwww..","...gggggg...","..gkggggkg..","..gggggggg..","..gccccccg..","...gggggg...","...c.gg.c...","....c..c....","............"],"evo":"","fork":null,"stage":2,"tribe":"wraithkin","niche":"Mistcap are found in sea fogs and valley mists at dawn, faint shapes that disappear when looked at directly. Fishermen and early-rising farmers see them often and take no alarm; local wisdom holds that a Mistcap near the water means the day's catch will be honest — nothing more, nothing less — as if the creature calibrates expectations by simply being neither beautiful nor terrible, just present."},"cindling":{"n":"Cindling","t":"fire","hp":52,"atk":58,"df":48,"spd":60,"spa":62,"r":"common","pal":{"a":"#f07a2a","b":"#7a2f12","c":"#ffd166","k":"#fff"},"spr":["............","....a.......","...aaa..cc..","..aakaacaa..","..aaaaaaaa..",".caaaaaaaa..","..aaaaaaa...","..aaaaaa....","...aa.aa....","...b...b....","............","............"],"evo":"cindrake","fork":{"cure":"cindrake","blight":"ashmaw"},"stage":1,"tribe":"ashkin","niche":"Cindling nests in the cool ash-beds left after coastal bonfires, absorbing residual heat through its paws. Fishermen treat a Cindling curled near the hull as good weather-luck; it keeps ropes dry and wards off the damp chill that stiffens joints on long hauls."},"cindrake":{"n":"Cindrake","t":"fire","hp":116,"atk":134,"df":110,"spd":118,"spa":128,"r":"legend","pal":{"a":"#e8702a","b":"#7f3d17","c":"#ffd166","k":"#fff"},"spr":[".a........a.",".aa......aa.",".aaa.aa.aaa.",".aaaaaaaaaa.","caaaakkaaaac",".aaaaaaaaaa.",".baaaaaaaab.","..aaaaaaaa..","...aaaaaa...","...b.aa.b...","....b..b....","............"],"evo":"","fork":null,"stage":2,"tribe":"ashkin","niche":"Cindrake stakes out forge-yards and kiln-houses, where it sleeps on warm stone and wakes to fan smoldering coals back to life with a single breath. Potters and smiths leave scraps of charcoal out for them — a Cindrake that trusts you will keep a furnace at working heat through the night without being asked."},"ashmaw":{"n":"Ashmaw","t":"fire","hp":132,"atk":148,"df":120,"spd":120,"spa":144,"r":"common","pal":{"a":"#ff7a1f","b":"#6e2a0f","c":"#fff2b0","m":"#d6371b","k":"#fff"},"spr":["m.a......a.m",".maa....aam.",".aaaacaaaaa.","caaakaakaaac","maaaaaaaaaam",".aaaaaaaaaa.",".maaaaaaaam.","..aaccaaaa..","..aaaaaaaa..","..m.aaaa.m..","...m.aa.m...","....m..m...."],"evo":"","fork":null,"stage":2,"tribe":"ashkin","niche":"Ashmaw drifts through the burned margins of wildfire scars, grazing on carbonized bark and exhaling a slow, settling smoke that quiets the last of the heat still living in the ground. Communities along the dry ridge roads have learned to read its stillness as reassurance — an Ashmaw resting in the black means the land is done grieving the burn and is ready to begin again."},"stormfury":{"n":"Stormfury","t":"electric","hp":90,"atk":100,"df":80,"spd":95,"spa":68,"r":"common","pal":{"a":"#f0c040","b":"#8a5a00","k":"#1a1a1a","e":"#4499ff"},"spr":["......e.....","....bbb.....","...baaab....","..bkaaakb...","..baaaab....","...aaab.....","..aaaaaaa...",".baaaaaaab..","..aaaeaaa...","...a.aa..a..","...a.a.a.a..","............"],"evo":"","fork":null,"stage":1,"tribe":"voltkin","niche":"Stormfury runs ahead of weather fronts like a living barometer, its mane rising and crackling hours before any human instrument registers a change in pressure. Fishing fleets that work the outer waters pay handsomely for a tamer who bonds with a Stormfury — its warnings have saved more boats than any lighthouse on the coast."},"flaretitan":{"n":"Flaretitan","t":"fire","hp":110,"atk":132,"df":95,"spd":108,"spa":50,"r":"legend","pal":{"o":"#ff7d2f","d":"#af4414","k":"#222","r":"#f02d2d","f":"#ffea72"},"spr":["..oo....oo..","..od....do..",".foooooooof.","ffookookooff",".foooooooof.","..oorrroo...","..oooooooo..",".ooooooooor.",".oo..oo..rr.",".oo..oo...r.",".od..do.....","............"],"evo":"","fork":null,"stage":2,"tribe":"emberkin","niche":"Flaretitan is rarely seen except at the moment a wildfire crests a ridge and briefly reveals a shape inside the flame that is too large and too deliberate to be burning debris. Communities that live in fire-country do not consider it malevolent — they say it walks through fires the way a shepherd walks through a flock, keeping them from splitting into uncontrollable runs."},"maelviath":{"n":"Maelviath","t":"water","hp":125,"atk":122,"df":110,"spd":88,"spa":50,"r":"legend","pal":{"b":"#4196ff","d":"#2057f2","k":"#222","l":"#a1fbff","w":"#fff"},"spr":["..d......d..",".bbb....bbb.",".bwkb..bwkb.","bbbbbbbbbbbb","bbllbbbbllbb","bbbbbbbbbbbb","bdbbbbbbbbdb","bbbbbbbbbbbb",".bbbbbbbbbb.","..bbb..bbb..","..dd....dd..","............"],"evo":"","fork":null,"stage":1,"tribe":"tidecaller","niche":"Maelviath are spoken of more than they are seen — enormous shapes that surface during the heaviest storms, moving calmly through water that would shred a ship. Coastal peoples do not fear them so much as feel a specific kind of tenderness in their presence, the way you feel watching something ancient carry grief you cannot name."},"thornmonarch":{"n":"Thornmonarch","t":"grass","hp":120,"atk":124,"df":112,"spd":96,"spa":48,"r":"legend","pal":{"g":"#5ccd98","d":"#327758","k":"#222","p":"#ff7dba","l":"#cdffdf"},"spr":["....pppp....","...pppppp...","....pppp....","..gggggggg..",".ggkggggkgg.",".gggggggggg.","gggddggddggg",".gggggggggg.",".glgggggglg.","..gg.gg.gg..","..dd.dd.dd..","............"],"evo":"","fork":null,"stage":2,"tribe":"thornkin","niche":"Thornmonarch presides over the oldest thorn-forest stands in Veridia, its crown of interlocking thorn-antlers so large that small birds nest in them between duels. People who have glimpsed one at the center of a deep thicket describe not fear but an odd feeling of being recognized — as though the forest had decided to look back."},"voltreign":{"n":"Voltreign","t":"electric","hp":80,"atk":94,"df":69,"spd":127,"spa":118,"r":"common","pal":{"y":"#fff00b","d":"#cca225","k":"#222","r":"#ff507c"},"spr":["y..........y",".yy......yy.","..yyyyyyyy..",".yykyyyykyy.",".yyyyyyyyyy.",".yyyrrrryyy.",".yyyyyyyyyy.","d.yyyyyyyy.d","dd.yyyyyy.dd","..yy....yy..","..d......d..","............"],"evo":"","fork":null,"stage":2,"tribe":"voltkin","niche":"Voltreign stations itself above inhabited valleys during the long monsoon months, intercepting the heaviest lightning strikes before they can reach farmland below. The people of the Midvalley Reaches celebrate Voltreign Day each year at the monsoon's end — a festival less about reverence than about relief, the shared exhale of having made it through again."},"pebmonolith":{"n":"Pebmonolith","t":"rock","hp":114,"atk":100,"df":115,"spd":46,"spa":67,"r":"common","pal":{"s":"#9eabc3","d":"#67738c","k":"#222"},"spr":["...ssssss...","..ssssssss..",".ssksssskss.",".ssssssssss.","ssddssssddss","ssssssssssss","sdssssssssds","ssssssssssss",".ssssssssss.","..sss..sss..","..ddd..ddd..","............"],"evo":"","fork":null,"stage":2,"tribe":"stoneguard","niche":"Pebmonolith stands alone on exposed clifftops and ridge summits, unmoved by weather that strips paint from nearby structures. Sailors navigating the Veridia coast use the silhouettes of known Pebmonolith as landmarks — they have occupied the same outcrops for longer than the charts have recorded them."},"gustsovereign":{"n":"Gustsovereign","t":"flying","hp":88,"atk":101,"df":76,"spd":128,"spa":76,"r":"common","pal":{"w":"#ffffff","g":"#bcf4f6","k":"#222","o":"#ff8e00"},"spr":["....wwww....","...wwwwww...","..wkwwwwkw..","..wwooooww..",".gwwwwwwwwg.","ggwwwwwwwwgg","g.wwwwwwww.g","...wwwwww...","..wwwwwwww..","...wwwwww...","....o..o....","............"],"evo":"","fork":null,"stage":2,"tribe":"skykin","niche":"Gustsovereign appears only when a great storm is building — locals say the storm does not summon it, that it summons the storm, riding at the eye-wall as the disturbance organizes around it. Tamer records are sparse because bonding with a Gustsovereign requires being present at a forming storm, which selects hard for a particular type of person."},"brambleknight":{"n":"Vaelcloak","t":"grass","hp":88,"atk":100,"df":89,"spd":88,"spa":80,"r":"common","pal":{"f":"#e1aa67","c":"#fff6ca","g":"#48a279","d":"#327758","r":"#bc3823","k":"#222"},"spr":["..g.....d...","..gg....d...","..gffffgd...",".ffkffkffd..",".fffffffffd.",".rffggfffr..","rrfffffffrr.","rrfccccffrr.",".rfcggcffr..",".rffffffr...","..ff..ff....","............"],"evo":"","fork":null,"stage":2,"tribe":"thornkin","niche":"Vaelcloak moves through forest edge and open ruin wrapped in a woven cloak of living bramble that shifts and rearranges itself as it walks. It is drawn to places where something was once protected and is no longer — abandoned homestead walls, collapsed garden gates — and is observed standing in such places in silence, sometimes for days."},"mokolith":{"n":"Mokolith","t":"normal","hp":107,"atk":92,"df":99,"spd":76,"spa":72,"r":"common","pal":{"a":"#bea59e","b":"#72635e","c":"#ff8e00","k":"#222"},"spr":["............","............","...a....a...","..aakaakaa..","..acabbaca..",".baaa..aaab.","..caaaaaac..","..caaaaaac..","..aaaaaaaa..","..bbabbabb..","....b..b....","............"],"evo":"","fork":null,"stage":2,"tribe":"wildkin","niche":"Mokolith rises from riverbeds and silted harbours so slowly that the first sign is usually a patch of mud that wasn't there yesterday. Villages built on old flood plains find one every few generations — they are treated with careful respect, understood to be the river's opinion of the land above it."},"pyrelord":{"n":"Pyrelord","t":"fire","hp":82,"atk":90,"df":92,"spd":89,"spa":115,"r":"common","pal":{"a":"#ce5338","b":"#7b3122","c":"#ff8e00","k":"#222"},"spr":["............","....a..a....","...aaaaaa...","...ckcckc...","..aaaaaaaa..",".aaaaaaaaaa.","bbaaaaaaaabb","..baaaaaab..","...babbab...","....b..b....","............","............"],"evo":"","fork":null,"stage":2,"tribe":"emberkin","niche":"Pyrelord is known only from accounts written by survivors of the great caldera collapses — a creature seen standing in the lava flow as observers fled, motionless, as if it were holding the lava back rather than escaping it. Whether it failed or succeeded in whatever it was doing, the survivors felt that it had chosen to remain."},"squallcrest":{"n":"Squallcrest","t":"water","hp":106,"atk":83,"df":77,"spd":100,"spa":98,"r":"common","pal":{"a":"#5897d5","b":"#355b80","c":"#fff","k":"#222"},"spr":["............",".....aa.....","....aaaa....",".aackaakcaa.",".aaaaaaaaaa.","baaaaaaaaaab",".aaaaaaaaaa.",".aaaaaaaaaa.",".bbaaaaaabb.","...babbab...","....b..b....","............"],"evo":"","fork":null,"stage":2,"tribe":"tidecaller","niche":"Squallcrest appear on the horizon at the leading edge of true storms, their crested silhouette the last visible shape before weather closes in. Sailors who have turned back on seeing a Squallcrest crest the horizon are alive; the ones who did not are not here to say otherwise."},"voltarch":{"n":"Voltarch","t":"electric","hp":86,"atk":94,"df":73,"spd":111,"spa":119,"r":"common","pal":{"a":"#f2b900","b":"#906f00","c":"#ff7dba","k":"#222"},"spr":[".....cc.....",".....aa.....",".a..acca..a.",".aaakaakaaa.",".ccaaccaacc.",".bacaaaacab.","..aaaaaaaa..","..baaaaaab..","...aaaaaa...","...bbbbbb...","............","............"],"evo":"","fork":null,"stage":2,"tribe":"voltkin","niche":"Voltarch is said to have no fixed territory because the storm system it inhabits is its territory — a moving mass of cloud and charge that can be tracked across Veridia's weather maps as a slow seasonal circuit. In the old records kept by Veridia's coastal observatories, the same storm anomaly reappears every eleven years, slightly larger each time."},"granitan":{"n":"Granitan","t":"rock","hp":99,"atk":91,"df":111,"spd":84,"spa":60,"r":"common","pal":{"a":"#927460","b":"#574539","c":"#ae68ff","k":"#222"},"spr":["............","..aaa..aaa..","..aaaccaaa..",".ccakaakacc.",".baacaacaab.","..baaaaaab..","...aaaaaa...","..bccaaccb..","...acaaca...","...aaaaaa...","...babbab...","....b..b...."],"evo":"","fork":null,"stage":2,"tribe":"stoneguard","niche":"Granitan rests at the center of ancient stone circles in the highland interior, a presence so persistent and so still that the circles were built around it — not the other way around. People who visit the circles to grieve or to mark something important describe the experience of Granitan's presence as being held without being touched."},"galewing":{"n":"Galewing","t":"flying","hp":107,"atk":99,"df":79,"spd":106,"spa":75,"r":"common","pal":{"a":"#9fcfd1","b":"#5f7c7d","c":"#ffffff","k":"#222"},"spr":["............","..aa....aa..","..accaacca..",".aaakaakaaa.",".bcaaaaaacb.","..aaaaaaaa..","..acaaaaca..","..aabaabaa..",".aaa.bb.aaa.",".bbc....cbb.","...ba..ab...","....bbbb...."],"evo":"","fork":null,"stage":2,"tribe":"skykin","niche":"Galewing has a wingspan wide enough to shadow a fishing vessel, and it uses the shadow deliberately — driving shoals of surface fish into tight panicked clusters before diving. It is awe-inspiring and practically useful, but a wild Galewing that adopts a boat without consent will eat the catch before the crew can net it, which is a problem."},"larvathorn":{"n":"Larvathorn","t":"bug","hp":94,"atk":103,"df":97,"spd":89,"spa":74,"r":"common","pal":{"a":"#b5c700","b":"#6d7700","c":"#ffffff","k":"#222"},"spr":["............","............","....a..a....","...akaaka...","..acaaaaca..",".acaaaaaaca.","aaacaaaacaaa","bcaacaacaacb",".baaaaaaaab.","..babbbbab..","...b....b...","............"],"evo":"","fork":null,"stage":2,"tribe":"broodkin","niche":"Larvathorn is found only in ancient ruins and deep cave systems, its massive carapace overgrown with mineral deposits that have calcified into natural armor over decades of slow growth. Archaeologists who find their dig sites inhabited by Larvathorn treat it as a reliable sign of structural stability — the creature's weight alone would collapse any weak passage."},"nibhorn":{"n":"Nibhorn","t":"normal","hp":105,"atk":100,"df":88,"spd":84,"spa":80,"r":"common","pal":{"a":"#ab7c85","b":"#664a50","c":"#ff7dba","k":"#222"},"spr":["....aaaa....","..aaaaaaaa..","..ccaaaacc..","..cakaakac..","..acaaaaca..","aaaaaaaaaaaa","baacaaaacaab",".aaaaccaaaa.",".aaaaaaaaaa.",".baaaaaaaab.","..bbbbbbbb..","............"],"evo":"","fork":null,"stage":2,"tribe":"wildkin","niche":"Nibhorn inhabits the edges of ancient orchards and the ruins of old walls, its single heavy horn used not for combat but for clearing bramble from overgrown paths. Communities whose old ways have been interrupted find Nibhorn returning to routes that haven't been walked in years, as though it is keeping them open against the day someone returns."},"bloomlord":{"n":"Bloomlord","t":"grass","hp":109,"atk":94,"df":76,"spd":108,"spa":75,"r":"common","pal":{"a":"#4dae81","b":"#2e684d","c":"#ff7dba","k":"#222"},"spr":["....aaaa....","...acaaca...","..ccaaaacc..","..aakcckaa..",".caaaaaaaac.",".aaaaaaaaaa.",".aacaaaacaa.",".aaaaccaaaa.",".acaaaaaaca.",".bbaaaaaabb.","...bbbbbb...","............"],"evo":"","fork":null,"stage":2,"tribe":"thornkin","niche":"Bloomlord appears only when an ancient tree falls in a deep forest, arriving within hours to preside over the clearing that opens in the canopy. Communities who have witnessed it describe a cascade of flowering across the entire clearing by dawn — the Bloomlord is gone by then, but the blooms remain for a full season, and nothing invasive takes root in that clearing for years after."},"mote":{"n":"Mote","t":"resonance","hp":100,"atk":100,"df":100,"spd":100,"spa":100,"r":"mythic","pal":{"a":"#f0f0ff","b":"#c8c8ff","c":"#8080e8","k":"#222"},"spr":["....bbbb....","...baaabb...","..baaaaaab..",".baaacaaab..","baaaaaaaaab.","baaackcaaab.","baaaaaaaaab.",".baaacaaab..","..baaaaaab..","...baaabb...","....bbbb....","............"],"evo":"","fork":null,"stage":1,"tribe":"Wellspring","niche":"The first light, adrift at the Wellspring; where it drifts, dead ground greens and new creatures kindle. It shows itself only to a tamer who has learned to let go, and mends what it touches."},"vespyr":{"n":"Vespyr","t":"electric","hp":90,"atk":110,"df":80,"spd":120,"spa":95,"r":"mythic","pal":{"a":"#4fc3f7","b":"#0288d1","c":"#fff59d","k":"#222"},"spr":["....aaaa....","...aacaaa...","..aaaaaaaa..",".aaakaakaaa.","aaaaaacaaaaa",".aaacaaacaa.","..aaaaaaaa..","..aabbbbaa..",".aaa.aa.aaa.","...aa..aa...","...ab..ba...","............"],"evo":"","fork":null,"stage":1,"tribe":"Watchkin","niche":"A blue-eyed hound that paces the roads after dark; keep a steady heart and it shadows you to the next town's lights, then is gone by dawn. It still guards the roads it was set to watch."},"cervane":{"n":"Cervane","t":"rock","hp":120,"atk":100,"df":120,"spd":60,"spa":80,"r":"mythic","pal":{"a":"#b0b0b0","b":"#707070","c":"#e0d8c8","k":"#222"},"spr":["..bb....bb..",".abbb..bbba.","...aaaaaaaa.","..aaaaaaaa..",".aaakaakaaa.",".aacaaaacaa.",".aaaaaaaaaa.","..aaaaaaaa..","..baaaaaab..","...a....a...","...ab..ba...","............"],"evo":"","fork":null,"stage":1,"tribe":"Watchkin","niche":"A great grey stag that stands the high passes through every storm; herders set their seasons by where it grazes and shelter in its lee when weather turns. It simply outlasts."},"lethelynx":{"n":"Lethelynx","t":"ghost","hp":95,"atk":85,"df":90,"spd":105,"spa":115,"r":"mythic","pal":{"a":"#e8e0f0","b":"#a090b8","c":"#c8b8e0","k":"#222"},"spr":["..aa....aa..",".aaab..baaa.",".aaaaaaaaaa.","..aakaakaaa.",".aacaaaacaa.",".aaaaaaaaaa.","..aaaaaaaa..","..baacaabbb.","...aaaaaa...","..aa....aa..","..ab....ba..",".....
