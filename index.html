  add('m', starter);
  const types = {};
  types[D.species[starter].t] = 1;
  const pool = POOL.draft.filter((id) => D.species[id].stage === 1 && speciesCard(id).cost <= 2);
  let guard = 0;
  while (run.deck.length < 6 && guard++ < 500) {
    const id = R.pick(st, pool);
    const t = D.species[id].t;
    if (types[t]) continue;
    types[t] = 1; add('m', id);
  }
  add('e', 'purify'); add('e', 'containment'); add('e', 'lullaby');
  run.map = genMap(run);
  return run;
}

function draftPool(act) {
  return POOL.draft.filter((id) => {
    const c = speciesCard(id);
    if (act === 1) return c.cost <= 4 && D.species[id].stage === 1;
    if (act === 2) return c.cost <= 6;
    return c.cost >= 3;
  });
}
function cardChoices(run, n, opts) {
  opts = opts || {};
  const st = run.rng;
  const pool = draftPool(run.act);
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 400) {
    let pick;
    if (opts.allowEvents !== false && R.f(st) < 0.12) pick = { k: 'e', s: R.pick(st, ['purify', 'containment', 'scorched_field', 'tidal_field', 'storm_field', 'lullaby']) };
    else if (opts.mythic && out.length === 0) pick = { k: 'm', s: R.pick(st, POOL.mythic) };
    else pick = { k: 'm', s: R.pick(st, pool) };
    if (out.some((o) => o.k === pick.k && o.s === pick.s)) continue;
    out.push(pick);
  }
  return out;
}
function addCard(run, c) {
  run.deck.push({ id: run.uid++, k: c.k, s: c.s });
  if (c.k === 'm' && !run.stats.recruited.includes(c.s)) run.stats.recruited.push(c.s);
}

// ---------- map (Slay the Spire style) ----------
const ROWS = 11;      // rows 0..9 normal, row 10 boss
function genMap(run) {
  const st = run.rng;
  const rows = [];
  for (let r = 0; r < ROWS; r++) {
    const n = r === ROWS - 1 ? 1 : (r === 0 ? 3 : 2 + R.i(st, 3));
    const row = [];
    for (let i = 0; i < n; i++) {
      let type;
      if (r === ROWS - 1) type = 'boss';
      else if (r === 0) type = 'battle';
      else if (r === ROWS - 2) type = 'rest';
      else if (r === 5 && i === 0) type = 'treasure';
      else {
        const x = R.f(st);
        if (r >= 3 && x < 0.16) type = 'elite';
        else if (x < 0.30) type = 'event';
        else if (x < 0.42 && r >= 2) type = 'shop';
        else if (x < 0.54 && r >= 3) type = 'rest';
        else type = 'battle';
      }
      row.push({ r, i, n, type, x: n === 1 ? 0.5 : (i + 0.5) / n, next: [] });
    }
    rows.push(row);
  }
  for (let r = 0; r < ROWS - 1; r++) {
    const a = rows[r], b = rows[r + 1];
    a.forEach((node) => {
      // connect to the nearest 1-2 nodes in the next row by x
      const sorted = b.map((m, j) => [Math.abs(m.x - node.x), j]).sort((p, q) => p[0] - q[0]);
      node.next.push(sorted[0][1]);
      if (sorted[1] && sorted[1][0] < 0.42 && R.f(st) < 0.6) node.next.push(sorted[1][1]);
    });
    b.forEach((m, j) => {      // make every node reachable
      if (!a.some((node) => node.next.includes(j))) {
        let best = 0, bd = 9;
        a.forEach((node, k) => { const d = Math.abs(node.x - m.x); if (d < bd) { bd = d; best = k; } });
        a[best].next.push(j);
      }
    });
  }
  return rows;
}
function reachable(run) {
  if (!run.pos) return run.map[0].map((_, i) => [0, i]);
  const node = run.map[run.pos[0]][run.pos[1]];
  return node.next.map((j) => [run.pos[0] + 1, j]);
}

// ---------- battles ----------
function tilesOf(layout) {
  const set = new Set();
  for (let i = 0; i < layout.length - 1; i++) {
    let [x0, y0] = layout[i];
    const [x1, y1] = layout[i + 1];
    const dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0);
    while (x0 !== x1 || y0 !== y1) {
      if (x0 >= 0 && x0 < GW && y0 >= 0 && y0 < GH) set.add(x0 + ',' + y0);
      x0 += dx; y0 += dy;
    }
    if (x1 >= 0 && x1 < GW && y1 >= 0 && y1 < GH) set.add(x1 + ',' + y1);
  }
  return set;
}
function pathInfo(layout) {
  const pts = layout.map(([x, y]) => [x + 0.5, y + 0.5]);
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const len = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
    segs.push({ a: pts[i], b: pts[i + 1], len, start: total });
    total += len;
  }
  return { pts, segs, total };
}
function posAt(path, d) {
  for (const s of path.segs) {
    if (d <= s.start + s.len) {
      const t = (d - s.start) / s.len;
      return [s.a[0] + (s.b[0] - s.a[0]) * t, s.a[1] + (s.b[1] - s.a[1]) * t];
    }
  }
  const last = path.pts[path.pts.length - 1];
  return [last[0], last[1]];
}

function enemyPool(act, elite) {
  return Object.keys(D.species).filter((id) => {
    const s = D.species[id];
    if (s.r !== 'common' || BLIGHT_FORMS[id] || NO_DRAFT[id] || s.t === 'resonance') return false;
    const c = speciesCard(id).cost;
    if (elite) return s.stage === 2 && (act === 1 ? c <= 5 : act === 2 ? c >= 4 && c <= 7 : c >= 6);
    return act === 1 ? c <= 3 : act === 2 ? c >= 2 && c <= 5 : c >= 4;
  });
}

function makeEnemy(B, sid, opts) {
  const s = D.species[sid];
  const act = B.act;
  const actMul = [0, 1, ACT2, ACT3][act];
  const floorMul = 1 + 0.045 * B.floor;
  let hp = (s.hp * 1.1 + s.df * 0.7) * actMul * floorMul * B.hpScale;
  let speed = 0.62 + s.spd / 190;
  let armor = 0, leak = 1;
  if (opts.elite) { hp *= 3.2; armor = act; leak = 4; speed *= 0.9; }
  if (opts.boss) { hp *= BOSSM * (act === 3 ? 1.2 : 1); armor = 1 + act; leak = 25; speed = 0.42 + act * 0.03; }
  if (opts.blighted) hp *= 1.15;
  return {
    id: B.eid++, sid, type: s.t, name: s.n, hp, maxHp: hp, speed, armor, leak,
    elite: !!opts.elite, boss: !!opts.boss, blighted: !!opts.blighted,
    dist: 0, x: -0.5, y: 0, slowUntil: 0, slowMul: 1, burnUntil: 0, burnDps: 0, holdUntil: 0,
    alive: true, bossTimer: 0, enraged: false, hitFlash: 0,
  };
}

function waveCount(kind) { return kind === 'boss' ? 5 : 4; }

function buildWave(B, w) {
  const st = B.rng;
  const pool = enemyPool(B.act, false);
  const elitePool = enemyPool(B.act, true);
  const list = [];
  const blightChance = Math.min(0.75, 0.3 + 0.12 * B.act + 0.02 * B.floor);
  const n = 5 + w * 2 + Math.floor(B.floor / 3) + (B.act - 1);
  const theme = R.pick(st, pool);       // waves lean on one species, like a migrating pack
  for (let i = 0; i < n; i++) {
    const sid = R.f(st) < 0.45 ? theme : R.pick(st, pool);
    list.push({ sid, opts: { blighted: R.f(st) < blightChance } });
  }
  if (B.kind === 'elite' && w >= 1) {
    const k = w === waveCount(B.kind) - 1 ? 2 : 1;
    for (let i = 0; i < k; i++) list.splice(Math.floor(list.length / 2) + i, 0, { sid: R.pick(st, elitePool), opts: { elite: true, blighted: R.f(st) < 0.6 } });
  }
  if (B.kind === 'battle' && w === waveCount(B.kind) - 1 && B.floor >= 4) {
    list.push({ sid: R.pick(st, elitePool), opts: { elite: true, blighted: true } });
  }
  if (B.kind === 'boss' && w === waveCount(B.kind) - 1) {
    list.splice(3, 0, { sid: BOSSES[B.act - 1], opts: { boss: true, blighted: true } });
  }
  const gap = Math.max(0.45, 1.05 - 0.08 * B.act - 0.03 * w);
  return list.map((e, i) => ({ t: i * gap * (e.opts.boss ? 1 : 1), sid: e.sid, opts: e.opts }));
}

function newBattle(run, kind, seedBump) {
  const st = { s: (run.seed * 31 + run.act * 1009 + run.floor * 97 + (seedBump | 0)) | 0 };
  const layout = LAYOUTS[R.i(st, LAYOUTS.length)];
  const hasCharm = (k) => run.charms.includes(k);
  const B = {
    kind, act: run.act, floor: run.floor, rng: st, run, hpScale: HP_SCALE,
    layout, pathTiles: tilesOf(layout), path: pathInfo(layout),
    t: 0, wave: 0, waves: waveCount(kind), phase: 'build', spawnQ: [], spawnT: 0,
    enemies: [], towers: [], zones: [], fx: [], log: [], eid: 1, tid: 1,
    draw: R.shuffle(st, run.deck.map((c) => ({ id: c.id, k: c.k, s: c.s }))), hand: [], discard: [], inPlay: [],
    energy: 0, energyPerWave: 3 + (hasCharm('spark_battery') ? 1 : 0), energyCap: 10,
    handSize: 5 + (hasCharm('tamer_satchel') ? 1 : 0),
    slots: 5 + run.act + (hasCharm('survey_stake') ? 1 : 0),
    gateLeft: hasCharm('stone_gate') ? 4 : 0,
    field: null, leaked: 0, kills: 0, result: null,
  };
  startBuild(B);
  return B;
}

function drawCards(B, n) {
  for (let i = 0; i < n; i++) {
    if (!B.draw.length) {
      if (!B.discard.length) return;
      B.draw = R.shuffle(B.rng, B.discard);
      B.discard = [];
    }
    B.hand.push(B.draw.pop());
  }
}
function startBuild(B) {
  B.phase = 'build';
  B.discard.push(...B.hand);
  B.hand = [];
  B.field = null;
  B.energy = Math.min(B.energyCap, B.energy + B.energyPerWave);
  drawCards(B, B.handSize);
}
function startWave(B) {
  if (B.phase !== 'build') return false;
  B.phase = 'wave';
  B.spawnQ = buildWave(B, B.wave);
  B.spawnT = 0;
  return true;
}

function charmMul(B, type) {
  const c = B.run.charms;
  let m = 1;
  if (type === 'fire' && c.includes('hearth_coal')) m *= 1.25;
  if (type === 'water' && c.includes('tide_shell')) m *= 1.25;
  if (type === 'grass' && c.includes('seed_pouch')) m *= 1.25;
  if ((type === 'ice' || type === 'electric') && c.includes('frost_bell')) m *= 1.25;
  return m;
}
function makeTower(B, card, x, y) {
  const d = speciesCard(card.s);
  const c = B.run.charms;
  return {
    id: B.tid++, card, sid: card.s, x, y, type: d.type, name: d.name,
    dmg: d.dmg * charmMul(B, d.type),
    cd: d.cd / (c.includes('quick_whistle') ? 1.15 : 1),
    range: d.range * (c.includes('field_lens') ? 1.15 : 1),
    timer: 0, kills: 0, grown: false, evo: d.evo, def: d, sleepUntil: 0, aim: 0,
  };
}
function growNeed(B) { return B.run.charms.includes('grow_tonic') ? 5 : 8; }
function growCost(B, t) { const c = speciesCard(t.evo).cost - 2 - (B.run.charms.includes('grow_tonic') ? 1 : 0); return Math.max(1, c); }
function canGrow(B, t) { return !!t.evo && D.species[t.evo] && t.kills >= growNeed(B) && B.energy >= growCost(B, t); }
function grow(B, tid) {
  const t = B.towers.find((q) => q.id === tid);
  if (!t || !canGrow(B, t)) return false;
  B.energy -= growCost(B, t);
  const nt = makeTower(B, { id: t.card.id, k: 'm', s: t.evo }, t.x, t.y);
  nt.id = t.id; nt.kills = 0; nt.grown = true; nt.card = t.card; nt.baseSid = t.sid;
  B.towers[B.towers.indexOf(t)] = nt;
  B.fx.push({ k: 'grow', x: t.x + 0.5, y: t.y + 0.5, t: 0, life: 0.9 });
  return true;
}
function recall(B, tid) {
  const i = B.towers.findIndex((q) => q.id === tid);
  if (i < 0) return false;
  const t = B.towers[i];
  B.towers.splice(i, 1);
  B.discard.push(t.card);
  return true;
}

function tileFree(B, x, y) {
  if (x < 0 || y < 0 || x >= GW || y >= GH) return false;
  if (B.pathTiles.has(x + ',' + y)) return false;
  return !B.towers.some((t) => t.x === x && t.y === y);
}
function needsTarget(def) { return def.kind === 'm' || def.effect === 'blight_purify' || def.effect === 'blight_contain'; }

// Play hand card i. Monsters and targeted events need a tile (x, y).
function playCard(B, i, x, y) {
  if (B.phase === 'done') return { ok: false, why: 'Battle over.' };
  const c = B.hand[i];
  if (!c) return { ok: false, why: 'No card.' };
  const def = cardDef(c);
  if (def.cost > B.energy) return { ok: false, why: 'Not enough energy.' };
  if (def.kind === 'm') {
    if (!tileFree(B, x, y)) return { ok: false, why: 'Place towers on open ground, off the path.' };
    if (B.towers.length >= B.slots) return { ok: false, why: 'All ' + B.slots + ' tower slots used. Recall one first.' };
    B.towers.push(makeTower(B, c, x, y));
    B.inPlay.push(c);
    B.fx.push({ k: 'place', x: x + 0.5, y: y + 0.5, t: 0, life: 0.5 });
  } else {
    const cx = x + 0.5, cy = y + 0.5;
    if ((def.effect === 'blight_purify' || def.effect === 'blight_contain') && B.phase !== 'wave') return { ok: false, why: def.name + ' works on foes on the road. Play it during a wave.' };
    if (def.effect === 'blight_purify') {
      if (x == null) return { ok: false, why: 'Tap the field.' };
      B.zones.push({ k: 'purify', x: cx, y: cy, r: 1.6, t: 0, life: 0.6 });
      B.enemies.forEach((e) => {
        if (e.alive && Math.hypot(e.x - cx, e.y - cy) <= 1.6) {
          if (e.blighted && !e.boss) { e.blighted = false; e.hp = Math.min(e.hp, e.maxHp * 0.85); }
          hurt(B, e, 35 * [0, 1, 1.8, 3.2][B.act], null);
        }
      });
    } else if (def.effect === 'blight_contain') {
      if (x == null) return { ok: false, why: 'Tap the field.' };
      B.zones.push({ k: 'contain', x: cx, y: cy, r: 1.4, t: 0, life: 2.5 });
    } else if (def.effect === 'field') {
      B.field = { scorch: 'fire', tide: 'water', storm: 'electric' }[def.param] || null;
      B.fx.push({ k: 'field', type: B.field, t: 0, life: 1.2 });
    } else if (def.id === 'lullaby') {
      B.enemies.forEach((e) => { e.slowUntil = B.t + 6; e.slowMul = Math.min(e.slowMul, 0.65); });
      B.lullabyUntil = B.t + 6;
      B.fx.push({ k: 'lullaby', t: 0, life: 1.2 });
    }
    B.discard.push(c);
  }
  B.energy -= def.cost;
  B.hand.splice(i, 1);
  return { ok: true };
}

function typeMul(atk, def) {
  const row = D.chart[atk] || {};
  const v = row[def];
  if (v === undefined) return 1;
  if (v >= 2) return 1.5;
  if (v === 0) return 0.25;
  return 0.6;
}
function hurt(B, e, amount, tower) {
  if (!e.alive) return;
  e.hp -= amount;
  e.hitFlash = 0.12;
  if (e.hp <= 0) {
    e.alive = false;
    B.kills++;
    B.run.stats.kills++;
    if (tower) tower.kills++;
    B.fx.push({ k: 'pop', x: e.x, y: e.y, t: 0, life: 0.45, blight: e.blighted });
  }
}
function hitDamage(B, t, e, frac) {
  let d = t.dmg * frac * typeMul(t.type, e.type);
  if (e.blighted && QUARTET[t.type]) d *= B.run.charms.includes('cleansing_bell') ? 2.5 : 2;
  if (B.field && B.field === t.type) d *= 1.4;
  if (t.type === 'normal' && rngNext(B.rng) < 0.2) d *= 2;
  if (t.type !== 'ghost') d = Math.max(1, d - e.armor);
  return d;
}
function slow(B, e, mul, dur) {
  if (e.boss) mul = 1 - (1 - mul) * 0.5;
  if (mul < e.slowMul || e.slowUntil < B.t) e.slowMul = mul;
  e.slowUntil = Math.max(e.slowUntil, B.t + dur);
}
function towerFire(B, t, target) {
  const tx = t.x + 0.5, ty = t.y + 0.5;
  const main = hitDamage(B, t, target, 1);
  B.fx.push({ k: 'shot', x: tx, y: ty, x2: target.x, y2: target.y, type: t.type, t: 0, life: 0.18 });
  hurt(B, target, main, t);
  switch (t.type) {
    case 'fire': target.burnUntil = B.t + 3; target.burnDps = Math.max(target.burnDps, main * 0.3); target.burnSrc = t; break;
    case 'water': slow(B, target, 0.7, 1.5); break;
    case 'ice': slow(B, target, 0.5, 2); break;
    case 'grass': if (rngNext(B.rng) < 0.25) target.holdUntil = Math.max(target.holdUntil, B.t + (target.boss ? 0.25 : 0.6)); break;
    case 'electric': {
      let from = target, hit = new Set([target.id]);
      for (let k = 0; k < 2; k++) {
        let best = null, bd = 1.9;
        B.enemies.forEach((o) => { if (o.alive && !hit.has(o.id)) { const d = Math.hypot(o.x - from.x, o.y - from.y); if (d < bd) { bd = d; best = o; } } });
        if (!best) break;
        hit.add(best.id);
        B.fx.push({ k: 'shot', x: from.x, y: from.y, x2: best.x, y2: best.y, type: 'electric', t: 0, life: 0.18 });
        hurt(B, best, hitDamage(B, t, best, 0.5), t);
        from = best;
      }
      break;
    }
    case 'rock': case 'resonance':
      B.enemies.forEach((o) => {
        if (o.alive && o !== target && Math.hypot(o.x - target.x, o.y - target.y) <= 1) hurt(B, o, hitDamage(B, t, o, t.type === 'rock' ? 0.6 : 0.5), t);
      });
      if (t.type === 'resonance') slow(B, target, 0.75, 1.2);
      B.fx.push({ k: 'ring', x: target.x, y: target.y, r: 1, t: 0, life: 0.3, type: t.type });
      break;
    default: break;
  }
}

function step(B, dt) {
  if (B.phase === 'done') return;
  B.t += dt;
  for (const f of B.fx) f.t += dt;
  B.fx = B.fx.filter((f) => f.t < f.life);
  for (const z of B.zones) z.t += dt;
  B.zones = B.zones.filter((z) => z.t < z.life);
  if (B.phase !== 'wave') return;

  // spawns
  B.spawnT += dt;
  while (B.spawnQ.length && B.spawnQ[0].t <= B.spawnT) {
    const s = B.spawnQ.shift();
    const e = makeEnemy(B, s.sid, s.opts);
    const p = posAt(B.path, 0); e.x = p[0]; e.y = p[1];
    B.enemies.push(e);
    if (e.boss) B.log.push(e.name + ' arrives. It is Blighted.');
  }

  // enemies move
  for (const e of B.enemies) {
    if (!e.alive) continue;
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    if (e.burnUntil > B.t) hurt(B, e, e.burnDps * dt, e.burnSrc || null);
    if (!e.alive) continue;
    let mul = e.slowUntil > B.t ? e.slowMul : 1;
    if (B.field && B.field === e.type) mul *= 1.2;
    if (e.enraged) mul *= 1.6;
    let held = e.holdUntil > B.t;
    if (!held) for (const z of B.zones) if (z.k === 'contain' && Math.hypot(e.x - z.x, e.y - z.y) <= z.r) { held = !e.boss; if (e.boss) mul *= 0.5; }
    if (!held) e.dist += e.speed * mul * dt;
    const p = posAt(B.path, e.dist); e.x = p[0]; e.y = p[1];
    if (e.boss) bossAct(B, e, dt);
    if (e.dist >= B.path.total) {
      e.alive = false;
      let dmg = e.boss ? Math.max(5, Math.ceil(e.leak * e.hp / e.maxHp)) : e.leak;
      const blocked = Math.min(B.gateLeft, dmg);
      B.gateLeft -= blocked; dmg -= blocked;
      B.run.hp -= dmg; B.leaked += e.leak;
      B.fx.push({ k: 'leak', t: 0, life: 0.6, dmg });
      if (B.run.hp <= 0) { B.run.hp = 0; B.phase = 'done'; B.result = 'lose'; return; }
    }
  }

  // towers fire
  for (const t of B.towers) {
    if (t.sleepUntil > B.t) continue;
    t.timer -= dt;
    if (t.timer > 0) continue;
    const tx = t.x + 0.5, ty = t.y + 0.5;
    let best = null, bestScore = -1;
    for (const e of B.enemies) {
      if (!e.alive) continue;
      if (Math.hypot(e.x - tx, e.y - ty) > t.range) continue;
      const score = t.type === 'flying' ? e.speed * 100 + e.dist : e.dist;
      if (score > bestScore) { bestScore = score; best = e; }
    }
    if (!best) { t.timer = 0; continue; }
    t.aim = Math.atan2(best.y - ty, best.x - tx);
    towerFire(B, t, best);
    t.timer = t.cd;
  }

  B.enemies = B.enemies.filter((e) => e.alive);
  if (!B.spawnQ.length && !B.enemies.length) {
    B.wave++;
    if (B.wave >= B.waves) { B.phase = 'done'; B.result = 'win'; B.discard.push(...B.hand); B.hand = []; }
    else startBuild(B);
  }
}

const STEP = 1 / 60;
let acc = 0, uiTick = 0, lastLog = 0;
function loop(now) {
  const B = battle;
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  if (!paused) {
    acc += dt * speed;
    while (acc >= STEP) { BS.step(B, STEP); acc -= STEP; if (B.phase === 'done') break; }
  }
  draw(B);
  uiTick += dt;
  if (uiTick > 0.2) {
    uiTick = 0;
    refreshBattleUI();
    const hudHp = document.querySelector('.hud .hp .stat b');
    if (hudHp && hudHp.textContent !== String(run.hp)) { hudHp.textContent = run.hp; const bar = document.querySelector('.hpbar i'); if (bar) bar.style.width = (run.hp / run.maxHp * 100) + '%'; }
    if (B.log.length > lastLog) { document.getElementById('log').textContent = B.log[B.log.length - 1]; lastLog = B.log.length; }
  }
  const ban = document.getElementById('banner');
  if (ban) {
    if (B.phase === 'build') ban.textContent = 'Wave ' + (B.wave + 1) + ' of ' + B.waves + ' is coming';
    else if (B.phase === 'wave') ban.textContent = (B.field ? B.field.toUpperCase() + ' FIELD · ' : '') + B.enemies.length + ' foes on the road' + (B.spawnQ.length ? ', ' + B.spawnQ.length + ' more coming' : '');
  }
  if (B.phase === 'done') { lastLog = 0; endBattle(B); return; }
  raf = requestAnimationFrame(loop);
}

function draw(B) {
  const W = cv.width, H = cv.height;
  ctx.imageSmoothingEnabled = false;
  for (let y = 0; y < BS.GH; y++) for (let x = 0; x < BS.GW; x++) {
    const onPath = B.pathTiles.has(x + ',' + y);
    ctx.fillStyle = onPath ? ((x + y) % 2 ? '#6b5536' : '#634f32') : ((x + y) % 2 ? '#1c2b24' : '#19271f');
    ctx.fillRect(x * TS, y * TS, TS, TS);
    if (!onPath && ((x * 7 + y * 13) % 5 === 0)) { ctx.fillStyle = '#24372d'; ctx.fillRect(x * TS + 8, y * TS + 26, 3, 6); ctx.fillRect(x * TS + 13, y * TS + 24, 3, 8); }
  }
  // Haven gate on the exit
  const end = B.path.pts[B.path.pts.length - 1];
  ctx.fillStyle = '#e9b949';
  ctx.fillRect(W - 6, (end[1] - 0.5) * TS, 6, TS);
  // Blight seep at the entrance
  const st = B.path.pts[0];
  const grd = ctx.createRadialGradient(0, st[1] * TS, 2, 0, st[1] * TS, TS * 1.6);
  grd.addColorStop(0, 'rgba(163,92,224,0.55)'); grd.addColorStop(1, 'rgba(163,92,224,0)');
  ctx.fillStyle = grd; ctx.fillRect(0, (st[1] - 2) * TS, TS * 2, TS * 4);

  // placement preview
  if (selected >= 0 && B.hand[selected]) {
    const d = BS.cardDef(B.hand[selected]);
    if (d.kind === 'm') {
      ctx.fillStyle = 'rgba(233,185,73,0.07)';
      for (let y = 0; y < BS.GH; y++) for (let x = 0; x < BS.GW; x++) if (BS.tileFree(B, x, y)) ctx.fillRect(x * TS + 2, y * TS + 2, TS - 4, TS - 4);
    }
    if (hover) {
      const r = d.kind === 'm' ? d.range : d.effect === 'blight_purify' ? 1.6 : d.effect === 'blight_contain' ? 1.4 : 0;
      if (r) {
        ctx.strokeStyle = 'rgba(233,185,73,0.8)'; ctx.lineWidth = 2; ctx.beginPath();
        ctx.arc((hover[0] + 0.5) * TS, (hover[1] + 0.5) * TS, r * TS, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }
  // zones
  for (const z of B.zones) {
    const a = 1 - z.t / z.life;
    ctx.fillStyle = z.k === 'purify' ? 'rgba(233,185,73,' + (0.35 * a) + ')' : 'rgba(86,184,214,' + (0.28 * Math.min(1, a * 2)) + ')';
    ctx.beginPath(); ctx.arc(z.x * TS, z.y * TS, z.r * TS, 0, Math.PI * 2); ctx.fill();
  }
  // towers
  for (const t of B.towers) {
    const cx = (t.x + 0.5) * TS, cy = (t.y + 0.5) * TS;
    ctx.fillStyle = tcol(t.type) + '55';
    ctx.beginPath(); ctx.ellipse(cx, cy + TS * 0.32, TS * 0.42, TS * 0.16, 0, 0, Math.PI * 2); ctx.fill();
    if (towerSel === t.id) { ctx.strokeStyle = 'rgba(233,185,73,0.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, t.range * TS, 0, Math.PI * 2); ctx.stroke(); }
    const sz = TS * (t.grown ? 0.95 : 0.8);
    ctx.globalAlpha = t.sleepUntil > B.t ? 0.45 : 1;
    ctx.drawImage(spriteCanvas(t.sid), cx - sz / 2, cy - sz / 2 - 2, sz, sz);
    ctx.globalAlpha = 1;
    if (t.evo && D.species[t.evo] && BS.canGrow(B, t)) { ctx.strokeStyle = '#e9b949'; ctx.lineWidth = 2; ctx.strokeRect(t.x * TS + 2, t.y * TS + 2, TS - 4, TS - 4); }
  }
  // enemies
  for (const e of B.enemies) {
    const sz = TS * (e.boss ? 1.5 : e.elite ? 1.0 : 0.72);
    const ex = e.x * TS, ey = e.y * TS;
    if (e.blighted) { ctx.fillStyle = 'rgba(163,92,224,0.35)'; ctx.beginPath(); ctx.arc(ex, ey, sz * 0.55, 0, Math.PI * 2); ctx.fill(); }
    ctx.save();

    ctx.translate(ex, ey);
    ctx.scale(-1, 1);      // enemies face the Haven
    ctx.drawImage(spriteCanvas(e.sid, e.blighted), -sz / 2, -sz / 2, sz, sz);
    ctx.restore();
    const bw = sz * 0.9;
    ctx.fillStyle = '#0b0f10'; ctx.fillRect(ex - bw / 2, ey - sz / 2 - 6, bw, 4);
    ctx.fillStyle = e.boss ? '#e2574c' : e.elite ? '#e9b949' : '#5fc88f';
    ctx.fillRect(ex - bw / 2, ey - sz / 2 - 6, bw * Math.max(0, e.hp / e.maxHp), 4);
    if (e.slowUntil > B.t) { ctx.fillStyle = '#56b8d6'; ctx.fillRect(ex - bw / 2, ey - sz / 2 - 1, 4, 3); }
    if (e.burnUntil > B.t) { ctx.fillStyle = '#e85d2a'; ctx.fillRect(ex - bw / 2 + 5, ey - sz / 2 - 1, 4, 3); }
  }

    const a = 1 - f.t / f.life;
    if (f.k === 'shot') {
      ctx.strokeStyle = tcol(f.type); ctx.globalAlpha = a; ctx.lineWidth = f.type === 'electric' ? 2 : 3;
      ctx.beginPath(); ctx.moveTo(f.x * TS, f.y * TS);
      if (f.type === 'electric') { const mx = (f.x + f.x2) / 2 * TS + (Math.random() - 0.5) * 10, my = (f.y + f.y2) / 2 * TS + (Math.random() - 0.5) * 10; ctx.lineTo(mx, my); }
      ctx.lineTo(f.x2 * TS, f.y2 * TS); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.k === 'pop') {
      ctx.fillStyle = f.blight ? 'rgba(163,92,224,' + a + ')' : 'rgba(233,239,232,' + a + ')';
      for (let k = 0; k < 6; k++) { const ang = k * 1.05, r = (1 - a) * TS * 0.6; ctx.fillRect(f.x * TS + Math.cos(ang) * r - 2, f.y * TS + Math.sin(ang) * r - 2, 4, 4); }
    } else if (f.k === 'ring') {
      ctx.strokeStyle = tcol(f.type); ctx.globalAlpha = a; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x * TS, f.y * TS, f.r * TS * (1 - a * 0.5), 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.k === 'grow' || f.k === 'place') {
      ctx.strokeStyle = 'rgba(233,185,73,' + a + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x * TS, f.y * TS, TS * (0.3 + (1 - a) * 0.6), 0, Math.PI * 2); ctx.stroke();
    } else if (f.k === 'rot') {
      ctx.fillStyle = 'rgba(163,92,224,0.8)'; ctx.font = '700 ' + Math.round(TS * 0.35) + 'px Pixelify Sans, monospace'; ctx.fillText('z', f.x * TS + TS * 0.2, f.y * TS - TS * 0.25 - (1 - a) * 6);
    } else if (f.k === 'leak') {

    } else if (f.k === 'field' || f.k === 'lullaby') {

    }
  }
  if (paused) { ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#e9efe8'; ctx.font = '700 28px Pixelify Sans, monospace'; ctx.textAlign = 'center'; ctx.fillText('Paused', W / 2, H / 2); ctx.textAlign = 'left'; }
}

function endBattle(B) {
  stopLoop();
  if (B.result === 'lose') { finishRun(false); return; }
  BS.finishBattle(run, B);
  pending = BS.battleRewards(run, B);
  pending.kind = B.kind; pending.kills = B.kills; pending.leaked = B.leaked;
  if (B.kind === 'boss') {
    const got = [earnCode(2)];
    if (run.act === 1) got.push(earnCode(1));
    if (run.act === 3) run.deck.forEach((c) => { if (c.k === 'm') got.push(earnCode(TGC.foilRewardFor(c.s))); });
    pending.codes = got.filter(Boolean);
  }
  run.gold += pending.gold;

  go('reward');

function eventScreen() {
  app.append(hud());
  const p = pending, ev = p.ev;
  const panel = h('div', { class: 'panel' }, h('h2', null, ev.title), h('p', null, ev.body));
  const done = (msg) => { persist(); toast(msg); go('map'); };
  const opts = h('div', { class: 'choice' });
  if (ev.id === 'stray') {
    panel.append(h('div', { class: 'cards', style: 'max-width:200px' }, cardEl(p.card, { showEvo: true })));
    opts.append(h('button', { class: 'btn primary', type: 'button', onclick: () => { BS.addCard(run, p.card); remember([p.card.s]); done(BS.cardDef(p.card).name + ' joins your deck.'); } }, 'Let it join'));
  } else if (ev.id === 'spring') {
    opts.append(h('button', { class: 'btn primary', type: 'button', onclick: () => { run.hp = Math.max(1, run.hp - 7); const k = BS.randomCharm(run); if (k) run.charms.push(k); done(k ? 'Lost 7 HP. Found ' + BS.CHARMS[k].name + '.' : 'Lost 7 HP. Nothing there.'); } }, 'Reach in (lose 7 HP, gain a charm)'));
    opts.append(h('button', { class: 'btn', type: 'button', onclick: () => { run.gold += 25; done('+25 seals.'); } }, 'Skim the surface (+25 seals)'));
  } else if (ev.id === 'cache') {
    opts.append(h('button', { class: 'btn primary', type: 'button', onclick: () => { run.gold += 45; done('+45 seals.'); } }, 'Take the seals (+45)'));
  } else if (ev.id === 'trader') {
    opts.append(h('button', { class: 'btn primary', type: 'button', disabled: run.deck.length <= 5, onclick: () => pickRemove(() => {}, 'map') }, 'Remove a card'));
  } else if (ev.id === 'shrine') {
    opts.append(h('button', { class: 'btn primary', type: 'button', onclick: () => { run.hp = Math.min(run.maxHp, run.hp + 12); done('Healed 12.'); } }, 'Pray (heal 12)'));
    opts.append(h('button', { class: 'btn', type: 'button', onclick: () => { run.maxHp += 6; run.hp += 6; done('Max HP +6.'); } }, 'Make an offering (max HP +6)'));
  }
  opts.append(h('button', { class: 'btn', type: 'button', onclick: () => done('You move on.') }, 'Leave'));
  panel.append(opts);
  app.append(panel);
}

// ---------- deck view ----------
function showDeck(onPick, heading) {
  const prev = screen;
  stopLoop();
  const wasPaused = paused; paused = true;
  app.innerHTML = '';
  app.append(hud());
  const panel = h('div', { class: 'panel deckview' }, h('h2', null, heading || 'Your deck'), h('p', { class: 'muted small' }, run.deck.length + ' cards.'));
  const g = h('div', { class: 'cards' });
  run.deck.slice().sort((a, b) => BS.cardDef(a).cost - BS.cardDef(b).cost).forEach((c) => g.append(cardEl(c, { showEvo: true, onclick: onPick ? () => onPick(c) : null })));
  panel.append(g);
  panel.append(h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => {
    paused = wasPaused;
    if (prev === 'battle') { app.innerHTML = ''; battleScreen(); } else go(prev);
  } }, onPick ? 'Cancel' : 'Back')));
  app.append(panel);
  window.scrollTo(0, 0);
}

// ---------- Tamer Codes, Steam, sign-up ----------
function copyText(text, input) {
  const fallback = () => { input.select(); toast('Selected. Copy it from the box.'); };
  try { navigator.clipboard.writeText(text).then(() => toast('Copied ' + text), fallback); } catch (e) { fallback(); }
}
function codeList(entries, heading) {
  const box = h('div', { class: 'codes' });
  if (heading) box.append(h('h3', null, heading));
  entries.forEach((c) => {
    const input = h('input', { class: 'codebox', type: 'text', readonly: 'readonly', value: c.code, 'aria-label': rewardName(c.r) + ' code', id: 'code-' + c.r });
    const legend = TGC.REWARDS[c.r].legend;
    box.append(h('div', { class: 'coderow' },
      legend ? h('img', { src: spriteURL(legend), alt: '' }) : h('span', { class: 'codeicon', 'aria-hidden': 'true' }),
      h('div', { class: 'stack', style: 'gap:2px;min-width:0;flex:1' }, h('strong', null, rewardName(c.r)), input),
      h('button', { class: 'btn small', type: 'button', onclick: () => copyText(c.code, input) }, 'Copy')));
  });
  box.append(h('p', { class: 'small muted' }, "Redeem Tamer Codes in Tamer's Gambit on Steam for cosmetic unlocks. They never expire."));
  return box;
}
function steamButton() {
  if (CONFIG.STEAM_URL) return h('a', { class: 'btn steam', href: CONFIG.STEAM_URL, target: '_blank', rel: 'noopener' }, "Wishlist Tamer's Gambit on Steam");
  return h('span', { class: 'btn steam soon', 'aria-disabled': 'true' }, 'Coming soon to Steam');
}
function signupForm() {
  if (!CONFIG.SIGNUP_ENDPOINT) return null;
  const email = h('input', { type: 'email', id: 'signup-email', required: 'required', autocomplete: 'email', placeholder: 'you@example.com', class: 'emailbox' });
  const msg = h('p', { class: 'small muted', 'aria-live': 'polite' }, 'We email your codes and tell you when the full game launches. Nothing else.');
  return h('form', { class: 'signup', onsubmit: (e) => {
    e.preventDefault();
    msg.textContent = 'Sending...';
    fetch(CONFIG.SIGNUP_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email.value, codes: museum.codes.map((c) => c.code) }) })
      .then((r) => { msg.textContent = r.ok ? 'Sent. Check your inbox.' : 'That did not go through. Try again in a minute.'; })
      .catch(() => { msg.textContent = 'That did not go through. Check your connection and try again.'; });
  } },
    h('label', { for: 'signup-email', class: 'small' }, 'Email me my unlock codes'),
    h('div', { class: 'row' }, email, h('button', { class: 'btn small primary', type: 'submit' }, 'Send')), msg);
}

// ---------- end / museum ----------
function finishRun(won) {
  run.over = true; run.won = won;
  museum.best = Math.max(museum.best, run.act);
  if (won) museum.wins++;
  save(MUSEUM_KEY, museum);
  drop(SAVE_KEY);
  go('end');
}
function endScreen() {
  const won = run.won;
  const panel = h('div', { class: 'panel' },
    h('div', { class: 'kicker', style: 'font-family:var(--f-display);color:' + (won ? 'var(--seal)' : 'var(--blight)') + ';letter-spacing:.2em' }, won ? 'VICTORY' : 'THE HAVEN FALLS'),
    h('h2', null, won ? 'Sporewretch is purified' : 'Act ' + run.act + ', floor ' + ((run.pos ? run.pos[0] : 0) + 1)),
    h('p', { class: 'muted' }, run.stats.battles + ' battles won · ' + run.stats.kills + ' knockouts · ' + run.stats.recruited.length + ' species recruited this run.'));
  const g = h('div', { class: 'museum' });
  run.stats.recruited.forEach((sid) => g.append(h('div', { class: 'got' + (D.species[sid].r !== 'common' ? ' leg' : '') }, h('img', { src: spriteURL(sid), alt: '' }), h('span', null, D.species[sid].n))));
  panel.append(h('h3', null, 'Added to your Museum'), g);
  if (run.codes && run.codes.length) panel.append(codeList(run.codes, 'Tamer Codes from this run'));
  else panel.append(h('p', { class: 'small muted' }, 'Clear Act 1 to earn your first Tamer Code.'));
  panel.append(h('div', { class: 'row' }, steamButton()));
  const su = signupForm(); if (su) panel.append(su);
  panel.append(h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => { run = null; go('starter'); } }, 'New run'), h('button', { class: 'btn', type: 'button', onclick: () => { run = null; go('title'); } }, 'Title')));
  app.append(panel);
}
function museumScreen() {
  const ids = Object.keys(D.species).sort((a, b) => (D.species[a].r === 'common') - (D.species[b].r === 'common') || 0);
  app.append(h('div', { class: 'row', style: 'justify-content:space-between' }, h('h2', null, 'Museum'), h('span', { class: 'stat' }, h('b', null, museum.got.length), ' / ' + ids.length)));
  app.append(h('p', { class: 'muted small' }, 'Every creature you recruit in a run is kept here. Legendaries only come from beating a boss. This collection lives in this browser.'));
  const g = h('div', { class: 'museum' });
  ids.forEach((sid) => {
    const got = museum.got.includes(sid);
    const s = D.species[sid];
    g.append(h('div', { class: (got ? 'got' : '') + (s.r !== 'common' ? ' leg' : ''), title: got ? s.n : '???' }, h('img', { src: spriteURL(sid), class: got ? '' : 'locked', alt: got ? s.n : 'Not yet recruited' }), h('span', null, got ? s.n : '???')));
  });
  const codes = h('div', { class: 'panel' }, h('h2', null, 'Tamer Codes'));
  if (museum.codes.length) codes.append(codeList(museum.codes));
  else codes.append(h('p', { class: 'muted' }, 'No codes yet.'));
  const todo = h('ul', { class: 'howto small muted' });
  if (!museum.codes.some((c) => c.r === 1)) todo.append(h('li', null, 'Blight Siege card back: clear Act 1.'));
  if (!museum.codes.some((c) => c.r === 2)) todo.append(h('li', null, 'Siege Veteran frame: beat any act boss.'));
  todo.append(h('li', null, 'Foil Legend: beat Sporewretch. You get one for each legendary in your deck.'));
  codes.append(todo, h('div', { class: 'row' }, steamButton()));
  const su = signupForm(); if (su) codes.append(su);
  app.append(codes);
  app.append(g);
  app.append(h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => go('title') }, 'Back')));
}

const SCREENS = { title: titleScreen, howto: howtoScreen, starter: starterScreen, map: mapScreen, battle: battleScreen, reward: rewardScreen, rest: restScreen, shop: shopScreen, treasure: treasureScreen, event: eventScreen, end: endScreen, museum: museumScreen };

// Keep a run alive across page updates
if (window.claude && window.claude.hot) {
  try { window.claude.hot.snapshot(() => ({ run, screen: screen === 'battle' ? 'map' : screen, pending })); } catch (e) { /* optional */ }
}
function start(data) {
  if (data && data.run) { run = data.run; pending = data.pending || null; screen = data.screen || 'map'; }
  render();
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

</body>
</html>
