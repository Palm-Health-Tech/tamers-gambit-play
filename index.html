<style>
/* Layout: one column of screens; battle = canvas field over a hand tray. Single dark world (moss night, seal gold, blight violet). */
:root {
  color-scheme: dark;
  --night: #0e1315;
  --panel: #172024;
  --panel2: #1f2b2f;
  --line: #2f3f42;
  --ink: #e9efe8;
  --muted: #9aaba3;
  --seal: #e9b949;
  --seal-ink: #2a1f05;
  --blight: #a35ce0;
  --haven: #5fc88f;
  --danger: #e2574c;
  --f-display: "Pixelify Sans", "Courier New", monospace;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
.app { max-width: 820px; margin: 0 auto; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 10px 24px; display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
h1 { font-size: clamp(40px, 11vw, 76px); line-height: 0.95; }
h2 { font-size: 26px; }
h3 { font-size: 18px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 16px; cursor: pointer; font-weight: 600; min-height: 44px; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, .card:focus-visible, .mapnode:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
.btn.primary { background: var(--seal); color: var(--seal-ink); border-color: var(--seal); font-family: var(--f-display); font-size: 17px; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--night) 92%, transparent); backdrop-filter: blur(6px); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
.hp { display: flex; align-items: center; gap: 8px; min-width: 150px; flex: 1 1 160px; }
.hpbar { flex: 1; height: 12px; background: #0a0d0e; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--haven); transition: width 0.3s; }
.stat { font-family: var(--f-display); font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b { color: var(--seal); font-weight: 600; }
.charms { display: flex; gap: 4px; flex-wrap: wrap; }
.charm { font-family: var(--f-display); font-size: 12px; padding: 3px 7px; border-radius: 4px; background: var(--panel2); border: 1px solid #5a4a1c; color: var(--seal); cursor: help; }

/* Title */
.title { padding-block: 28px 8px; display: grid; gap: 14px; }
.title .kicker { font-family: var(--f-display); color: var(--blight); letter-spacing: 0.2em; text-transform: uppercase; font-size: 13px; }
.title h1 span { color: var(--seal); display: block; }
.title .lede { max-width: 56ch; color: var(--muted); }
.parade { display: flex; gap: 6px; overflow: hidden; height: 64px; align-items: flex-end; mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.parade img { width: 48px; height: 48px; image-rendering: pixelated; animation: march 1.2s steps(2) infinite; }
.parade img.blight { filter: drop-shadow(0 0 5px var(--blight)); }
@keyframes march { 50% { transform: translateY(-3px); } }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px 9px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left; min-width: 0; transition: transform 0.12s, border-color 0.12s; }
.card:hover { border-color: var(--muted); }
.card .band { position: absolute; inset: 0 0 auto 0; height: 4px; border-radius: 8px 8px 0 0; }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.card .name { font-family: var(--f-display); font-size: 15px; font-weight: 600; line-height: 1.1; overflow-wrap: anywhere; }
.cost { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #0b1012; border: 2px solid var(--seal); font-family: var(--f-display); font-size: 15px; color: var(--seal); }
.card .art { height: 58px; display: grid; place-items: center; border-radius: 4px; }
.card .art img { width: 52px; height: 52px; image-rendering: pixelated; }
.chip { font-family: var(--f-display); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; color: #0b0f10; display: inline-block; }
.card .nums { font-family: var(--f-display); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .nums b { color: var(--ink); font-weight: 600; }
.card .perk { font-size: 12px; line-height: 1.3; color: var(--muted); }
.card .perk b { color: var(--ink); }
.card.rare { border-color: #6d5a22; box-shadow: inset 0 0 0 1px #3c3214; }
.card.legend { border-color: var(--seal); box-shadow: 0 0 0 1px var(--seal), 0 0 18px -4px var(--seal); }
.card.picked { border-color: var(--seal); transform: translateY(-4px); box-shadow: 0 0 0 2px var(--seal); }
.card.cant { opacity: 0.5; }
.card .tag { position: absolute; top: 8px; right: 40px; font-family: var(--f-display); font-size: 10px; color: var(--seal); letter-spacing: 0.1em; }

/* Map */
.mapwrap { background: radial-gradient(ellipse at 50% 0%, #2a1b36 0%, transparent 55%), var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; overflow: hidden; }
.mapsvg { width: 100%; max-width: 440px; height: auto; display: block; margin: 0 auto; }
.mapnode { cursor: pointer; }
.mapnode.dim { opacity: 0.35; cursor: default; }
.mapnode.live circle.ring { stroke: var(--seal); stroke-width: 3; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-opacity: 0.35; } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }

/* Battle */
.field { width: min(100%, calc((100vh - 250px) * 1.5)); min-width: min(100%, 320px); margin-inline: auto; position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #0b1012; touch-action: manipulation; }
.field canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.banner { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); font-family: var(--f-display); background: rgba(8,10,11,0.82); border: 1px solid var(--line); padding: 4px 12px; border-radius: 4px; font-size: 14px; pointer-events: none; white-space: nowrap; max-width: 94%; overflow: hidden; text-overflow: ellipsis; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.energy { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 18px; }
.orb { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff3c4, var(--seal) 45%, #8a6510); color: var(--seal-ink); font-weight: 700; font-size: 20px; }
.piles { font-family: var(--f-display); font-size: 13px; color: var(--muted); }
.spacer { flex: 1; }
.hand { display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px 8px; scroll-snap-type: x proximity; }
.hand .card { flex: 0 0 138px; scroll-snap-align: start; }
.towerpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.towerpanel img { width: 48px; height: 48px; image-rendering: pixelated; }
.log { font-size: 13px; color: var(--muted); min-height: 1.4em; }

/* Panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.choice { display: flex; gap: 10px; flex-wrap: wrap; }
.museum { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.museum div { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px; display: grid; justify-items: center; gap: 2px; font-size: 10px; text-align: center; min-width: 0; }
.museum div.got { border-color: #3a4d44; }
.museum div.leg.got { border-color: var(--seal); }
.museum img { width: 44px; height: 44px; image-rendering: pixelated; }
.museum img.locked { filter: brightness(0) opacity(0.45); }
.museum span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.codes { display: flex; flex-direction: column; gap: 8px; }
.coderow { display: flex; gap: 10px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.coderow img { width: 40px; height: 40px; image-rendering: pixelated; }
.codeicon { width: 40px; height: 40px; border-radius: 6px; flex: none; background: repeating-linear-gradient(45deg, var(--blight) 0 6px, #5a2f80 6px 12px); border: 2px solid var(--seal); }
.codebox { font-family: var(--f-display); font-size: 17px; letter-spacing: 0.08em; background: #0b1012; color: var(--seal); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; width: 100%; max-width: 230px; min-width: 0; }
.btn.steam { text-decoration: none; display: inline-flex; align-items: center; background: #1b2838; border-color: #3d5a75; color: #c7d5e0; }
.btn.steam.soon { cursor: default; opacity: 0.85; }
.signup { display: flex; flex-direction: column; gap: 6px; }
.emailbox { flex: 1; min-width: 0; min-height: 40px; background: #0b1012; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #0b0f10; border: 1px solid var(--seal); color: var(--ink); padding: 8px 14px; border-radius: 6px; z-index: 20; font-size: 14px; max-width: 92vw; }
.howto li { margin-bottom: 6px; }
.howto { padding-left: 18px; margin: 0; max-width: 64ch; }
.deckview .cards { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
@media (prefers-reduced-motion: reduce) { .parade img, .mapnode.live circle.ring { animation: none; } .card { transition: none; } }
@media (max-width: 480px) {
  .hand .card { flex-basis: 118px; }
  .hand .card .perk { display: none; }
  .hand .card .art { height: 40px; }
  .hand .card .art img { width: 36px; height: 36px; }
  h2 { font-size: 22px; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hud { gap: 6px 10px; padding: 6px 0; }
  .stat { font-size: 14px; }
  #waveinfo, .elabel, .bar .spacer { display: none; }
  .bar { flex-wrap: nowrap; gap: 6px; }
  .piles { flex: 1; min-width: 0; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .orb { width: 34px; height: 34px; font-size: 17px; }
  .bar .btn.primary { font-size: 15px; padding: 8px 10px; }
  .codebox { font-size: 14px; letter-spacing: 0.02em; }
}
.log:empty { display: none; }
</style>

quietly and alone. Travelers report waking to a soft pressure on their chest — not malicious, only the creature resting near a warm heartbeat, drawn to unfinished sorrow the way a candle draws moths."},"g30":{"n":"Phantgore","t":"ghost","hp":100,"atk":120,"df":101,"spd":120,"spa":144,"r":"common","pal":{"a":"#6825a2","b":"#3e1661","c":"#ff70a6","k":"#222"},"spr":["............","....aaaa....","...aaaaaa...","..bakaakab..","...aaaaaa...","...aaaaaa...","..caaaaaac..",".baaaaaaaab.","..baaaaaab..","...bbbbbb...","............","............"],"evo":"","fork":null,"stage":2,"tribe":"wraithkin","niche":"Phantgore haunt the rooms where grief was never spoken aloud — locked studies, sealed nurseries, the back pews of chapels nobody visits. They do not torment; they hold the memory of a feeling so tightly that the air around them grows heavy, and visitors leave with a sudden need to write an old letter they kept putting off."},"g31":{"n":"Cryosy","t":"ice","hp":63,"atk":61,"df":81,"spd":52,"spa":67,"r":"common","pal":{"a":"#bde0fe","b":"#758a9d","c":"#06d6a0","k":"#222"},"spr":["............","............","..a..aa..a..","..aakaakaa..",".aaaaaaaaaa.",".acaaaaaaca.",".aacaaaacaa.",".baaaaaaaab.","..bbaaaabb..","....baab....",".....bb.....","............"],"evo":"g32","fork":null,"stage":1,"tribe":"rimekin","niche":"Cryosy drifts through high-altitude snowfields and frozen lakeshores, leaving faint crystalline footprints that locals read like weather signs. Shepherds in cold-country villages watch for Cryosy trails at dawn; their presence reliably precedes a hard freeze, giving families one last morning to bring in the livestock."},"g32":{"n":"Snowclash","t":"ice","hp":98,"atk":85,"df":120,"spd":99,"spa":94,"r":"common","pal":{"a":"#a0bed7","b":"#607281","c":"#06d6a0","k":"#222"},"spr":["....acca....","...aaaaaa...","..aaaaaaaa..",".acakaakaca.","baaacaacaaab",".aaaaccaaaa.",".aaaaccaaaa.","bacaaaaaacab",".bcaaaaaacb.","..bcaaaacb..","...baaaab...","....bbbb...."],"evo":"", bb..bb...","............"],"evo":"g36","fork":null,"stage":1,"tribe":"emberkin","niche":"Embro drifts through scrubland at dusk, its small body radiating just enough warmth that moths and beetles spiral toward it as if it were a lantern. Shepherds know a clearing that smells of cinnamon-smoke and draws insects means an Embro is near — and that the grass around it won't freeze overnight."},"g36":{"n":"Magmgeist","t":"fire","hp":93,"atk":95,"df":77,"spd":111,"spa":109,"r":"common","pal":{"a":"#b84a32","b":"#6e2c1e","c":"#06d6a0","k":"#222"},"spr":[".....cc.....","...aaaaaa...","..aaaccaaa..",".cackaakcac.",".acacaacaca.","baaaaaaaaaab",".baaaaaaaab.","..acaaaaca..","..aaaaaaaa..","..baaaaaab..","...bbaabb...",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"emberkin","niche":"Magmgeist moves through fumaroles and steam vents in mountainous country, almost invisible against the rising vapour. Miners treat sightings as a sign that a vent is still active and the tunnel is still safe; a disappearing Magmgeist population means the underground heat is shifting."},"g37":{"n":"Drizling","t":"water","hp":69,"atk":71,"df":77,"spd":80,"spa":75,"r":"common","pal":{"a":"#4cc9f0","b":"#2f7c94","c":"#ffd166","k":"#222"},"spr":["............","...aa..aa...","..aaaaaaaa..",".aackaakcaa.",".aaaaccaaaa.",".aaaaccaaaa.",".baaaaaaaab.","..aaaaaaaa..","..aaaaaaaa..","..baabbaab..","...bb..bb...","............"],"evo":"g38","fork":null,"stage":1,"tribe":"tidecaller","niche":"Drizling haunt the undersides of rain-fed waterfalls and mill-race sluices, their small bodies vibrating at a frequency that keeps moss from fouling the stonework. Mill operators treat them as unpaid maintenance crew and leave fish scraps at the sluice gate each morning."},"g38":{"n":"Squalllord","t":"water","hp":90,"atk":120,"df":115,"spd":88,"spa":126,"r":"common","pal":{"a":"#40aacc","b":"#26667a","c":"#ffd166","k":"#222"},"spr":["....aaaa....","...aaaaaa...","..aacaacaa..","..ackaakca..","..aaaaaaaa..","..aaa ka...","..cacaacac..",".aaaaaaaaaa.","bcaaaaaaaacb",".baaaaaaaab.","..aacbbcaa..","..bcb..bcb..","...b....b...","............"],"evo":"g42","fork":null,"stage":1,"tribe":"voltkin","niche":"Jolto shelters in the gaps between cliff rocks along storm-facing coastlines, where salt air and wave-spray generate a faint ambient charge it can feed on. Lighthouse keepers often find one wedged behind the lantern housing, and most have learned not to move it — a Jolto in residence means the light stays lit through the worst gales."},"g42":{"n":"Joltlord","t":"electric","hp":77,"atk":73,"df":102,"spd":120,"spa":84,"r":"common","pal":{"a":"#d8be56","b":"#817233","c":"#06d6a0","k":"#222"},"spr":[".....aa.....","....aaaa....",".baaaccaaab.","..aakaakaa..","..acaccaca..","..aaaaaaaa..","..aaaaaaaa..",".aaaaaaaaaa.",".aaaaaaaaaa.",".bbaabbaabb.","...bb..bb...","............"],"evo":"","fork":null,"stage":2,"tribe":"voltkin","niche":"Joltlord stakes out the high point of any territory it claims — a bell tower, a hilltop monolith, a ship's crow's nest — and treats incoming lightning as a personal insult to answer. Coastal towns that earn one as a local guardian rarely lose a building to storm strikes, but they also learn not to ring the bell unexpectedly."},"g43":{"n":"Bouldnub","t":"rock","hp":59,"atk":67,"df":72,"spd":44,"spa":50,"r":"common","pal":{"a":"#7d8597","b":"#4d525d","c":"#9b5de5","k":"#222"},"spr":["............","............","....aaaa....","...akaaka...",".aaaaaaaaaa.",".aaaaaaaaaa.",".bacaaaacab.","..bbbccbbb..",".....bb.....","............","............","............"],"evo":"g44","fork":null,"stage":1,"tribe":"stoneguard","niche":"Bouldnub rolls slowly between tidal pools at low tide, its rounded underside worn smooth enough to wedge into crevices where it pries loose shellfish and sea-glass with patient leverage. Children in coastal towns race them during festivals; the tradition is old enough that some family Bouldnub are named across generations."},"g44":{"n":"Shalegeist","t":"rock","hp":98,"atk":80,"df":120,"spd":55,"spa":60,"r":"common","pal":{"a":"#6a7180","b":"#3f434c","c":"#9b5de5","k":"#222"},"spr":["............","............","....aaaa....","..aakcckaa..",".baacaacaab.","..baaaaaab..","...aaaaaa...","...aaccaa...","..baaaaaab..","...baaaab...","....baab....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"stoneguard","niche":"Shalegeist haunts the interior of collapsed mine tunnels and sea caves, its flat slate-plate body sliding through crevices too narrow for a person's hand. Miners who hear the soft scraping of Shalegeist behind a wall treat it as a warning — it retreats before a cave-in the way animals flee before a storm."},"g45":{"n":"Breezle","t":"flying","hp":70,"atk":59,"df":55,"spd":100,"spa":50,"r":"common","pal":{"a":"#cde7ea","b":"#7f8f91","c":"#9b5de5","k":"#222"},"spr":["............","............","....aaaa....","....kcck....",".caaaaaaaac.","bbaaaaaaaabb","..bcaccacb..","...baaaab...","....aaaa....","....abba....","....b..b....","............"],"evo":"g46","fork":null,"stage":1,"tribe":"skykin","niche":"Breezle drifts on sea-breezes above tidal estuaries, scooping small fish with a pouch-beak that acts like a living net. Fisherfolk in river-mouth towns keep records of Breezle feeding patterns the way a chef studies tides — the flocks show where the fish are running before any line goes in."},"g46":{"n":"Flitant","t":"flying","hp":75,"atk":120,"df":94,"spd":120,"spa":102,"r":"common","pal":{"a":"#aec4c6","b":"#687576","c":"#9b5de5","k":"#222"},"spr":["....aaaa....","...caaaac...","...aaaaaa...","...akaaka...","..aaaaaaaa..",".aaacaacaaa.",".bacaaaacab.","..aaaaaaaa..","..baaaaaab..","...baaaab...","....aaaa....","....bbbb...."],"evo":"","fork":null,"stage":2,"tribe":"skykin","niche":"Flitant nests in cliff-face crevices overlooking open water and hunts at dawn by diving nearly vertical, punching through the surface with barely a splash. Coastal children dare each other to hold still while a Flitant dive-bombs within an arm's length — they nearly always pull up in time."},"g47":{"n":"Chitkin","t":"bug","hp":54,"atk":63,"df":68,"spd":77,"spa":50,"r":"common","pal":{"a":"#aacc00","b":"#697e00","c":"#f1faee","k":"#222"},"spr":["............","....aaaa....","....aaaa....","..aakaakaa..",".baaaaaaaab.","..acaaaaca..",".caaaaaaaac.",".baaaaaaaab.","..accbbcca..","..baa..aab..","...bb..bb...","............"],"evo":"g48","fork":null,"stage":1,"tribe":"broodkin","niche":"Chitkin nests in the gaps between dry-stacked stone walls, helping hold the mortar-free structures together by packing debris into crevices. Farmers building field walls will sometimes deliberately leave spaces wide enough for Chitkin to colonize, since the walls last longer with them in."},"g48":{"n":"Larvlord","t":"bug","hp":107,"atk":88,"df":89,"spd":120,"spa":70,"r":"common","pal":{"a":"#90ad00","b":"#566700","c":"#f1faee","k":"#222"},"spr":["....a..a....","...aaccaa...","...aaaaaa...","..aakaakaa..",".baacaacaab.","..aaaaaaaa..","..bbaaaabb..",".b..aaaa..b.","..b.aaaa.b..","...aaaaaa...","...babbab...","....b..b...."],"evo":"","fork":null,"stage":2,"tribe":"broodkin","niche":"Larvlord is rarely seen in daylight; it emerges at dusk to molt on high surfaces — roof ridges, grain-loft beams, old signposts — leaving behind perfect amber husks that traders collect and sell as good-luck charms. Its presence is treated as a quiet endorsement of a structure's solidity."},"g49":{"n":"Grimmite","t":"ghost","hp":41,"atk":69,"df":70,"spd":75,"spa":83,"r":"common","pal":{"a":"#b07ce8","b":"#6d4c8f","c":"#ff70a6","k":"#222"},"spr":["............","............",".....aa.....","....kcck....","..aaaaaaaa..","..aaaaaaaa..","..aaaaaaaa..","..caaaaaac..","..bacaacab..","...aabbaa...","...bb..bb...","............"],"evo":"g50","fork":null,"stage":1,"tribe":"wraithkin","niche":"Grimmites cluster at crossroads and ferry landings after nightfall, where people pace and make difficult choices. Sailors and dock workers tolerate them; the creatures seem to ease the specific ache of indecision, and more than one captain credits a Grimmite with the courage to finally weigh anchor."},"g50":{"n":"Spookath","t":"ghost","hp":81,"atk":110,"df":120,"spd":110,"spa":132,"r":"common","pal":{"a":"#9569c5","b":"#593f76","c":"#ff70a6","k":"#222"},"spr":["............","..aa....aa..",".aaaaaaaaaa.",".aaakaakaaa.","aaaaaaaaaaaa","aaaaaaaaaaaa","baacaaaacaab",".aaaaaaaaaa.",".baaaaaaaab.","..aaaaaaaa..","..bbabbabb..","....b..b...."],"evo":"","fork":null,"stage":2,"tribe":"wraithkin","niche":"Spookath appear on nights when a household's grief has finally curdled into anger — a slammed door, a raised voice, words said that cannot be unsaid. They do not cause the rupture; they arrive to absorb the residue, drifting through walls until dawn, and in the morning the sharpest edges of the argument feel strangely worn smooth."},"g51":{"n":"Cryobit","t":"ice","hp":57,"atk":73,"df":50,"spd":57,"spa":80,"r":"common","pal":{"a":"#bde0fe","b":"#758a9d","c":"#f1faee","k":"#222"},"spr":["............","....a..a....","..aaccccaa..","..cakaakac..","..accaacca..","..aaaaaaaa..",".aaaaaaaaaa.",".baaaaaaaab.","..bbaccabb..","....bbbb....","............","............"],"evo":"g52","fork":null,"stage":1,"tribe":"rimekin","niche":"Cryobit nests in the hollow rime-crusted boulders of coastal cliffs, where sea spray freezes on contact and builds elaborate ice formations overnight. Fishing communities prize them as living tide-clocks — a Cryobit emerging from its hollow before sunrise means the cold current is running strong and the catch will be deep."},"g52":{"n":"Blizmaw","t":"ice","hp":120,"atk":83,"df":98,"spd":92,"spa":91,"r":"common","pal":{"a":"#a0bed7","b":"#607281","c":"#f1faee","k":"#222"},"spr":["............","............","..aacaacaa..",".aaakaakaaa.",".caaaaaaaac.","baaccaaccaab",".aacaaaacaa.",".bbaaaaaabb.","...baaaab...","....aaaa....","....baab....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"rimekin","niche":"Blizmaw haunts the wide frozen flats where ground blizzards churn low and blinding, its enormous jaws splitting the gusts and creating brief pockets of still air. Ice-road traders have domesticated Blizmaw teams to break trail in whiteout storms; a well-bonded Blizmaw walks ahead of the cart and the snow parts like water around a prow."},"g53":{"n":"Nibkin","t":"normal","hp":61,"atk":71,"df":60,"spd":92,"spa":64,"r":"common","pal":{"a":"#b5838d","b":"#705157","c":"#ffd166","k":"#222"},"spr":["............","....aaaa....","...aaaaaa...","..bakaakab..","...baaaab...","....aaaa....","....aaaa....","...aaaaaa...","..bccccccb..","...cabbac...","...bb..bb...","............"],"evo":"g54","fork":null,"stage":1,"tribe":"wildkin","niche":"Nibkin colonises the spaces between walls in old townhouses, living off crumbs and the ambient warmth of inhabited rooms. Residents rarely see one but always know it is there — the faint scrabbling on cold nights feels companionable rather than alarming."},"g54":{"n":"Piptorn","t":"normal","hp":115,"atk":101,"df":75,"spd":87,"spa":91,"r":"common","pal":{"a":"#996f77","b":"#5b4247","c":"#ffd166","k":"#222"},"spr":["............","............","...aaaaaa...",".aaakaakaaa.","ccaaaaaaaacc","aaaaaccaaaaa","baaaaccaaaab",".bacaaaacab.","..aaaaaaaa..",".baacaacaab.","..bbabbabb..","....b..b...."],"evo":"","fork":null,"stage":2,"tribe":"wildkin","niche":"Piptorn has outgrown the wall-spaces and taken up residence in cellar corners and the undersides of staircases, where it maintains a personal cache of objects it finds beautiful: a broken comb, a copper button, a child's lost thimble."},"g55":{"n":"Embrsy","t":"fire","hp":70,"atk":60,"df":62,"spd":63,"spa":69,"r":"common","pal":{"a":"#ff7b54","b":"#9e4c34","c":"#fff","k":"#222"},"spr":["............","...aaaaaa...","...aaaaaa...","..aakaakaa..",".caaaaaaaac.",".bacaaaacab.","..bacaacab..","...aaaaaa...","...abbbba...","..bb....bb..","............","............"],"evo":"g56","fork":null,"stage":1,"tribe":"emberkin","niche":"Embrsy perches on hot-spring rocks and sun-warmed boulders at midday, humming to itself in a frequency that locals call the stone-song. Near settlements, it is welcomed near drying sheds and smoke-houses — its ambient warmth speeds the cure on fish and hides without scorching."},"g56":{"n":"Searrex","t":"fire","hp":92,"atk":100,"df":112,"spd":97,"spa":115,"r":"common","pal":{"a":"#d86847","b":"#813e2a","c":"#fff","k":"#222"},"spr":[".....aa.....","...aaaaaa...","..aacaacaa..","..aakcckaa..","aaacaaaacaaa","aaaaaaaaaaaa","bacbaccabcab",".bb.baab.bb.",".....cc.....","....bbbb....","............","............"],"evo":"","fork":null,"stage":2,"tribe":"emberkin","niche":"Searrex stakes out cliffside sunning ledges and guards them ferociously against other fire-types, radiating sustained heat that can be felt three meters away. Lighthouse keepers on cold coastlines have learned to leave fish offerings on the rocks below — a Searrex roosting on the base of a lighthouse keeps the stonework from icing."},"g57":{"n":"Splishbit","t":"water","hp":63,"atk":81,"df":61,"spd":72,"spa":85,"r":"common","pal":{"a":"#5e9fe0","b":"#3a628a","c":"#9b5de5","k":"#222"},"spr":["............","............","..baa..aab..","...akccka...","...aaccaa...","..aaaaaaaa..","baaaaaaaaaab",".baaaaaaaab.","..baaaaaab..","...babbab...","....b..b....","............"],"evo":"g58","fork":null,"stage":1,"tribe":"tidecaller","niche":"Splishbit inhabit the splash-zones at sea-cave entrances, where they hunt brine-shrimp in pools that refill with each wave. Coastal children find them first — they are the creature most often a person's first memory of something wild choosing to come close."},"g58":{"n":"Aqudon","t":"water","hp":86,"atk":85,"df":108,"spd":101,"spa":89,"r":"common","pal":{"a":"#4f87be","b":"#2f5172","c":"#9b5de5","k":"#222"},"spr":["............","....caac....","...caccac...","..aakaakaa..",".aacaccacaa.",".accaaaacca.",".aaaaaaaaaa.",".aaaaaaaaaa.",".bbbaaaabbb.","....baab....",".....aa.....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"tidecaller","niche":"Aqudon are the slow, deliberate residents of deep coastal rock shelves, visible from above as dark shapes that do not move for hours. Divers report that an Aqudon-inhabited shelf feels calmer than surrounding water — something about their passive bioelectric field seems to quiet other creatures."},"g59":{"n":"Briarit","t":"grass","hp":67,"atk":81,"df":54,"spd":73,"spa":73,"r":"common","pal":{"a":"#74c69d","b":"#477a61","c":"#ffd166","k":"#222"},"spr":["............","............","...aaaaaa...","..aakaakaa..","..caaaaaac..","..acaaaaca..","..aaaaaaaa..","..baaaaaab..","...aaaaaa...","...bbbbbb...","............","............"],"evo":"g60","fork":null,"stage":1,"tribe":"thornkin","niche":"Briarit nests in the thick briar tangles at the edges of old orchards, where it sleeps coiled inside a hollow it lines with shed bark. Orchard keepers prize it because it strips aphid colonies off rose canes without disturbing the fruit trees, working quietly through the night."},"g60":{"n":"Budrex","t":"grass","hp":87,"atk":101,"df":106,"spd":88,"spa":91,"r":"common","pal":{"a":"#62a885","b":"#3a644f","c":"#ffd166","k":"#222"},"spr":["....aaaa....","...aaaaaa...","..aaaccaaa..",".backaakcab.","..aacaacaa..",".aaaaaaaaaa.","bbbcaaaacbbb","...bcaacb...","....baab....",".....aa.....",".....bb.....","............"],"evo":"","fork":null,"stage":2,"tribe":"thornkin","niche":"Budrex occupies the canopy edges of mixed woodland, where it perches on branches and unfurls broad bud-shields to catch morning dew. Water-seekers in dry seasons follow Budrex at dawn — where it drinks, a reliable spring or seep is usually within a hundred paces."},"g61":{"n":"Statit","t":"electric","hp":64,"atk":60,"df":61,"spd":66,"spa":69,"r":"common","pal":{"a":"#ffe066","b":"#9e8a3f","c":"#ffd166","k":"#222"},"spr":["............","....a..a....","..aaaaaaaa..",".ccakaakacc.",".aaaaaaaaaa.",".aaacaacaaa.",".aaaaaaaaaa.",".bbbaccabbb.","....aaaa....","....baab....",".....bb.....","............"],"evo":"g62","fork":null,"stage":1,"tribe":"voltkin","niche":"Statit drifts through dry-season grasslands, building charge by brushing its fur against tall seed-heads as it moves. Farmers in the interior lowlands watch for the soft blue glow that follows a Statit's trail at dusk — it means the air is dry enough to harvest without mold risk."},"g62":{"n":"Statlord","t":"electric","hp":102,"atk":78,"df":72,"spd":120,"spa":90,"r":"common","pal":{"a":"#d8be56","b":"#817233","c":"#ffd166","k":"#222"},"spr":["............","..baa..aab..","...aa..aa...","...ckaakc...","...ccaacc...","..aaaaaaaa..",".caacaacaac.","bbbacaacabbb","...aaaaaa...","...acaaca...","...bbaabb...",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"voltkin","niche":"Statlord settles into a territory and raises its ambient charge so steadily that iron tools left nearby slowly magnetise over weeks. Blacksmiths in towns that host one have found their work inexplicably improved — blades hold an edge longer, nails drive straighter — and most have quietly stopped asking why."},"g63":{"n":"Pebkin","t":"rock","hp":66,"atk":81,"df":109,"spd":31,"spa":61,"r":"common","pal":{"a":"#7d8597","b":"#4d525d","c":"#ef476f","k":"#222"},"spr":["............","............","............","....k..k....","..aaaaaaaa..",".aacaaaacaa.","baaaaccaaaab",".abaaaaaaba.",".b.bcaacb.b.","....bbbb....","............","............"],"evo":"g64","fork":null,"stage":1,"tribe":"stoneguard","niche":"Pebkin gathers in loose clusters around fresh springs and mountain streams, the iron in its pebbled hide staining the stones around it rust-orange over years. Farmers value this — a spring ringed by Pebkin rust-stain is a spring that hasn't run dry in living memory."},"g64":{"n":"Bouldant","t":"rock","hp":88,"atk":120,"df":120,"spd":72,"spa":90,"r":"common","pal":{"a":"#6a7180","b":"#3f434c","c":"#ef476f","k":"#222"},"spr":["....a..a....","...aaccaa...","..aaaaaaaa..",".aaakaakaaa.",".aacaaaacaa.",".aaaaccaaaa.",".aaaaccaaaa.",".aaaaaaaaaa.",".aaaaaaaaaa.",".bbaaaaaabb.","...baaaab...","....bbbb...."],"evo":"","fork":null,"stage":2,"tribe":"stoneguard","niche":"Bouldant plants itself at the entrance to upland pastures and refuses to move, an instinct that functions as a living gate — its bulk stops cattle from wandering onto scree slopes. Shepherds who bond with one can signal it with a tap on the left flank to step aside; the knowledge passes down through farming families like a trade secret."},"g65":{"n":"Aery","t":"flying","hp":72,"atk":63,"df":50,"spd":70,"spa":54,"r":"common","pal":{"a":"#8ecbd6","b":"#587d84","c":"#f1faee","k":"#222"},"spr":["............","...aa..aa...","...aaaaaa...","...akccka...","..aacaacaa..",".acccaaccca.",".baaaaaaaab.","..babbbbab..","...a....a...","...ba..ab...","....bbbb....","............"],"evo":"g66","fork":null,"stage":1,"tribe":"skykin","niche":"Aery nests in the eaves of old stone libraries and bell-towers, drawn to the acoustic resonance inside thick walls. Scholars consider it good luck — an Aery sleeping in the rafters is said to keep the texts dry and the mice away, though no one has ever proven either claim."},"g66":{"n":"Skyloth","t":"flying","hp":82,"atk":102,"df":112,"spd":120,"spa":87,"r":"common","pal":{"a":"#78acb5","b":"#48676c","c":"#f1faee","k":"#222"},"spr":[".....aa.....","...bcaacb...","....acca....","....kcck....","...caaaac...","..aaaaaaaa..",".caaaccaaac.","baaaaaaaaaab",".aaaaaaaaaa.",".baaaaaaaab.","..bbbaabbb..",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"skykin","niche":"Skyloth is a large, slow-soaring creature that circles city squares and market plazas at rooftop height, occasionally dropping feathers that glow briefly before going cold. Vendors collect the feathers as novelties, and the Skyloth seems indifferent to this, dropping more wherever crowds gather thickest."},"g67":{"n":"Chitsy","t":"bug","hp":72,"atk":72,"df":72,"spd":55,"spa":58,"r":"common","pal":{"a":"#bfd200","b":"#768200","c":"#06d6a0","k":"#222"},"spr":["............","....acca....","...aaccaa...","..aakaakaa..","..aaaaaaaa..",".aaacaacaaa.",".baaaaaaaab.","..baccccab..","...baaaab...","....abba....","....b..b....","............"],"evo":"g68","fork":null,"stage":1,"tribe":"broodkin","niche":"Chitsy shelters in the eaves of drying sheds and covered markets, feeding on grain dust and spilled flour that collects in the rafters. Millers who sweep their floors but never their ceilings often find a resident Chitsy population has been quietly cleaning the overhead beams for years."},"g68":{"n":"Skitath","t":"bug","hp":112,"atk":117,"df":77,"spd":112,"spa":94,"r":"common","pal":{"a":"#a2b200","b":"#616a00","c":"#06d6a0","k":"#222"},"spr":["............",".....aa.....",".a..aaaa..a.",".baakaakaab.","..aaaccaaa..","..aaaccaaa..",".aacaaaacaa.",".baaaccaaab.","..bacaacab..","...baaaab...","....aaaa....","....bbbb...."],"evo":"","fork":null,"stage":2,"tribe":"broodkin","niche":"Skitath ranges across rooftops and warehouse rafters, hunting the moths that damage stored cloth and grain. Textile merchants in wetter regions consider a resident Skitath worth more than a cat, since it hunts by vibration and will work all night on rafters a cat can't reach."},"g69":{"n":"Wraitho","t":"ghost","hp":61,"atk":70,"df":46,"spd":61,"spa":84,"r":"common","pal":{"a":"#9d4edd","b":"#613089","c":"#f1faee","k":"#222"},"spr":["............",".....aa.....","..aaaaaaaa..",".aaakaakaaa.",".baacaacaab.","..acaaaaca..","..accaacca..","..ccaaaacc..","..acaaaaca..","..bbbbbbbb..","............","............"],"evo":"g70","fork":null,"stage":1,"tribe":"wraithkin","niche":"Wraitho are found in the spaces between things — the gap under a door, the hollow behind a mirror, the pause between breaths in a sick room. Village healers keep them nearby during long vigils because their presence softens the boundary between waking and sleep, making the final hours easier for both patient and family."},"g70":{"n":"Grimgore","t":"ghost","hp":66,"atk":120,"df":110,"spd":102,"spa":144,"r":"common","pal":{"a":"#8542bb","b":"#4f2770","c":"#f1faee","k":"#222"},"spr":[".....aa.....","..a..bb..a..","..aaa..aaa..",".bcak..kacb.","..aaaaaaaa..","..acaaaaca..",".aaaabbaaaa.",".baab..baab.","..bb....bb..","............","............","............"],"evo":"","fork":null,"stage":2,"tribe":"sporekin","niche":"Grimgore drifts through the understory of old-growth forests and abandoned root cellars, trailing a fine mist of luminescent spores that settle on everything they touch. Farmers find their grain stores haunted by soft glowing prints come morning, but the spores suppress rot — a Grimgore that lingers means the harvest keeps another season."},"g71":{"n":"Floenub","t":"ice","hp":72,"atk":52,"df":73,"spd":58,"spa":57,"r":"common","pal":{"a":"#a2d6f9","b":"#64849a","c":"#ff70a6","k":"#222"},"spr":["............","............","...aaaaaa...","..aakaakaa..","..aaaaaaaa..",".baaaaaaaab.","..baaaaaab..","...aaaaaa...","...aaaaaa...","..baabbaab..","...bb..bb...","............"],"evo":"g72","fork":null,"stage":1,"tribe":"rimekin","niche":"Floenub bobs in the shallows of glacial meltwater streams, its small body riding the current between ice shelves with an effortless rolling motion. Children in mountain hamlets race paper boats against Floenub, and the tradition holds a deep seasonal meaning — whoever's boat finishes nearest a Floenub at the stream's bend is said to have cold, clear luck for the year."},"g72":{"n":"Glacios","t":"ice","hp":105,"atk":108,"df":88,"spd":101,"spa":119,"r":"common","pal":{"a":"#89b5d3","b":"#526c7e","c":"#ff70a6","k":"#222"},"spr":["............","............",".....aa.....",".a..kaak..a.",".accaaaacca.",".aaaaaaaaaa.",".aaaabbaaaa.","bbaab..baabb","..bb.bb.bb..","............","............","............"],"evo":"","fork":null,"stage":2,"tribe":"rimekin","niche":"Glacios presides over deep glacier caves where ancient ice stores the memory of a hundred winters, its massive silhouette visible through translucent blue walls from outside. When a glacier calves unexpectedly, local oral tradition says a Glacios has shifted its weight — a thing it only does when it senses something underneath the ice that troubles it."},"g73":{"n":"Doddy","t":"normal","hp":88,"atk":66,"df":69,"spd":76,"spa":59,"r":"common","pal":{"a":"#b5838d","b":"#705157","c":"#ef476f","k":"#222"},"spr":["............","...cc..cc...","...caaaac...","...ckcckc...","..aaaccaaa..","..aaaaaaaa..",".acaaaaaaca.",".baaaaaaaab.","..bbabbabb..","....b..b....","............","............"],"evo":"g74","fork":null,"stage":1,"tribe":"wildkin","niche":"Doddy perches on fence posts and low stone walls at the edge of cultivated land, watching people with an expression of mild professional concern. It does nothing helpful but its presence there — round, attentive, unjudging — keeps lonelier workers company through long afternoons."},"g74":{"n":"Doddant","t":"normal","hp":95,"atk":92,"df":113,"spd":104,"spa":83,"r":"common","pal":{"a":"#996f77","b":"#5b4247","c":"#ef476f","k":"#222"},"spr":["....a..a....","....caac....","....aaaa....","...akaaka...","..aacaacaa..","acaacaacaaca","baaaaccaaaab",".aaaaaaaaaa.",".caaccccaac.",".bbbbaabbbb.",".....bb.....","............"],"evo":"","fork":null,"stage":2,"tribe":"wildkin","niche":"Doddant has taken on a more active role in the farmyard economy: it follows plough lines and pulls grubs out of turned soil with efficient precision, leaving neat rows of cleared earth behind. Farmers pay it in grain, which it stores with unusual order."},"g75":{"n":"Ashlkin","t":"fire","hp":83,"atk":72,"df":71,"spd":66,"spa":83,"r":"common","pal":{"a":"#d9583b","b":"#863624","c":"#f1faee","k":"#222"},"spr":["............","....a..a....","...aaccaa...","...akaaka...","..aaaaaaaa..",".aaacaacaaa.","baaaaccaaaab",".baaaaaaaab.","..baaccaab..","...baaaab...","....bbbb....","............"],"evo":"g76","fork":null,"stage":1,"tribe":"emberkin","niche":"Ashlkin drifts near freshly extinguished fires and smoldering ruins, sifting through the ash with delicate forelegs for heat-crystals left behind by intense flame. In villages recovering from fire damage, an Ashlkin's presence signals the worst heat has passed — it only appears once the danger is gone."},"g76":{"n":"Blazgeist","t":"fire","hp":82,"atk":84,"df":108,"spd":102,"spa":97,"r":"common","pal":{"a":"#b84a32","b":"#6e2c1e","c":"#f1faee","k":"#222"},"spr":["............","............","....a..a....","...akaaka...",".aaaaccaaaa.",".aacaccacaa.",".acaaaaaaca.","baaaccccaaab",".aaaaaaaaaa.",".baaaaaaaab.","..bbbccbbb..",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"emberkin","niche":"Blazgeist inhabits old burn-scars and wildfire corridors, where it tends the soil in a way that accelerates the return of pioneer plants. Foresters who study fire recovery have noted that burn areas with Blazgeist populations green up measurably faster — it is considered a sign of resilient land."},"g77":{"n":"Tidling","t":"water","hp":77,"atk":62,"df":78,"spd":82,"spa":65,"r":"common","pal":{"a":"#3a86ff","b":"#23539e","c":"#f77f00","k":"#222"},"spr":["............","...c....c...","...aaaaaa...","...akaaka...","...acaaca...","..aaaaaaaa..","baaaaaaaaaab",".baaaaaaaab.","..acabbaca..","..bab..bab..","...b....b...","............"],"evo":"g78","fork":null,"stage":1,"tribe":"tidecaller","niche":"Tidling ride the surf-line exactly where sand meets water, using the turbulence to unmoor shellfish. They are a fixture of beach mornings — the sight of a Tidling working the shore is so ordinary that their absence after a storm is the first signal that something is wrong with the sea."},"g78":{"n":"Splishlord","t":"water","hp":112,"atk":111,"df":97,"spd":117,"spa":117,"r":"common","pal":{"a":"#3171d8","b":"#1d4381","c":"#f77f00","k":"#222"},"spr":[".....aa.....","....aaaa....","..acaaaaca..","..aakaakaa..","..caaaaaac..","..aaaaaaaa..","baacaaaacaab",".aaaaaaaaaa.",".aaaaccaaaa.",".bcacaacacb.","..bbcbbcbb..","....b..b...."],"evo":"","fork":null,"stage":2,"tribe":"tidecaller","niche":"Splishlord occupy the large sea-caves that open only at low tide, and local people tell time by when they emerge to hunt the exposed rock pools. Lighthouse keepers track their schedules as a secondary tide-gauge and know each individual by the pattern of their crest markings."},"g79":{"n":"Sproutle","t":"grass","hp":67,"atk":66,"df":61,"spd":54,"spa":59,"r":"common","pal":{"a":"#74c69d","b":"#477a61","c":"#ffd166","k":"#222"},"spr":["............","............","....acca....","....kaak....","..aaaaaaaa..","..aaaaaaaa..","..acaaaaca..","..bbaccabb..","....baab....",".....aa.....",".....bb.....","............"],"evo":"g80","fork":null,"stage":1,"tribe":"thornkin","niche":"Sproutle wanders upland moors and heath, scattering seeds from a pouch of dried pods on its back as it walks. Moorland villages near Veridia's interior credit Sproutle migrations for the annual bloom of heather that draws summer traders up the high road."},"g80":{"n":"Sproutant","t":"grass","hp":73,"atk":104,"df":105,"spd":104,"spa":94,"r":"common","pal":{"a":"#62a885","b":"#3a644f","c":"#ffd166","k":"#222"},"spr":["....acca....","...aaaaaa...","...aaaaaa...",".aaakaakaaa.","bcaacaacaacb",".ccaaaaaacc.","bcaaaaaaaacb",".aaaaaaaaaa.",".bacaaaacab.","..bbaaaabb..","....bbbb....","............"],"evo":"","fork":null,"stage":2,"tribe":"thornkin","niche":"Sproutant settles into the root-cavities of ancient trees, becoming so still and bark-colored that even experienced tamers walk past it. Woodcutters who inadvertently fell a Sproutant's host tree report the same uneasy guilt for weeks after — the creature watches without aggression, and that steadiness is harder to shake than anger."},"g81":{"n":"Voltsy","t":"electric","hp":80,"atk":66,"df":66,"spd":78,"spa":76,"r":"common","pal":{"a":"#ffd60a","b":"#9e8406","c":"#06d6a0","k":"#222"},"spr":["............","............","....a..a....","..ackcckca..",".baaaaaaaab.","..baaaaaab..","...caccac...","...aaccaa...","...aaccaa...","...bbaabb...",".....bb.....","............"],"evo":"g82","fork":null,"stage":1,"tribe":"voltkin","niche":"Voltsy frequents the copper-roofed civic buildings and clock towers of Veridia's inland cities, keeping the metal warm enough to prevent winter ice from cracking the joins. Custodians have a tradition of painting a small lightning-bolt sigil beside any door the local Voltsy uses as a regular entry point — a courtesy sign."},"g82":{"n":"Voltdon","t":"electric","hp":67,"atk":73,"df":99,"spd":120,"spa":84,"r":"common","pal":{"a":"#d8b508","b":"#816c04","c":"#06d6a0","k":"#222"},"spr":["....aaaa....","...aaaaaa...","...caaaac...","..aakaakaa..",".aaaaaaaaaa.","bcaaaaaaaacb",".aacaaaacaa.",".baaaaaaaab.","..aaaaaaaa..","..baaaaaab..","...bbbbbb...","............"],"evo":"","fork":null,"stage":2,"tribe":"voltkin","niche":"Voltdon anchors itself to a single structure it deems worthy — usually the oldest or tallest in a district — and does not leave for years at a time. People who live near one say the neighbourhood feels steadier, not just electrically, and that arguments settle faster in streets where its low resonant hum carries through the stones."},"g83":{"n":"Geodnub","t":"rock","hp":67,"atk":57,"df":112,"spd":42,"spa":43,"r":"common","pal":{"a":"#8d99ae","b":"#575e6b","c":"#9b5de5","k":"#222"},"spr":["............","............","....aaaa....",".baakaakaab.","..aaaccaaa..","..aaaccaaa..","..cacaacac..","..aaaaaaaa..","..bacaacab..","...bbaabb...",".....bb.....","............"],"evo":"g84","fork":null,"stage":1,"tribe":"stoneguard","niche":"Geodnub carries a hollow cavity in its center packed with raw crystal, which chimes faintly when it moves. In the old hill towns, sleeping with one nearby was considered lucky — the chime means the stone walls are still settled and the night air is still."},"g84":{"n":"Granion","t":"rock","hp":108,"atk":98,"df":120,"spd":57,"spa":74,"r":"common","pal":{"a":"#778293","b":"#474e58","c":"#9b5de5","k":"#222"},"spr":[".....aa.....","....aaaa....","....caac....","...akaaka...","baaaaaaaaaab",".aacaaaacaa.",".aacaaaacaa.",".caaaaaaaac.",".baaaaaaaab.","..bacaacab..","...bbbbbb...","............"],"evo":"","fork":null,"stage":2,"tribe":"stoneguard","niche":"Granion stands at the edge of quarry cliffs with the patient quality of a thing that has been standing for longer than the quarry has existed. Workers who share a site with one over a season report that their cuts never collapse, their charges never misfire — a reputation that may be superstition, but no one wants to test it by driving one off."},"g85":{"n":"Breezit","t":"flying","hp":62,"atk":68,"df":49,"spd":81,"spa":58,"r":"common","pal":{"a":"#8ecbd6","b":"#587d84","c":"#9b5de5","k":"#222"},"spr":["............","....aaaa....","..aaaaaaaa..","..ackaakca..","..aacaacaa..",".bbaaaaaabb.","...aaaaaa...",".aaaaaaaaaa.",".bbacaacabb.","...bbbbbb...","............","............"],"evo":"g86","fork":null,"stage":1,"tribe":"skykin","niche":"Breezit is a tiny, quick creature that skips across the tops of tall grasses and grain fields, eating insects that shelter in the seed-heads. Farmers call them winnowers — a field with active Breezit has measurably lower aphid counts, and their constant low flight keeps the grain stalks gently moving, which strengthens the stems."},"g86":{"n":"Galeath","t":"flying","hp":76,"atk":112,"df":82,"spd":120,"spa":95,"r":"common","pal":{"a":"#78acb5","b":"#48676c","c":"#9b5de5","k":"#222"},"spr":["............","............",".....cc.....","..aakaakaa..",".accaccacca.",".aaacaacaaa.",".acccaaccca.",".acaaaaaaca.",".bcacaacacb.","..aaaaaaaa..","..bbaaaabb..","....bbbb...."],"evo":"","fork":null,"stage":2,"tribe":"skykin","niche":"Galeath rides storm-fronts the way smaller skykin ride thermals — it is drawn to electrical weather and grows visibly more energetic as pressure drops. Storm-watchers and weather-workers on Veridia track bonded Galeath as living instruments, logging their restlessness hours before any cloud appears on the horizon."},"g87":{"n":"Thripet","t":"bug","hp":74,"atk":64,"df":65,"spd":88,"spa":51,"r":"common","pal":{"a":"#9ef01a","b":"#619410","c":"#fff","k":"#222"},"spr":["............",".....aa.....","..aaabbaaa..",".cack..kcac.",".aaaa..aaaa.",".aaaaaaaaaa.","baccaaaaccab",".bbbaaaabbb.","....baab....",".....bb.....","............","............"],"evo":"g88","fork":null,"stage":1,"tribe":"broodkin","niche":"Thripet lives in flower fields and herb gardens, feeding on the nectar of blooms that larger pollinators ignore. Herbalists prize them as living indicators of garden health — a Thripet working a plant means its oils are potent and the harvest will be good."},"g88":{"n":"Thriprex","t":"bug","hp":89,"atk":116,"df":113,"spd":95,"spa":93,"r":"common","pal":{"a":"#86cc16","b":"#507a0d","c":"#fff","k":"#222"},"spr":["............","....aaaa....","...aaccaa...",".caakaakaac.","baaacaacaaab",".aacaccacaa.",".aaaaaaaaaa.",".baaaccaaab.","..bcaaaacb..","...babbab...","....b..b....","............"],"evo":"","fork":null,"stage":2,"tribe":"broodkin","niche":"Thriprex is drawn to the deep interiors of ancient orchards and overgrown estate gardens, where it maintains old blooms that have lost their other pollinators. Groundskeepers in neglected manors sometimes find a resident Thriprex is the only reason a grandmother's rose still flowers."},"g89":{"n":"Grimeen","t":"ghost","hp":39,"atk":94,"df":67,"spd":55,"spa":113,"r":"common","pal":{"a":"#7b2cbf","b":"#4c1b76","c":"#06d6a0","k":"#222"},"spr":["............","............","...a....a...",".aaakaakaaa.",".caaaccaaac.",".aaaaccaaaa.","baaaaaaaaaab",".caaccccaac.",".baaaaaaaab.","..bbbccbbb..",".....bb.....","............"],"evo":"g90","fork":null,"stage":1,"tribe":"sporekin","niche":"Grimeen haunts the mossy stone walls of old cemeteries and the damp corners of barns where something once died and was quietly forgotten. It does not frighten on purpose — it simply cannot stop remembering, and the cold it carries is the cold of a room after someone has just left it."},"g90":{"n":"Duskmaw","t":"ghost","hp":66,"atk":120,"df":99,"spd":120,"spa":144,"r":"common","pal":{"a":"#6825a2","b":"#3e1661","c":"#06d6a0","k":"#222"},"spr":[".....aa.....","....aaaa....","...acaaca...","..aakcckaa..","..caaaaaac..",".aacaaaacaa.",".aacaaaacaa.","bacacaacacab",".bbbaaaabbb.","....cccc....","....bbbb....","............"],"evo":"","fork":null,"stage":2,"tribe":"sporekin","niche":"Duskmaw lurks at the mouths of sea caves and tidal tunnels at dusk, its wide jaw collecting the last warmth of the fading light. Fisherfolk say a Duskmaw in the harbour mouth means a safe return — it only howls when something that should have come home won't."},"g91":{"n":"Hailbit","t":"ice","hp":60,"atk":68,"df":56,"spd":59,"spa":75,"r":"common","pal":{"a":"#bde0fe","b":"#758a9d","c":"#ff70a6","k":"#222"},"spr":["............","............","....a..a....",".aaakaakaaa.",".aaacaacaaa.",".acaaaaaaca.","baaacaacaaab",".bbaaccaabb.","...baaaab...","....abba....","....b..b....","............"],"evo":"g92","fork":null,"stage":1,"tribe":"rimekin","niche":"Hailbit clusters on the underside of storm-clouds where hailstones form, tumbling through the sky in flocks that sound like a distant drumroll on tin roofs. Farm families dread a Hailbit swarm overhead but know better than to shoo them — the hailstones they shed are small, and if you drive them off they scatter and the stones fall large and wild."},"g92":{"n":"Chilltorn","t":"ice","hp":120,"atk":84,"df":100,"spd":88,"spa":92,"r":"common","pal":{"a":"#a0bed7","b":"#607281","c":"#ff70a6","k":"#222"},"spr":["............",".....aa.....","....caac....","..aakaakaa..","..aaaaaaaa..",".baaaaaaaab.","..bacaacab..","...aaaaaa...","...aaccaa...","...bbaabb...","..b..bb..b..","............"],"evo":"","fork":null,"stage":2,"tribe":"rimekin","niche":"Chilltorn patrols the edges of frozen forests where ice-sheeted branches creak and split in the night, its serrated fins shedding small ice blades that ring each tree like a warning fence. Woodcutters have learned to wait for Chilltorn to move on before entering a grove; the ice-shed marks which branches are fatally overloaded and ready to fall."},"g93":{"n":"Moknub","t":"normal","hp":56,"atk":71,"df":65,"spd":66,"spa":64,"r":"common","pal":{"a":"#b5838d","b":"#705157","c":"#ef476f","k":"#222"},"spr":["............","...a....a...","...ac..ca...","..aakaakaa..",".baaaaaaaab.","..aaaaaaaa..","..aaaaaaaa..","..aacaacaa..","..acaaaaca..","..bbcaacbb..","....bbbb....","............"],"evo":"g94","fork":null,"stage":1,"tribe":"wildkin","niche":"Moknub moves through coastal fishing villages, following the smell of salted catch to the drying racks. It never steals outright — it sits below the racks with an expression of such patient dignity that fishers simply hand it the scraps, feeling vaguely that they have done something right."},"g94":{"n":"Doddlord","t":"normal","hp":95,"atk":120,"df":95,"spd":113,"spa":108,"r":"common","pal":{"a":"#996f77","b":"#5b4247","c":"#ef476f","k":"#222"},"spr":["............","............","....a..a....","...akaaka...","..aaaaaaaa..","aacacaacacaa","accaaaaaacca","baaaaaaaaaab",".acbbbbbbca.",".bb......bb.","............","............"],"evo":"","fork":null,"stage":2,"tribe":"wildkin","niche":"Doddlord has the bearing of something that has always been here and always will be. It settles in village squares near wells and crossroads, and locals develop an instinct to check whether it has moved before making any significant decision — if it has shifted, something is coming."},"g95":{"n":"Fumbit","t":"fire","hp":65,"atk":74,"df":65,"spd":79,"spa":85,"r":"common","pal":{"a":"#ff7b54","b":"#9e4c34","c":"#ff70a6","k":"#222"},"spr":["............","...caaaac...","...aaaaaa...","..cakcckac..","..acaaaaca..","..aaaaaaaa..",".caaaaaaaac.",".aacaaaacaa.",".bbbaaaabbb.","....bbbb....","............","............"],"evo":"g96","fork":null,"stage":1,"tribe":"emberkin","niche":"Fumbit lives in smoke-draft chimneys and the upper chambers of kilns, clinging to the inner wall with ceramic-hard toe-pads. Potters and tile-makers consider them indispensable — a Fumbit in the kiln chamber distributes heat more evenly, producing fewer cracked glazes."},"g96":{"n":"Fumoth","t":"fire","hp":73,"atk":120,"df":120,"spd":85,"spa":138,"r":"common","pal":{"a":"#d86847","b":"#813e2a","c":"#ff70a6","k":"#222"},"spr":["............","............",".....cc.....","..aakaakaa..",".acaaaaaaca.",".caccaaccac.","aaaacaacaaaa","bacaaccaacab",".aaaaaaaaaa.",".baaabbaaab.","..bbb..bbb..","............"],"evo":"","fork":null,"stage":2,"tribe":"emberkin","niche":"Fumoth circles smoke columns from a great height, reading thermals off wildfire fronts to judge where the fire is moving. Scouts and rangers have learned to track Fumoth flight direction as a practical early-warning system for which way a blaze will spread."},"g97":{"n":"Gillet","t":"water","hp":52,"atk":70,"df":53,"spd":70,"spa":74,"r":"common","pal":{"a":"#4cc9f0","b":"#2f7c94","c":"#9b5de5","k":"#222"},"spr":["............","...aaaaaa...","..aaaaaaaa..",".ccakaakacc.",".caacaacaac.",".aaacaacaaa.","baaaaaaaaaab",".baaaaaaaab.","..bbaaaabb..","....baab....",".....bb.....","............"],"evo":"g98","fork":null,"stage":1,"tribe":"tidecaller","niche":"Gillet school in the middle-water column of coastal bays, their silver flanks catching light in synchronized flashes that bay-fishers use to locate deeper shoals of food-fish below them. The flashing is a conversation between individuals — a language no one has fully translated, only learned to read."},"g98":{"n":"Wavlord","t":"water","hp":114,"atk":104,"df":86,"spd":88,"spa":109,"r":"common","pal":{"a":"#40aacc","b":"#26667a","c":"#9b5de5","k":"#222"},"spr":["............","..aa....aa..",".aaca..acaa.",".aackaakcaa.",".aacaaaacaa.","aaaaaccaaaaa","a :"#222"},"spr":["............",".....aa.....","..caaaaaac..","..aakaakaa..",".aacaaaacaa.",".ccaccccacc.",".accaccacca.",".baacaacaab.","..baabbaab..","...ab..ba...","...b....b...","............"],"evo":"g102","fork":null,"stage":1,"tribe":"voltkin","niche":"Sparkling skitters along fence-lines and signal-wire routes in farming country, recharging at each post before moving on. Postal riders along rural routes know a Sparkling presence means the wooden posts stay dry-rot-free — it desiccates the fungus that would otherwise eat them."},"g102":{"n":"Ohmhorn","t":"electric","hp":87,"atk":95,"df":77,"spd":120,"spa":109,"r":"common","pal":{"a":"#d8a500","b":"#816300","c":"#fff","k":"#222"},"spr":["............","..aaaaaaaa..","..baaaaaab..","...akaaka...","...acccca...","..aacaacaa..","..baabbaab..","...aa..aa...","...bb..bb...","............","............","............"],"evo":"","fork":null,"stage":2,"tribe":"voltkin","niche":"Ohmhorn grazes the mineral-rich salt flats at the edge of coastal marshes, its heavy horn trailing the ground and picking up trace current from conductive mineral deposits. Salt-flat harvesters have learned to follow Ohmhorn paths when surveying a new flat — where it walks consistently, the mineral concentration is high enough to be worth extracting."},"g103":{"n":"Pebpup","t":"rock","hp":74,"atk":75,"df":104,"spd":48,"spa":56,"r":"common","pal":{"a":"#997b66","b":"#5e4c3f","c":"#9b5de5","k":"#222"},"spr":["............","............",".....aa.....",".ccakaakacc.",".aaaaccaaaa.",".aaaaaaaaaa.","bacaaaaaacab",".baaaaaaaab.","..bbabbabb..","....b..b....","............","............"],"evo":"g104","fork":null,"stage":1,"tribe":"stoneguard","niche":"Pebpup skitters around the feet of people crossing mountain passes, dislodging loose stones from the path ahead with a genuine puppyish eagerness that makes the behavior feel like play rather than work. Travelers who recognize what it's doing leave it a dried fish; the ones who don't trip over it."},"g104":{"n":"Geodhorn","t":"rock","hp":99,"atk":91,"df":120,"spd":87,"spa":68,"r":"common","pal":{"a":"#826856","b":"#4e3e33","c":"#9b5de5","k":"#222"},"spr":["....a..a....","..aaaaaaaa..","..aaaaaaaa..","..aakaakaa..",".aaaaaaaaaa.","caaaaaaaaaac","aaaaaaaaaaaa","bbcaaaaaacbb","..baaaaaab..","...baaaab...","....bbbb....","............"],"evo":"","fork":null,"stage":2,"tribe":"stoneguard","niche":"Geodhorn grazes the sides of ancient roadways, its curved horn scraping lichen and mineral crust from old stone mile-markers. Road keepers in the uplands discovered that stretches with Geodhorn show better-preserved markings — the scraping removes the biological growth that eventually splits the stone."},"g105":{"n":"Galebit","t":"flying","hp":43,"atk":69,"df":56,"spd":79,"spa":59,"r":"common","pal":{"a":"#a8dadc","b":"#688788","c":"#f77f00","k":"#222"},"spr":["............","...aaaaaa...","...aaaaaa...","...akaaka...","..aaaaaaaa..",".baaaaaaaab.","..aaaaaaaa..",".aaacaacaaa.",".baaaaaaaab.","..bbaaaabb..","....bbbb....","............"],"evo":"g106","fork":null,"stage":1,"tribe":"skykin","niche":"Galebit hunts insects in the narrow wind-corridors between tall buildings in town centers, so agile that it can reverse direction in a wingspan's length. City children adopt strays without asking their parents, and the creature is small enough to hide in a satchel, which is precisely the problem."},"g106":{"n":"Skylgeist","t":"flying","hp":72,"atk":81,"df":95,"spd":120,"spa":69,"r":"common","pal":{"a":"#8eb9bb","b":"#556f70","c":"#f77f00","k":"#222"},"spr":["............","....caac....","..aaaaaaaa..",".aaakaakaaa.","aacaaaaaacaa","aaacaaaacaaa","aaaaaaaaaaaa","baccaaaaccab",".bbbaaaabbb.","....baab....",".....aa.....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"skykin","niche":"Skylgeist appears only at dusk, emerging from cliff-face roosts to circle in slow, wide spirals above coastal villages before vanishing again by full dark. Locals leave out shallow water dishes at dusk — not because the Skylgeist drinks from them, but because it has always been done, and the village feels quieter when it circles."},"g107":{"n":"Skitpup","t":"bug","hp":83,"atk":81,"df":61,"spd":79,"spa":65,"r":"common","pal":{"a":"#9ef01a","b":"#619410","c":"#06d6a0","k":"#222"},"spr":["............","............","...ca..ac...","..aakcckaa..",".aacaaaacaa.","bacaaaaaacab",".baaaaaaaab.","..bbbbbbbb..","............","............","............","............"],"evo":"g108","fork":null,"stage":1,"tribe":"broodkin","niche":"Skitpup colonizes the damp undersides of river-crossing logs and stepping-stone clusters, feeding on algae and waterlogged debris. It scatters in every direction when threatened, reassembling downstream at the first gap in the bank — a behavior river-guides use to find alternate fords when the main crossing runs high."},"g108":{"n":"Thriphorn","t":"bug","hp":87,"atk":92,"df":93,"spd":109,"spa":74,"r":"common","pal":{"a":"#86cc16","b":"#507a0d","c":"#06d6a0","k":"#222"},"spr":["....acca....","...aaaaaa...","..aaaaaaaa..","..aakaakaa..","..acaaaaca..","..aaaccaaa..","..acaaaaca..",".aaaaaaaaaa.",".acaaaaaaca.",".bbcaaaacbb.","...baaaab...","....bbbb...."],"evo":"","fork":null,"stage":2,"tribe":"broodkin","niche":"Thriphorn is a solitary creature that marks territory with a rasping call heard most often near river gorges and rocky outcrops where moisture collects. Travelers who hear its call before nightfall know freshwater is close — it never sounds far from a seep or spring."},"g109":{"n":"Wisplet","t":"ghost","hp":42,"atk":109,"df":68,"spd":67,"spa":131,"r":"common","pal":{"a":"#b07ce8","b":"#6d4c8f","c":"#ffd166","k":"#222"},"spr":["............","............","....aaaa....",".aaakaakaaa.",".bacaccacab.","..aaaaaaaa..","..caaaaaac..","..bcaccacb..","...abbbba...","...b....b...","............","............"],"evo":"g110","fork":null,"stage":1,"tribe":"wraithkin","niche":"Wisplets bob along marsh paths and overgrown forest trails at dusk, marking routes that have not been walked for a long time. Locals follow them cautiously; they never lead anywhere dangerous, only to places that were once loved and then forgotten — an old picnic stone, a child's swing rotting on a willow branch."},"g110":{"n":"Gloomclash","t":"ghost","hp":86,"atk":120,"df":94,"spd":100,"spa":144,"r":"common","pal":{"a":"#9569c5","b":"#593f76","c":"#ffd166","k":"#222"},"spr":["............","...aaaaaa...","...acaaca...","...akaaka...","...aaaaaa...",".aaaaaaaaaa.",".aaaaaaaaaa.",".baaaaaaaab.","..aabaabaa..","..ab.bb.ba..","..b......b..","............"],"evo":"","fork":null,"stage":2,"tribe":"wraithkin","niche":"Gloomclash are drawn to arguments that should have happened years ago but didn't — the confrontation that was swallowed, the honest word that was replaced with a polite nod. When one is near, voices rise, tears come, and afterward people feel inexplicably lighter, as if the creature fed on the thing they had been carrying too long."},"g111":{"n":"Hailkin","t":"ice","hp":53,"atk":75,"df":68,"spd":61,"spa":82,"r":"common","pal":{"a":"#a2d6f9","b":"#64849a","c":"#f1faee","k":"#222"},"spr":["............","............","............","...akaaka...","...acaaca...","..ccaaaacc..","..aaaaaaaa..",".aaaaaaaaaa.",".bbaaaaaabb.","...bbbbbb...","............","............"],"evo":"g112","fork":null,"stage":1,"tribe":"rimekin","niche":"Hailkin roosts in the high belltowers and cold-stone steeples of northern towns, where it keeps the iron bells free of ice so the morning toll rings clear across frozen valleys. The bell-keepers of those towns consider Hailkin a ward-creature — the old superstition holds that if the Hailkin leaves a tower the town will lose its voice in the coming winter."},"g112":{"n":"Chilloth","t":"ice","hp":113,"atk":80,"df":88,"spd":102,"spa":88,"r":"common","pal":{"a":"#89b5d3","b":"#526c7e","c":"#f1faee","k":"#222"},"spr":["............","..aa....aa..","..aaaaaaaa..",".aaakcckaaa.","aaaaaaaaaaaa","aaaaaaaaaaaa","baacaaaacaab",".aaaaaaaaaa.",".aaaaaaaaaa.",".baacaacaab.","..bbbaabbb..",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"rimekin","niche":"Chilloth wanders frozen river canyons and ice-floored ravines, its body built low and wide to slide rather than walk, leaving long smooth channels in the ice behind it. Ice-harvesting communities prize these channels — a Chilloth's slide-path is perfectly smooth and graded, and workers use them to run ice blocks from the cutting site down to the storage caves without any hauling at all."},"g113":{"n":"Whiskle","t":"normal","hp":71,"atk":76,"df":69,"spd":68,"spa":68,"r":"common","pal":{"a":"#b5838d","b":"#705157","c":"#06d6a0","k":"#222"},"spr":["............","...a....a...","...aaaaaa...","..cakaakac..",".baaaaaaaab.","..bcabbacb..","...bb..bb...","............","............","....abba....","....b..b....","............"],"evo":"g114","fork":null,"stage":1,"tribe":"wildkin","niche":"Whiskle threads through night markets and lamp-lit stalls, drawn to the overlapping sounds of many conversations at once. It doesn't follow any one person but seems to orbit the emotional centre of a crowd, and its presence makes strangers speak more honestly to each other."},"g114":{"n":"Bumbion","t":"normal","hp":114,"atk":73,"df":104,"spd":83,"spa":66,"r":"common","pal":{"a":"#996f77","b":"#5b4247","c":"#06d6a0","k":"#222"},"spr":["............","....aaaa....","..aaaaaaaa..",".acakaakaca.",".acaaaaaaca.","aacacaacacaa","bacaaaaaacab",".aaaaaaaaaa.",".aaaaccaaaa.",".baaaccaaab.","..bbbbbbbb..","............"],"evo":"","fork":null,"stage":2,"tribe":"wildkin","niche":"Bumbion has grown large enough that when it settles against someone sitting alone on a bench, it is unmistakably deliberate. Dockside healers and town counsellors have quietly adopted the practice of letting a Bumbion into waiting rooms — the creature seems to know who needs the weight of it first."},"g115":{"n":"Fumsy","t":"fire","hp":51,"atk":64,"df":82,"spd":59,"spa":74,"r":"common","pal":{"a":"#e8702a","b":"#8f451a","c":"#ff70a6","k":"#222"},"spr":["............","...ac..ca...","...aaaaaa...","..aakaakaa..",".baaaccaaab.","..aaaaaaaa..","..aacaacaa..",".aaaaaaaaaa.",".bbaaaaaabb.","...bbbbbb...","............","............"],"evo":"g116","fork":null,"stage":1,"tribe":"emberkin","niche":"Fumsy lingers around active cooking fires in small settlements, batting at rising sparks with oversized forepaws the way a kitten bats at dust motes. Families who adopt one find it instinctively redirects sparks away from thatching, making them a low-cost fire-hazard buffer in crowded villages."},"g116":{"n":"Scoroth","t":"fire","hp":100,"atk":107,"df":112,"spd":118,"spa":123,"r":"common","pal":{"a":"#c55f23","b":"#763915","c":"#ff70a6","k":"#222"},"spr":[".....aa.....","....cccc....","....aaaa....","...akaaka...","..aaaaaaaa..",".aaacaacaaa.",".cacaaaacac.",".baaaaaaaab.","..aaaaaaaa..","..abbaabba..","..b..bb..b..","............"],"evo":"","fork":null,"stage":2,"tribe":"emberkin","niche":"Scoroth lairs in the mouths of hot springs and geothermal vents, soaking in mineral-rich superheated water that would scald any other creature. In mining communities, a Scoroth blocking a vent is understood as a warning — when they abandon a vent, the pressure has changed and the shaft may be unsafe."},"g117":{"n":"Drizet","t":"water","hp":56,"atk":52,"df":65,"spd":62,"spa":55,"r":"common","pal":{"a":"#5e9fe0","b":"#3a628a","c":"#ff70a6","k":"#222"},"spr":["............","...aa..aa...","...ba..ab...","....kaak....","...aaaaaa...","..cacaacac..",".bbaaaaaabb.","...aaaaaa...","...aaaaaa...","...bbbbbb...","............","............"],"evo":"g118","fork":null,"stage":1,"tribe":"tidecaller","niche":"Drizet cling to the hulls of anchored boats in sheltered coves, grazing the fouling organisms that would otherwise slow a ship. Sailors learn to recognize the soft tapping of a Drizet at work below the waterline — a hull that goes quiet for too long gets checked for damage."},"g118":{"n":"Tidclash","t":"water","hp":84,"atk":115,"df":120,"spd":115,"spa":121,"r":"common","pal":{"a":"#4f87be","b":"#2f5172","c":"#ff70a6","k":"#222"},"spr":["....aaaa....","....aaaa....","...aaaaaa...","...akaaka...","aa.aaaaaa.aa","aaaaaaaaaaaa","accaaaaaacca","bbaaaaaaaabb","..baaaaaab..","...bcaacb...","....baab....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"tidecaller","niche":"Tidclash live in the surge-channels between offshore sea-stacks, where they have mastered moving through contradicting currents that would batter larger creatures apart. Experienced free-divers use their path through a surge channel as the safest route, following exactly where a Tidclash leads."},"g119":{"n":"Leafmite","t":"grass","hp":71,"atk":48,"df":57,"spd":73,"spa":43,"r":"common","pal":{"a":"#74c69d","b":"#477a61","c":"#f1faee","k":"#222"},"spr":["............","...ca..ac...","..aacbbcaa..",".aaak..kaaa.",".aaac..caaa.","aacaaaaaacaa","baaacaacaaab",".baccaaccab.","..bcaaaacb..","...aabbaa...","...bb..bb...","............"],"evo":"g120","fork":null,"stage":1,"tribe":"thornkin","niche":"Leafmite clings to the undersides of broad-leafed canopy trees, so small and leaf-colored that it is usually only noticed when it drops onto a shoulder. Children in forest settlements adopt them as tiny companions; they are harmless and their presence indicates no harmful fungi nearby."},"g120":{"n":"Sprouttorn","t":"grass","hp":109,"atk":103,"df":74,"spd":99,"spa":93,"r":"common","pal":{"a":"#62a885","b":"#3a644f","c":"#f1faee","k":"#222"},"spr":["............","...acccca...","..aaaaaaaa..",".aackaakcaa.","acaaaaaaaaca","baaaaaaaaaab",".baaaaaaaab.","..aaaaaaaa..","..aaaaaaaa..",".baacbbcaab.","..bbb..bbb..","............"],"evo":"","fork":null,"stage":2,"tribe":"thornkin","niche":"Sprouttorn marks the edges of deep-forest clearings, where it has torn a perimeter of dead wood into a thorn-ridge den. Hunters use Sprouttorn clearings as safe camp-sites — nothing quietly stalks through a Sprouttorn's perimeter without making noise first."},"g121":{"n":"Ohmmite","t":"electric","hp":44,"atk":51,"df":62,"spd":82,"spa":59,"r":"common","pal":{"a":"#ffd60a","b":"#9e8406","c":"#06d6a0","k":"#222"},"spr":["............","...aaaaaa...","..aaaaaaaa..",".aaakaakaaa.",".aaaaaaaaaa.","aaaaaccaaaaa","baacaaaacaab",".bbaaaaaabb.","...babbab...","....b..b....","............","............"],"evo":"g122","fork":null,"stage":1,"tribe":"voltkin","niche":"Ohmmite colonises the inner cavities of large industrial chimneys and kiln stacks, feeding on the galvanic micro-currents where hot exhaust gases interact with the iron lining. Pottery towns that host one report kiln temperatures running half a degree hotter and more even — something the potters accept gratefully without fully understanding."},"g122":{"n":"Sparkath","t":"electric","hp":120,"atk":111,"df":80,"spd":120,"spa":128,"r":"common","pal":{"a":"#d8b508","b":"#816c04","c":"#06d6a0","k":"#222"},"spr":["....aaaa....","...aaaaaa...","..aaaaaaaa..","..aakaakaa..",".aaaaaaaaaa.","aaaaaccaaaaa","baaccaaccaab",".caaaaaaaac.",".bbbaaaabbb.","....baab....",".....bb.....","............"],"evo":"","fork":null,"stage":2,"tribe":"voltkin","niche":"Sparkath follows the undersides of iron bridges and aqueducts, tracing the structural tension in the metal with its antennae as though reading the bridge's mood. Engineers in Veridia's river cities have quietly adopted Sparkath sightings as an informal structural-health check — if it abandons a span, they send inspectors within the week."},"g123":{"n":"Shaleet","t":"rock","hp":72,"atk":62,"df":116,"spd":40,"spa":46,"r":"common","pal":{"a":"#7d8597","b":"#4d525d","c":"#f77f00","k":"#222"},"spr":["............","............","...caaaac...",".bcakaakacb.","..aaaaaaaa..","..ccaaaacc..",".cbbaccabbc.",".b..aaaa..b.","....baab....",".....bb.....","............","............"],"evo":"g124","fork":null,"stage":1,"tribe":"stoneguard","niche":"Shaleet perches on rooftops and crumbling chimney stacks, its paper-thin plating indistinguishable from broken tile at a glance. Old stonecutters in the hill districts say a house with a Shaleet on the ridge has good bones — the creature will only rest on structures that can bear its weight, which turns out to be a reliable indicator of sound masonry."},"g124":{"n":"Bouldion","t":"rock","hp":115,"atk":94,"df":120,"spd":62,"spa":70,"r":"common","pal":{"a":"#6a7180","b":"#3f434c","c":"#f77f00","k":"#222"},"spr":["....aaaa....","..aaaaaaaa..","..caaaaaac..",".aackaakcaa.","bcacaaaacacb",".aaaaaaaaaa.",".aaaaccaaaa.","baaaaccaaaab",".bccaaaaccb.","..cbbbbbbc..","..b......b..","............"],"evo":"","fork":null,"stage":2,"tribe":"stoneguard","niche":"Bouldion settles into dried riverbeds during the hot season, half-buried, its domed back catching morning dew and funneling it into the cracked earth beneath it. In the hill villages of east Veridia, finding a Bouldion's resting hollow marks a reliable water source when the rivers have retreated."},"g125":{"n":"Zephet","t":"flying","hp":71,"atk":51,"df":48,"spd":85,"spa":43,"r":"common","pal":{"a":"#8ecbd6","b":"#587d84","c":"#06d6a0","k":"#222"},"spr":["............","...aaaaaa...","..aacaacaa..","..ackaakca..","..aacaacaa..",".aaaaaaaaaa.",".bbacaacabb.","...baaaab...","....aaaa....","....bbbb....","............","............"],"evo":"g126","fork":null,"stage":1,"tribe":"skykin","niche":"Zephet lives at the edge of the world where the plateau cliffs drop into the sea-fog, and most people know it only as a silhouette banking through the mist. Lighthouse keepers on remote outposts form deep bonds with resident Zephet — they are steady, patient companions through months of fog and silence."},"g126":{"n":"Flitoth","t":"flying","hp":98,"atk":90,"df":91,"spd":120,"spa":76,"r":"common","pal":{"a":"#78acb5","b":"#48676c","c":"#06d6a0","k":"#222"},"spr":["............","....aaaa....","...acaaca...","..aakcckaa..",".aaaaccaaaa.",".aaaaaaaaaa.",".baaaaaaaab.","..aaaccaaa..","..aacaacaa..",".bbaaaaaabb.","...bbaabb...",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"skykin","niche":"Flitoth nests in the uppermost spires of cathedrals and tall monuments, and its long tail-feathers drift down into the plazas below like slow snow. Tamers in cities prize Flitoth for messenger work — it memorizes landmark patterns with unusual accuracy and can navigate return routes across distances that break lesser skykin."},"g127":{"n":"Cicasy","t":"bug","hp":54,"atk":82,"df":53,"spd":51,"spa":66,"r":"common","pal":{"a":"#aacc00","b":"#697e00","c":"#f77f00","k":"#222"},"spr":["............","............","....a..a....",".a.akaaka.a.",".aaaaaaaaaa.","bcaaaaaaaacb",".acaaaaaaca.",".caaaaaaaac.",".bbaaaaaabb.","...babbab...","....b..b....","............"],"evo":"g128","fork":null,"stage":1,"tribe":"broodkin","niche":"Cicasy emerges in great numbers in late summer, singing from every tree and fence post in a chorus that locals use to mark the season's turn. Its song is so tied to harvest time that a year without Cicasy calls is considered an omen worth reporting to the nearest Warden."},"g128":{"n":"Buzzgeist","t":"bug","hp":99,"atk":99,"df":114,"spd":114,"spa":79,"r":"common","pal":{"a":"#90ad00","b":"#566700","c":"#f77f00","k":"#222"},"spr":["............",".....aa.....","...aaaaaa...",".aaakaakaaa.","bacaaaaaacab",".aaaccccaaa.",".caacaacaac.",".baaaaaaaab.","..aaaccaaa..","..baaaaaab..","...babbab...","....b..b...."],"evo":"","fork":null,"stage":2,"tribe":"broodkin","niche":"Buzzgeist is heard far more often than it is seen, its low thrumming flight pattern bouncing off walls and water in a way that makes its location impossible to pin down. Sailors on inland rivers use its call to gauge distance from shore — the buzzing doubles back off cliff faces and the echo tells them how far the rock is."},"g129":{"n":"Shademite","t":"ghost","hp":55,"atk":77,"df":62,"spd":80,"spa":92,"r":"common","pal":{"a":"#9d4edd","b":"#613089","c":"#f1faee","k":"#222"},"spr":["............","...a....a...","..aac..caa..","..aakaakaa..","..aaaaaaaa..",".aaaaaaaaaa.",".baaaaaaaab.","..acaaaaca..","..aaabbaaa..","..bbb..bbb..","............","............"],"evo":"g130","fork":null,"stage":1,"tribe":"wraithkin","niche":"Shademites settle into the corners of libraries, archives, and long-unused workshops, drawn to places where someone poured years of effort into work that was never seen. Scholars working late sometimes find a page they meant to throw away placed carefully on top of the pile — not quite organized, just... remembered."},"g130":{"n":"Shadeath","t":"ghost","hp":104,"atk":120,"df":104,"spd":107,"spa":144,"r":"common","pal":{"a":"#8542bb","b":"#4f2770","c":"#f1faee","k":"#222"},"spr":[".....aa.....","..aaaccaaa..","..aaaaaaaa..",".caakaakaac.",".caaaaaaaac.",".baaaaaaaab.","..acaaaaca..","..caaccaac..",".aaaabbaaaa.",".bbbb..bbbb.","............","............"],"evo":"","fork":null,"stage":2,"tribe":"wraithkin","niche":"Shadeath drift through towns in the weeks following a collective loss — after a flood, a ship that doesn't return, a bad winter. They don't seek out individual mourners; they seem to absorb the distributed grief of a whole community at once, thinning it the way wind disperses fog, until the weight is at least shared."},"g131":{"n":"Floeo","t":"ice","hp":77,"atk":66,"df":56,"spd":54,"spa":73,"r":"common","pal":{"a":"#a2d6f9","b":"#64849a","c":"#ffd166","k":"#222"},"spr":["............","............","............",".aaak..kaaa.",".aaaaaaaaaa.","bacaaaaaacab",".bacaaaacab.","..abbaabba..","..b..aa..b..",".....bb.....","............","............"],"evo":"g132","fork":null,"stage":1,"tribe":"rimekin","niche":"Floeo drifts in loose spirals above frozen bays and harbor mouths, its translucent body catching winter light and scattering soft rainbow halos onto the ice below. Sailors watch Floeo's drift patterns as a navigational aid — the creature instinctively orbits the thickest, most stable ice, and a harbor lit with rainbow halos is a harbor safe for the winter crossing."},"g132":{"n":"Rimeoth","t":"ice","hp":104,"atk":90,"df":89,"spd":120,"spa":99,"r":"common","pal":{"a":"#89b5d3","b":"#526c7e","c":"#ffd166","k":"#222"},"spr":["............","............","...aaaaaa...",".caakaakaac.",".acaaaaaaca.","bcaaaaaaaacb",".baaaaaaaab.","..acaaaaca..","..bcaccacb..","...baccab...","....baab....",".....bb....."],"evo":"","fork":null,"stage":2,"tribe":"rimekin","niche":"Rimeoth stands vigil at the mouths of mountain passes during the season's deepest cold, its enormous frost-coated body blocking the worst of the wind like a living windbreak for the caravans that shelter in its lee. Merchants who travel the ice roads leave offerings of warm food at the pass-mouth — not out of worship but out of practical respect, because a fed Rimeoth stays longer."},"g133":{"n":"Nible","t":"normal","hp":59,"atk":57,"df":86,"spd":76,"spa":51,"r":"common","pal":{"a":"#a8a29e","b":"#686461","c":"#ffd166","k":"#222"},"spr":["............","............","....aaaa....","..aakaakaa..",".acaaaaaaca.","aaaaccccaaaa","bbacaccacabb","..bcaaaacb..","...aaaaaa...","...bbaabb...",".....bb.....","............"],"evo":"g134","fork":null,"stage":1,"tribe":"wildkin","niche":"Nible makes its home in library stacks and scriptorium lofts, navigating the shelves with uncanny precision and occasionally returning misplaced volumes to roughly the correct section. Scholars debate whether it reads or merely memorises the smell of each book's place."},"g134":{"n":"Whiskgore","t":"normal","hp":86,"atk":90,"df":101,"spd":102,"spa":81,"r":"common","pal":{"a":"#8e8986","b":"#555250","c":"#ffd166","k":"#222"},"spr":["............","....acca....","...acaaca...",".aaakaakaaa.",".aaaaaaaaaa.",".aaaaccaaaa.",".baaaaaaaab.","..aaaaaaaa..",".aacaaaacaa.",".baacaacaab.","..bbcaacbb..","....bbbb...."],"evo":"","fork":null,"stage":2,"tribe":"wildkin","niche":"Whiskgore has long since graduated from the library to the archiv
